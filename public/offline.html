<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiada Talian · Portal PPD Dalat</title>
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/ikon-32.png" sizes="32x32">
<style>
  :root { --navy: #0b2a4a; --navy0: #071c33; --gold: #c8962a; --gold2: #e5c066; --t: #e8eef6; --t2: #a9b8cb; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 0%, var(--navy) 0%, var(--navy0) 70%);
    color: var(--t); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  main { max-width: 26rem; text-align: center; display: grid; gap: 18px; justify-items: center; }
  img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { margin: 0; font-size: 1.35rem; text-wrap: balance; }
  p { margin: 0; color: var(--t2); }
  .bar { width: 48px; height: 3px; border-radius: 2px; background: var(--gold); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 22px; background: var(--gold); color: var(--navy0); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold2); outline-offset: 3px; }
  small { color: var(--t2); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <img src="/icons/ikon-192.png" alt="">
  <div class="bar" aria-hidden="true"></div>
  <h1>Tiada sambungan internet</h1>
  <p>Halaman ini belum disimpan untuk kegunaan luar talian. Halaman portal yang pernah anda buka masih boleh dibuka, dan perubahan anda dihantar semula apabila talian pulih.</p>
  <button type="button" onclick="location.reload()">Cuba lagi</button>
  <small>Portal Pengurusan Digital PPD Dalat</small>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
