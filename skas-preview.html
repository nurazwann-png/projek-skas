<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK@S App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">

<style>
/* --- Token system ----------------------------------------------- */
:root {
  --navy:     #0f172a;
  --navy-2:   #1e3a8a;
  --navy-hi:  #2563eb;
  --accent:   #2563eb;
  --accent-h: #1d4ed8;
  --violet:   #7c3aed;
  --violet-l: #ede9fe;
  --gold:     #b45309;
  --gold-l:   #fef3c7;
  --bg:       #eef2ff;
  --surface:  #ffffff;
  --border:   #e2e8f0;
  --border-2: #c7d2fe;
  --t1:       #0f172a;
  --t2:       #334155;
  --t3:       #94a3b8;
  --ok:       #059669;
  --ok-l:     #d1fae5;
  --warn:     #b45309;
  --warn-l:   #fef3c7;
  --danger:   #dc2626;
  --danger-l: #fee2e2;
  --chip:     #dbeafe;
  --chip-fg:  #1e40af;
  --h: 'Plus Jakarta Sans', system-ui, sans-serif;
  --b: 'Inter', system-ui, sans-serif;
  --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.08);
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.05);

  --lv-int: #c2410c; --lv-int-bg: #fed7aa;
  --lv-nat: #1e40af; --lv-nat-bg: #bfdbfe;
  --lv-neg: #047857; --lv-neg-bg: #a7f3d0;
  --lv-bah: #0e7490; --lv-bah-bg: #a5f3fc;
  --lv-dae: #6d28d9; --lv-dae-bg: #ddd6fe;
  --lv-skl: #475569; --lv-skl-bg: #e2e8f0;
  /* aliases used by inline JS-generated HTML */
  --bdr: #e2e8f0;
  --card: #ffffff;
  /* vivid level colors for bars */
  --lv-int-bar: #f97316;
  --lv-nat-bar: #2563eb;
  --lv-neg-bar: #10b981;
  --lv-bah-bar: #06b6d4;
  --lv-dae-bar: #7c3aed;
  --lv-skl-bar: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1a; --surface: #141c2e; --border: #1e2d45;
    --border-2: #263450; --t1: #e8edf8; --t2: #8090aa;
    --t3: #3d4f6a; --chip: #1a2540; --chip-fg: #93c5fd;
    --violet-l: #1e1040; --gold-l: #2c1c00; --ok-l: #052e16;
    --warn-l: #1c0e00; --danger-l: #1a0505;
    --shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.25);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.18);
    --lv-int-bg: #2c1005; --lv-nat-bg: #0c1d40; --lv-neg-bg: #032013;
    --lv-bah-bg: #022010; --lv-dae-bg: #160730; --lv-skl-bg: #111827;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1a; --surface: #141c2e; --border: #1e2d45; --border-2: #263450;
  --t1: #e8edf8; --t2: #8090aa; --t3: #3d4f6a; --chip: #1a2540; --chip-fg: #93c5fd;
  --violet-l: #1e1040; --gold-l: #2c1c00; --ok-l: #052e16;
  --warn-l: #1c0e00; --danger-l: #1a0505;
  --shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.25);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.18);
  --lv-int-bg: #2c1005; --lv-nat-bg: #0c1d40; --lv-neg-bg: #032013;
  --lv-bah-bg: #022010; --lv-dae-bg: #160730; --lv-skl-bg: #111827;
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:var(--b);font-size:14px;line-height:1.5;background:var(--bg);color:var(--t1)}

/* --- Shell --------------------------------------------------- */
.shell{display:flex;height:100%;overflow:hidden}
.sidebar{width:228px;flex-shrink:0;background:linear-gradient(175deg,#0f172a 0%,#1e3a8a 55%,#1d4ed8 100%);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 var(--border),0 2px 12px rgba(15,23,42,.04)}
.content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}

/* --- Sidebar ------------------------------------------------- */
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo .mark{font-family:var(--h);font-size:22px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#93c5fd,#ffffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-logo .sub{font-size:10.5px;color:rgba(255,255,255,.42);margin-top:2px}
.sb-section{padding:12px 12px 2px;flex:1;overflow-y:auto}
.sb-section-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.32);padding:0 8px;margin-bottom:4px}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.55);font-size:13px;font-family:var(--b);font-weight:500;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.sb-btn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.sb-btn.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sb-btn.active svg{opacity:1}
.sb-btn svg{flex-shrink:0;opacity:.65}
.sb-footer{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sb-footer-btn{background:none;border:none;color:#fff;cursor:pointer;text-align:left;width:100%;transition:background .2s;border-radius:0}
.sb-footer-btn:hover{background:rgba(255,255,255,.08)}
.sb-footer-gear{margin-left:auto;opacity:0;transition:opacity .2s;flex-shrink:0}
.sb-footer-btn:hover .sb-footer-gear{opacity:.6}
.av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.sb-uname{font-size:11.5px;font-weight:700;color:#fff}
.sb-urole{font-size:10.5px;color:rgba(255,255,255,.45)}
.sb-ppd{font-size:11px;font-weight:600;color:#93c5fd;margin-top:1px;letter-spacing:.3px}

/* demo role switcher */
.role-sw{padding:8px 10px 6px;background:rgba(255,255,255,.07);margin:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.role-sw-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);margin-bottom:4px;display:block}
.role-sw-btn{display:block;width:100%;background:none;border:none;color:rgba(255,255,255,.5);font-size:11.5px;font-family:var(--b);padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left}
.role-sw-btn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.role-sw-btn.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700}

/* --- Topbar --------------------------------------------------- */
.tb-info .g{font-size:10.5px;color:var(--t3)}
.tb-info .n{font-size:13.5px;font-weight:700;font-family:var(--h)}
.bell-btn{position:relative;background:none;border:none;cursor:pointer;padding:7px;border-radius:10px;color:var(--t2);transition:background .15s}
.bell-btn:hover{background:var(--border)}
.bell-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:#ef4444;border-radius:50%;border:2px solid var(--surface)}

/* --- Generic -------------------------------------------------- */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--b);font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;transition:all .15s}
.btn-pri{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-pri:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,99,235,.4)}
.btn-pri:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn-vio{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 2px 8px rgba(109,40,217,.3)}
.btn-vio:hover{opacity:.9;transform:translateY(-1px)}
.btn-vio:disabled{opacity:.5;transform:none}
.btn-ghost{background:none;border:1.5px solid var(--border);color:var(--t2)}
.btn-ghost:hover{background:var(--chip);border-color:var(--border-2)}
.btn-ghost:disabled{opacity:.45}
.btn-ok{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:10px 0;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:all .15s;box-shadow:0 2px 8px rgba(5,150,105,.3)}
.btn-ok:hover{opacity:.9;transform:translateY(-1px)}
.btn-ok:disabled{opacity:.5;transform:none;box-shadow:none}
.btn-danger{background:none;border:1.5px solid var(--danger);color:var(--danger);padding:10px 0;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:background .15s}
.btn-danger:hover{background:var(--danger-l)}

/* --- Cards ---------------------------------------------------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;overflow:hidden;position:relative}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,23,42,.12),0 16px 40px rgba(15,23,42,.08)}
.stat-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-lbl{font-size:11.5px;color:var(--t2);font-weight:500}
.stat-val{font-size:28px;font-weight:800;font-family:var(--h);line-height:1.1;margin-top:1px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);flex-shrink:0}
.ph{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pt{font-size:14px;font-weight:700;font-family:var(--h)}
.pb{padding:20px}

/* --- Level badges --------------------------------------------- */
.lv{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.03em}
.lv-INT{background:var(--lv-int-bg);color:var(--lv-int)}
.lv-NAT{background:var(--lv-nat-bg);color:var(--lv-nat)}
.lv-NEG{background:var(--lv-neg-bg);color:var(--lv-neg)}
.lv-BAH{background:var(--lv-bah-bg);color:var(--lv-bah)}
.lv-DAE{background:var(--lv-dae-bg);color:var(--lv-dae)}
.lv-SKL{background:var(--lv-skl-bg);color:var(--lv-skl)}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.bw{background:var(--warn-l);color:var(--warn)}
.bo{background:var(--ok-l);color:var(--ok)}
.bd{background:var(--danger-l);color:var(--danger)}
.chip{display:inline-flex;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--chip);color:var(--chip-fg)}
.chip-vio{background:var(--violet-l);color:var(--violet)}
.chip-gold{background:var(--gold-l);color:var(--gold)}
.chip-ok{background:var(--ok-l);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* --- Achievement list rows ------------------------------------ */
.ach-section{display:flex;flex-direction:column;gap:1px}
.ach-group-hdr{padding:10px 20px 6px;display:flex;align-items:center;gap:8px}
.ach-group-hdr .lv{font-size:12px}
.ach-group-count{font-size:11px;color:var(--t3);font-weight:400}
.ach-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s}
.ach-row:hover{background:linear-gradient(90deg,#eef2ff,#f0fdf4 120%)}
.ach-row-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px;opacity:.7}
.ach-row-body{flex:1;min-width:0}
.ach-row-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-row-meta{font-size:11px;color:var(--t3);margin-top:2px}

/* --- Form ----------------------------------------------------- */
.form-wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:12px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:4px}
.fl .req{color:var(--danger);font-size:13px;line-height:1}
.fi,.fs{font-family:var(--b);font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--t1);width:100%;transition:border-color .15s,box-shadow .15s}
.fi:focus,.fs:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fi.autofilled,.fs.autofilled{border-color:var(--violet);background:var(--violet-l)}
.fi::placeholder{color:var(--t3)}
.fta{font-family:var(--b);font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--t1);width:100%;resize:vertical;min-height:80px;transition:border-color .15s}
.fta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.level-note{font-size:11px;color:var(--t3);margin-top:3px;padding-left:2px}

/* --- Custom dropdown ------------------------------------------ */
.cdd{position:relative}
.cdd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--surface);border:1.5px solid var(--border-2);border-radius:10px;font-size:13.5px;color:var(--t1);cursor:pointer;text-align:left;transition:border-color .15s}
.cdd-btn:hover{border-color:var(--accent)}
.cdd-btn.open{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0}
.cdd-btn.placeholder{color:var(--t3)}
.cdd-arrow{flex-shrink:0;transition:transform .15s;color:var(--t3)}
.cdd-btn.open .cdd-arrow{transform:rotate(180deg)}
.cdd-list{position:absolute;top:100%;left:0;right:0;z-index:200;background:var(--surface);border:1.5px solid var(--accent);border-top:none;border-bottom-left-radius:10px;border-bottom-right-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.1);padding-bottom:4px}
.cdd-opt{width:100%;padding:9px 12px;text-align:left;font-size:13.5px;color:var(--t2);background:none;border:none;cursor:pointer;display:block}
.cdd-opt:hover{background:var(--surface2);color:var(--t1)}
.cdd-opt.selected{background:var(--ok-l);color:var(--ok);font-weight:600}

/* --- Upload zone ---------------------------------------------- */
.upzone{border:2px dashed var(--border-2);border-radius:14px;padding:32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--surface)}
.upzone:hover{border-color:var(--accent);background:#eef2ff}
.upzone.has-file{border-color:var(--ok);background:var(--ok-l)}

/* --- AI panel ------------------------------------------------- */
.ai-box{background:linear-gradient(135deg,var(--violet-l),#f5f3ff);border:1px solid rgba(109,40,217,.18);border-radius:12px;padding:14px 16px}
.ai-box-lbl{font-size:10.5px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.ai-box-txt{font-size:12.5px;color:var(--t1);line-height:1.7}

/* --- Approval card -------------------------------------------- */
.apv-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}

/* --- Empty state ---------------------------------------------- */
.empty{text-align:center;padding:56px 24px;color:var(--t3)}

/* --- Animations ----------------------------------------------- */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;display:inline-block}
@keyframes shimmer{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.typing{animation:shimmer 1.2s ease-in-out infinite}

/* --- Page heading --------------------------------------------- */
.pg-title{font-family:var(--h);font-size:20px;font-weight:800;text-wrap:balance;letter-spacing:-.3px}
.pg-sub{font-size:12px;color:var(--t3);margin-top:3px}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* --- Step indicator ------------------------------------------- */
.steps{display:flex;align-items:center;gap:0;margin-bottom:4px}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t3)}
.step.active{color:var(--accent)}
.step.done{color:var(--ok)}
.step-num{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700}
.step-line{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:24px}

/* --- Section divider with label ------------------------------- */
.sdiv{display:flex;align-items:center;gap:10px;margin:4px 0}
.sdiv span{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.sdiv::before,.sdiv::after{content:'';flex:1;height:1px;background:var(--border)}

/* --- Notice --------------------------------------------------- */
.notice{border-radius:10px;padding:10px 14px;font-size:12px;display:flex;align-items:flex-start;gap:9px;line-height:1.55}
.notice-ok{background:var(--ok-l);color:var(--ok)}
.notice-vio{background:var(--violet-l);color:var(--violet)}
.notice-gold{background:var(--gold-l);color:var(--gold)}

/* --- PPD school cards ----------------------------------------- */
.school-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);transition:all .2s}
.school-card:hover{box-shadow:var(--shadow);border-color:var(--border-2);transform:translateY(-1px)}

@media(max-width:640px){
  .sidebar{width:56px}
  .sb-logo .sub,.role-sw,.sb-btn span,.sb-uname,.sb-urole,.sb-ppd{display:none}
  .stat-row{grid-template-columns:1fr 1fr}
  .frow,.frow3{grid-template-columns:1fr}
}

.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}

@media(max-width:600px){
  .chart-kpi-grid{grid-template-columns:1fr 1fr!important}
}
@media(max-width:480px){
  .grid-2col{grid-template-columns:1fr}
  .chart-kpi-grid{grid-template-columns:1fr!important}
  .content{padding:14px 12px;gap:14px}
  .topbar{padding:10px 14px}
  .stat-row{grid-template-columns:1fr}
  .stat-card{padding:14px 16px}
  .stat-val{font-size:22px}
  .stat-ico{width:38px;height:38px;border-radius:9px}
  .pg-title{font-size:17px}
  .pg-head{gap:8px}
  .pg-head .btn,.pg-head button{font-size:12px;padding:7px 12px}
  .panel .pb{padding:14px}
  .panel .ph{padding:12px 14px}
  .ach-row{padding:10px 14px}
  .form-wrap{gap:14px}
  .upzone{padding:22px 16px}
  .sa-wrap{padding:0}
  .sb-logo{padding:14px 10px 12px}
  .pf-hero{padding:20px 18px}
  .pf-grid{grid-template-columns:1fr}
}

/* -- School Profile ------------------------------------------- */
.pf-wrap{display:flex;flex-direction:column;gap:24px;padding:4px 0}
.pf-hero{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%);border-radius:16px;padding:28px 32px;color:#fff;box-shadow:0 4px 24px rgba(37,99,235,.25)}
.pf-avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#fff;flex-shrink:0;border:3px solid rgba(255,255,255,.4)}
.pf-hero-info{flex:1;min-width:0}
.pf-school-name{font-size:1.35rem;font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}

function aiKlasifikasiSekolah(rec) {
  const reasons = []; const passes = []; let layak = true;
  const mappedLevel = LEVEL_MAP_SKPM[rec.level] || rec.level;

  if (rec.level === 'SKL') {
    layak = false;
    reasons.push(`Peringkat Sekolah terlalu rendah untuk SKPM 5.4.2 -- boleh disimpan tetapi tidak layak.`);
  } else if (!LEVELS_LAYAK.includes(mappedLevel)) {
    layak = false;
    reasons.push(`Peringkat "${LVL[rec.level]?.label}" tidak diiktiraf dalam SKPM 5.4.2.`);
  } else if (rec.level === 'BAH') {
    passes.push(`Peringkat Bahagian dikira setaraf Negeri dalam SKPM 5.4.2.`);
  } else {
    passes.push(`Peringkat ${LVL[rec.level]?.label} -- diiktiraf dalam SKPM 5.4.2.`);
  }

  if (!rec.tahap) { layak = false; reasons.push(`Tahap pencapaian tidak diisi.`); }
  else passes.push(`Tahap: ${TAHAP_MAP[rec.tahap]?.short||rec.tahap}`);
  const yr = rec.tarikh ? new Date(rec.tarikh).getFullYear() : null;
  if (yr && yr < TAHUN_SEMASA) { layak = false; reasons.push(`Pencapaian tahun ${yr} tidak layak -- hanya tahun ${TAHUN_SEMASA}.`); }
  if (!rec.pautanEviden) { layak = false; reasons.push(`Pautan evidens (Google Drive PDF) belum diisi.`); }
  return { layak, reasons, passes };
}

const JURULATIH_MIN_TIER   = 2; // NAT tier

const isJurulatihViolation = (peranan, level) =>

// AI Classification -- tentukan layak/tidak layak berdasarkan SKPM 5.4.1
const TAHUN_SEMASA = 2026;
function aiKlasifikasi(rec) {
  const reasons = [];
  const passes  = [];
  let layak = true;

  // 1. Peringkat -- BAH auto-mapped ke NEG; SKL tidak layak
  const mappedLevel = LEVEL_MAP_SKPM[rec.level] || rec.level;
  if (rec.level === 'SKL') {
    layak = false;
    reasons.push(`Peringkat Sekolah terlalu rendah untuk SKPM 5.4.1 Pencapaian Guru. Rekod ini boleh disimpan sebagai rujukan dalaman sahaja.`);
  } else if (!LEVELS_LAYAK.includes(mappedLevel)) {
    layak = false;
    reasons.push(`Peringkat "${LVL[rec.level]?.label||rec.level}" tidak diiktiraf dalam SKPM 5.4.1.`);
  } else if (rec.level === 'BAH') {
    passes.push(`Peringkat Bahagian dikira setaraf Negeri dalam SKPM 5.4.1 -- diiktiraf sebagai peringkat Negeri.`);
  } else {
    passes.push(`Peringkat ${LVL[rec.level]?.label} -- diiktiraf dalam SKPM 5.4.1.`);
  }

  // 2. Jurulatih mesti Kebangsaan ke atas (guna mappedLevel)
  if (isJurulatih(rec.peranan) && levelTier(mappedLevel) > JURULATIH_MIN_TIER) {
    layak = false;
    reasons.push(`Peranan Jurulatih memerlukan pengiktirafan rasmi peringkat Kebangsaan ke atas. Peringkat semasa (${LVL[rec.level]?.label}) tidak memenuhi syarat.`);
  } else if (rec.peranan === 'Jurulatih') {
    passes.push(`Jurulatih diiktiraf peringkat Kebangsaan ke atas -- memenuhi syarat.`);
  }

  // 3. Tahap pencapaian wajib diisi
  if (!rec.tahap) {
    layak = false;
    reasons.push(`Tahap pencapaian tidak diisi. Wajib pilih: Tempat 1, Tempat 2, Tempat 3, Saguhati atau Penyertaan.`);
  } else {
    const th = TAHAP_MAP[rec.tahap];
    if (th) passes.push(`Tahap pencapaian: ${th.short}.`);
  }

  // 4. Tahun semasa
  const tahunRek = rec.tarikh ? new Date(rec.tarikh).getFullYear() : null;
  if (tahunRek && tahunRek < TAHUN_SEMASA) {
    layak = false;
    reasons.push(`Pencapaian tahun ${tahunRek} tidak layak sebagai Pencapaian Guru 5.4.1. Hanya pencapaian tahun ${TAHUN_SEMASA} diterima. Pencapaian tahun sebelum ini perlu dimasukkan ke Kekuatan Kami (A1).`);
  } else if (tahunRek === TAHUN_SEMASA) {
    passes.push(`Tahun pencapaian ${TAHUN_SEMASA} -- memenuhi syarat tahun penilaian semasa.`);
  }

  // 5. Eviden
  if (!rec.pautanEviden) {
    reasons.push('Pautan eviden (PDF Google Drive) belum diisi. Diperlukan semasa input ke sistem SKPM.');
    // nota sahaja -- tidak menjejaskan kelayakan teknikal
  } else {
    passes.push(`Pautan eviden disertakan.`);
  }

  return { layak, reasons, passes };
}

  Object.assign(S, p);
  const nextKey = S.role + '|' + S.view + '|' + S.saView + '|' + S.ppdView + '|' + S.sfDetailId;
  if (prevKey !== nextKey) S._fullRender = true;

  const ct = document.querySelector('.content');
  if (ct && !S._fullRender) {

  bind();
};

function dashRecRow(r) {
  const ai = aiKlasifikasi(r);
  const th = TAHAP_MAP[r.tahap];
  const dot = ai.layak ? 'background:var(--ok)' : 'background:var(--danger)';
  const thHtml = th ? '<div class="ach-row-meta" style="color:var(--gold);font-weight:600;margin-top:1px">'+th.short+'</div>' : '';
  const errHtml = !ai.layak ? '<div class="ach-row-meta" style="color:var(--danger);font-size:11px;margin-top:2px">'+(ai.reasons[0]||'')+'</div>' : '';
  return '<div class="ach-row" data-detail="'+r.id+'">'
    + '<div class="ach-row-dot" style="'+dot+'"></div>'
    + '<div class="ach-row-body">'
    + '<div class="ach-row-name">'+r.program+'</div>'
    + '<div class="ach-row-meta">'+r.peranan+' &middot; '+fmtDate(r.tarikh)+'</div>'
    + thHtml + errHtml

}

function dashCollapsible(groups) {
  if (!groups.length) return '<div class="panel" style="margin-top:12px"><div class="pb"><div class="empty">Tiada rekod.</div></div></div>';
  var lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
  return '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">'
    + groups.map(function(g) {
      var tkKey = 'teacher_'+g.key;
      var open = S.expandedLevels.includes(tkKey);
      var col = (LVL[g.key] && LVL[g.key].color) || '#888';
      var border = open ? col : col+'55';
      var chevron = open ? '90' : '0';
      var rows = open ? '<div class="ach-section" style="border-top:1px solid '+col+'33;padding:0">'+g.recs.map(dashRecRow).join('')+'</div>' : '';
      return '<div style="border-radius:10px;border:1.5px solid '+border+';background:'+col+'0d;overflow:hidden">'
        + '<button data-lvltoggle="'+tkKey+'" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:none;border:none;cursor:pointer;text-align:left">'
        + '<div style="display:flex;align-items:center;gap:10px">'
        + '<span style="padding:3px 10px;border-radius:6px;background:'+col+';color:#fff;font-size:11px;font-weight:700">'+(LVL[g.key] && LVL[g.key].label || g.key)+'</span>'

function ragRefs(rec, ai) {
  const refs = [];
  const mappedLevel = LEVEL_MAP_SKPM[rec.level] || rec.level;

  // Always cite the main SKPM document
  refs.push({
    doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
    section: 'Standard 5, Aspek 5.4, Sub-standard 5.4.1 - Pencapaian Guru',
    excerpt: 'Pencapaian Guru dinilai berdasarkan peringkat pertandingan, peranan guru, tahap pencapaian dan tahun semasa penilaian. Hanya pencapaian dalam tahun penilaian semasa diterima kecuali dinyatakan sebaliknya.',
    page: 'ms. 47-52'
  });

  // Level-specific refs
  if (rec.level === 'INT') {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Jadual 5.4.1(a) - Wajaran Peringkat Pencapaian Guru',
      excerpt: 'Peringkat Antarabangsa membawa wajaran tertinggi dalam penilaian 5.4.1. Pengiktirafan oleh badan antarabangsa yang diiktiraf KPM / UNESCO / SEAMEO layak dikira.',
      page: 'ms. 48'
    });
  } else if (rec.level === 'NAT') {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Jadual 5.4.1(a) - Wajaran Peringkat Pencapaian Guru',
      excerpt: 'Peringkat Kebangsaan merangkumi pertandingan atau pengiktirafan yang dianjurkan atau diiktiraf oleh KPM, kementerian, agensi persekutuan atau badan profesional peringkat kebangsaan.',
      page: 'ms. 48'
    });
  } else if (rec.level === 'NEG' || rec.level === 'BAH') {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Nota Kaki 5.4.1 - Peringkat Bahagian',
      excerpt: 'Peringkat Bahagian KPM dikira setaraf Negeri dalam pengiraan sub-standard 5.4.1. Peringkat Negeri adalah peringkat minimum untuk pencapaian guru yang layak diambilkira.',
      page: 'ms. 49'
    });
  } else if (rec.level === 'DAE') {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Jadual 5.4.1(a) - Had Minimum Peringkat',
      excerpt: 'Peringkat Daerah diiktiraf dalam sub-standard 5.4.1 dengan wajaran yang lebih rendah berbanding Negeri dan Kebangsaan.',
      page: 'ms. 49'
    });
  } else if (rec.level === 'SKL') {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Perenggan 5.4.1, Syarat Minimum Peringkat',
      excerpt: 'Pencapaian peringkat sekolah tidak layak dikira dalam sub-standard 5.4.1 Pencapaian Guru. Rekod ini boleh didokumentasikan dalam sistem dalaman sekolah sebagai rujukan.',
      page: 'ms. 47'
    });
  }

  // Jurulatih refs
  if (isJurulatih(rec.peranan)) {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Perenggan 5.4.1(c) - Syarat Khas Peranan Jurulatih',
      excerpt: 'Guru berperanan sebagai Jurulatih hanya layak dikira dalam sub-standard 5.4.1 sekiranya mempunyai pengiktirafan rasmi badan berautoriti peringkat Kebangsaan ke atas (contoh: lesen FAM/AFC, SUKMA, KPM). Pelantikan dalaman sekolah atau PPD tidak memenuhi syarat.',
      page: 'ms. 51'
    });
  }

  // Tahun refs
  const tahunRek = rec.tarikh ? new Date(rec.tarikh).getFullYear() : null;
  if (tahunRek && tahunRek < TAHUN_SEMASA) {
    refs.push({
      doc: 'Panduan Pelaksanaan SKPM Kualiti@Sekolah Tahun 2026',
      section: 'Perenggan 3.2 - Tempoh Penilaian',
      excerpt: `Hanya pencapaian yang berlaku dalam tahun penilaian semasa (${TAHUN_SEMASA}) layak dimasukkan ke sub-standard 5.4.1. Pencapaian tahun sebelumnya perlu direkodkan di bawah komponen Kekuatan Kami (Standard A1).`,
      page: 'ms. 12'
    });
  }

  // Eviden refs
  refs.push({
    doc: '02_Surat_Pelaksanaan_Pengisian_SKPM_Kualiti@Sekolah_Tahun_2026.pdf',
    section: 'Lampiran B - Senarai Dokumen Sokongan Yang Diterima',
    excerpt: 'Setiap rekod pencapaian guru mesti disertakan eviden yang sah: sijil rasmi, surat pengesahan daripada penganjur, atau pautan ke repositori digital yang boleh disahkan semasa pemantauan.',
    page: 'ms. 3'
  });

  return refs;
}

/* -- Records view (AI evaluation) ------------------------------ */
function viewRecords() {
  const recs = S.records;
  const lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];

  const layakCount = recs.filter(r=>aiKlasifikasi(r).layak).length;
  const dalaman = recs.length - layakCount;

  // Group by level, sorted highest first
  const groups = lvlOrder.map(key => ({
    key,
    recs: recs.filter(r => r.level === key).sort((a,b) => new Date(b.tarikh) - new Date(a.tarikh))
  })).filter(g => g.recs.length > 0);

  const groupHtml = groups.map(g => {
    const lv_obj = LVL[g.key];
    const col = lv_obj ? lv_obj.color : '#888';
    const grpKey = 'rec_grp_' + g.key;
    const open = S.expandedLevels.includes(grpKey);
    const layakInGrp = g.recs.filter(r => aiKlasifikasi(r).layak).length;

    const rowsHtml = g.recs.map(r => {
      const ai = aiKlasifikasi(r);
      const th = TAHAP_MAP[r.tahap];
      const verdict = ai.layak
        ? `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:#dcfce7;color:#15803d;font-size:11px;font-weight:700">${i('<polyline points="20 6 9 17 4 12"/>',12)} Layak SK@S</span>`
        : `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;background:#fef9c3;color:#854d0e;font-size:11px;font-weight:700">${i('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',12)} Simpan Dalaman</span>`;
      const snippet = !ai.layak && ai.reasons[0]
        ? `<div style="margin-top:6px;font-size:11px;color:#854d0e;line-height:1.45">${i('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',11)} ${ai.reasons[0]}</div>`
        : ai.passes[0] ? `<div style="margin-top:6px;font-size:11px;color:#166534;line-height:1.45">${i('<polyline points="20 6 9 17 4 12"/>',11)} ${ai.passes[0]}</div>` : '';

      return `<div style="padding:13px 16px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s" class="rec-row" data-rdid="${r.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:var(--t1);line-height:1.4;margin-bottom:3px">${esc(r.program)}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
              <span style="font-size:11px;color:var(--t2)">${esc(r.peranan)}</span>
              ${th ? `<span style="font-size:11px;color:var(--gold);font-weight:600">${th.short}</span>` : ''}
              <span style="font-size:11px;color:var(--t3)">${fmtDate(r.tarikh)}</span>
            </div>
            ${snippet}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
            ${verdict}
            <span style="font-size:10px;color:#1d4ed8;font-weight:500">${i('<path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2"/><path d="M12 6v6l4 2"/>',11)} Dinilai AI &rsaquo;</span>
          </div>
        </div>
      </div>`;
    }).join('');

    const summary = `<span style="font-size:11px;color:var(--t3);margin-left:4px">${g.recs.length} rekod &middot; ${layakInGrp} layak</span>`;

    return `<div style="border-radius:12px;border:2px solid ${open ? col : col+'44'};background:var(--card);overflow:hidden;transition:border-color .2s">
      <button data-lvltoggle="${grpKey}" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:none;border:none;cursor:pointer;text-align:left">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="padding:3px 12px;border-radius:6px;background:${col};color:#fff;font-size:11px;font-weight:700">${lv_obj ? lv_obj.label : g.key}</span>
          ${summary}
        </div>
        <span style="font-size:18px;color:${col};display:inline-block;transform:rotate(${open?'90':'0'}deg);transition:transform .2s">&rsaquo;</span>
      </button>
      ${open ? `<div>${rowsHtml}</div>` : ''}
    </div>`;
  }).join('');

  // Progress tracker per peringkat (5.4.1)
  // Had: 20 per peringkat — rekod tetap boleh diisi walaupun penuh
  // AI akan cadangkan 20 rekod terbaik apabila melebihi had
  const HAD_PER_PERINGKAT = 20;
  const SKPM_LEVELS = ['INT','NAT','NEG','DAE']; // 4 peringkat diiktiraf sahaja
  const TAHAP_SCORE = { T1:5, T2:4, T3:3, SH:2, SY:1 };
  const recsByLevel = {};
  const allLayakByLevel = {};
  SKPM_LEVELS.forEach(k => {
    const layakRecs = recs.filter(r=>r.level===k&&aiKlasifikasi(r).layak);
    recsByLevel[k] = layakRecs.length;
    // AI sort: tahap score desc, tarikh desc (terkini diutamakan)
    allLayakByLevel[k] = [...layakRecs].sort((a,b)=>{
      const sa = TAHAP_SCORE[a.tahap]||0, sb = TAHAP_SCORE[b.tahap]||0;
      if(sb!==sa) return sb-sa;
      return (b.tarikhmula||'').localeCompare(a.tarikhmula||'');
    });
  });
  const progressSection = `
  <div class="card" style="padding:14px 16px;margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
      <div style="font-weight:700;font-size:13px">Pengisian Rekod SKPM 5.4.1</div>
      <span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:#dbeafe;color:#1e40af">AI Aktif</span>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:12px">Had: ${HAD_PER_PERINGKAT} rekod/peringkat &middot; Tambah rekod tanpa had &mdash; AI pilih terbaik untuk SKPM (Panduan 2026, ms. 54)</div>
    <div style="display:flex;flex-direction:column;gap:10px">
    ${SKPM_LEVELS.map(k=>{
      const col = LVL[k]?.color||'#888';
      const label = LVL[k]?.label||k;
      const count = recsByLevel[k];
      const pct = Math.min(count/HAD_PER_PERINGKAT*100,100);
      const penuh = count>=HAD_PER_PERINGKAT;
      const lebih = count>HAD_PER_PERINGKAT;
      const top20 = allLayakByLevel[k].slice(0,HAD_PER_PERINGKAT);
      const cadangan = lebih ? `<div style="margin-top:6px;padding:7px 10px;border-radius:7px;background:#dbeafe22;border:1px solid #3b82f644">
        <div style="font-size:10px;font-weight:700;color:#1e40af;margin-bottom:4px">&#x2728; AI memilih ${HAD_PER_PERINGKAT} rekod terbaik untuk SKPM (daripada ${count} rekod layak):</div>
        ${top20.slice(0,3).map((r,i)=>`<div style="font-size:10px;color:var(--t2);padding:1px 0">${i+1}. ${esc(r.program||'Rekod')} &mdash; ${TAHAP_MAP[r.tahap]?.short||r.tahap}</div>`).join('')}
        ${count>HAD_PER_PERINGKAT+3?`<div style="font-size:10px;color:var(--t3);margin-top:2px">... dan ${HAD_PER_PERINGKAT-3} lagi rekod dipilih</div>`:''}
      </div>` : '';
      return `<div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:12px;font-weight:700;color:${count>0?col:'var(--t3)'}">${label}</span>
          <span style="font-size:11px;font-weight:700;color:${lebih?'#3b82f6':penuh?'#22c55e':count>0?col:'var(--t3)'}">
            ${lebih?`${HAD_PER_PERINGKAT}/${count} (AI pilih)`:count+' / '+HAD_PER_PERINGKAT+(penuh?' &#x2713;':'')}
          </span>
        </div>
        <div style="height:6px;border-radius:3px;background:var(--bdr);overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${lebih?'#3b82f6':penuh?'#22c55e':col};border-radius:3px;transition:width .4s"></div>
        </div>
        ${cadangan}
      </div>`;
    }).join('')}
    </div>
    ${recs.some(r=>['BAH','SKL'].includes(r.level)) ? `<div style="margin-top:10px;padding:8px 10px;border-radius:7px;background:#f59e0b18;border:1px solid #f59e0b44"><span style="font-size:11px;color:#92400e">&#x26A0; Rekod peringkat Bahagian/Sekolah tidak dikira dalam SKPM 5.4.1 &mdash; disimpan sebagai dalaman sahaja.</span></div>` : ''}
  </div>`;

  return `<div class="pg-head"><div>
    <div class="pg-title">Rekod Pencapaian Saya</div>
    <div class="pg-sub">Disusun mengikut peringkat tertinggi &middot; Status dinilai automatik oleh AI berdasarkan SKPM 5.4.1</div>
  </div>
  <button class="btn-primary" data-view="form">${IC.plus}<span>Tambah Baru</span></button>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <div style="flex:1;min-width:110px;padding:12px 16px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:8px;background:#dbeafe;display:flex;align-items:center;justify-content:center;color:#1e40af">${i('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',16)}</div>
      <div><div style="font-size:11px;color:var(--t2);font-weight:500">Jumlah Rekod</div><div style="font-size:20px;font-weight:800;color:var(--t1)">${recs.length}</div></div>
    </div>
    <div style="flex:1;min-width:110px;padding:12px 16px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:8px;background:#dcfce7;display:flex;align-items:center;justify-content:center;color:#15803d">${i('<polyline points="20 6 9 17 4 12"/>',16)}</div>
      <div><div style="font-size:11px;color:var(--t2);font-weight:500">Layak SK@S</div><div style="font-size:20px;font-weight:800;color:#15803d">${layakCount}</div></div>
    </div>
    <div style="flex:1;min-width:110px;padding:12px 16px;border-radius:10px;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:8px;background:#fef9c3;display:flex;align-items:center;justify-content:center;color:#854d0e">${i('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',16)}</div>
      <div><div style="font-size:11px;color:var(--t2);font-weight:500">Simpan Dalaman</div><div style="font-size:20px;font-weight:800;color:#854d0e">${dalaman}</div></div>
    </div>
  </div>
  ${progressSection}
  <div style="display:flex;flex-direction:column;gap:8px">${groupHtml}</div>`;
}

/* -- Record detail (AI breakdown + RAG refs) ------------------- */
function viewRecordDetail() {
  const rid = S.selectedRecordId;
  const r = S.records.find(x => x.id === rid);
  if (!r) return '<div class="empty">Rekod tidak dijumpai.</div>';

  const ai = aiKlasifikasi(r);
  const th = TAHAP_MAP[r.tahap];
  const lv_obj = LVL[r.level];
  const col = lv_obj ? lv_obj.color : '#888';
  const refs = ragRefs(r, ai);

  const verdictColor = ai.layak ? '#15803d' : '#854d0e';
  const verdictBg    = ai.layak ? '#dcfce7' : '#fef9c3';
  const verdictBorder= ai.layak ? '#86efac' : '#fde047';
  const verdictIcon  = ai.layak
    ? i('<polyline points="20 6 9 17 4 12"/>',20)
    : i('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',20);
  const verdictLabel = ai.layak ? 'LAYAK SK@S - SKPM 5.4.1 Pencapaian Guru' : 'TIDAK LAYAK SK@S - Disyorkan: Simpan Dalaman Sahaja';

  const evidenReasons = ai.reasons.filter(r2 => r2.toLowerCase().includes(evidenKeyword));

  const passRows = ai.passes.filter(p => !p.toLowerCase().includes(evidenKeyword)).map(p =>
    `<div style="display:flex;gap:8px;padding:9px 12px;border-radius:8px;background:#f0fdf4;border:1px solid #bbf7d0">

        <span style="font-size:12.5px;color:#166534;line-height:1.5">Pautan eviden disertakan.</span>

        <span style="color:#64748b;flex-shrink:0;margin-top:1px">${i('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',14)}</span>

  const notLayakNote = !ai.layak

        <span style="font-size:12px;color:#1e40af;line-height:1.5"><b>Cadangan AI:</b> Rekod ini boleh disimpan dalam sistem dalaman sekolah sebagai dokumentasi profesionalisme guru. Ia tidak dihantar ke SKPM 5.4.1 tetapi boleh menyokong komponen lain seperti <b>Kekuatan Kami (A1)</b> atau portfolio guru.</span>

      <div style="padding:9px 13px;background:var(--surface);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)">
        <span style="width:20px;height:20px;border-radius:5px;background:#eff6ff;display:inline-flex;align-items:center;justify-content:center;color:#1d4ed8;font-size:10px;font-weight:700;flex-shrink:0">${idx+1}</span>
        <div style="min-width:0">
          <div style="font-size:11.5px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ref.doc)}</div>
          <div style="font-size:10.5px;color:#1d4ed8;font-weight:600;margin-top:1px">${esc(ref.section)} &middot; ${esc(ref.page)}</div>
        </div>
      </div>
      <div style="padding:9px 13px;font-size:11.5px;color:var(--t2);line-height:1.6;font-style:italic">"${esc(ref.excerpt)}"</div>

          ${th ? `<span style="padding:3px 10px;border-radius:6px;background:var(--gold-l);color:var(--gold);font-size:11px;font-weight:700">${th.short}</span>` : ''}
        </div>
        <div class="pg-title" style="margin-bottom:4px">${esc(r.program)}</div>
        <div class="pg-sub">${esc(r.peranan)} &middot; ${fmtDate(r.tarikh)} &middot; ${esc(r.pengesahan||'--')}</div>

      <div style="display:flex;gap:8px;flex-shrink:0;margin-top:4px">
        <button id="btn-edit-rec" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1.5px solid var(--border-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--t1);cursor:pointer">${i('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',14)} Edit</button>
        <button id="btn-delete-rec" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1.5px solid #fecaca;background:#fef2f2;font-size:13px;font-weight:600;color:#dc2626;cursor:pointer">${i('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>',14)} Padam</button>
      </div>

  </div>`;
}

/* -- Custom dropdown helper ------------------------------------ */
// cdd(id, opts, val, placeholder) → HTML string
// opts: [{val, label}]  val: current value
function cdd(id, opts, val, placeholder) {
  const sel = opts.find(o => o.val === val);
  const label = sel ? sel.label : placeholder;
  const isPlaceholder = !sel;
  return `<div class="cdd" id="cdd-${id}">
    <button type="button" class="cdd-btn${isPlaceholder?' placeholder':''}" data-cdd="${id}">
      <span>${label}</span>
      <svg class="cdd-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>`;
}

/* -- Helpers --------------------------------------------------- */
function summaryRow(k,v) {
  return `<div><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.04em">${k}</div><div style="font-size:13px;font-weight:500;margin-top:2px">${v||'--'}</div></div>`;
}
function fmtDate(d) {
  if (!d) return '--';
  try { return new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}); } catch { return d; }
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

      return `

                    <div style="height:100%;width:${w}%;background:${col};border-radius:99px;transition:width .4s ease"></div>
                  </div>
                </div>`;

              ${layakRecs.length===0?'<div class="empty" style="padding:4px 0;font-size:12px">Tiada rekod layak.</div>':''}
            </div>
          </div>`;
        };
        return barChart(allTeacherRecs, aiKlasifikasi, 'Pencapaian Guru 5.4.1', '#2563eb')
             + barChart(sRecs, aiKlasifikasiSekolah, 'Pencapaian Sekolah 5.4.2', '#7c3aed');
      })()}
    </div>
  </div>

  <!-- &#9314; Analisis Kategori Sekolah -->
  <div style="margin-bottom:24px">
    <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:8px">
      Analisis Kategori Pencapaian Sekolah
      <span style="font-size:11px;font-weight:500;color:var(--t3);background:var(--chip);padding:2px 8px;border-radius:99px">SKPM 5.4.2</span>
    </div>
    ${(()=>{
      const katColors = ['#2563eb','#7c3aed','#059669','#d97706','#db2777','#0891b2','#64748b'];
      const katIcons  = ['&#x1F3C6;','&#x1F393;','&#x26BD;','&#x1F3A8;','&#x1F30D;','&#x1F52C;','&#x1F4CB;'];
      return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">
        ${KATEGORI.map((k,ki)=>{
          const total  = sRecs.filter(r=>r.kategori===k.val).length;
          const layakK = sRecs.filter(r=>r.kategori===k.val&&aiKlasifikasiSekolah(r).layak).length;
          const pct    = total>0?Math.round(layakK/total*100):0;
          const col    = katColors[ki%katColors.length];
          const dash   = 2*Math.PI*22; // circumference r=22
          const offset = dash*(1-pct/100);
          return `<div style="background:var(--surface);border-radius:14px;border:1.5px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:18px">${katIcons[ki%katIcons.length]}</span>
              <svg width="44" height="44" viewBox="0 0 44 44">
                <circle cx="22" cy="22" r="18" fill="none" stroke="var(--border)" stroke-width="4"/>
                <circle cx="22" cy="22" r="18" fill="none" stroke="${col}" stroke-width="4"
                  stroke-dasharray="${2*Math.PI*18}" stroke-dashoffset="${2*Math.PI*18*(1-pct/100)}"
                  stroke-linecap="round" transform="rotate(-90 22 22)"/>
                <text x="22" y="26" text-anchor="middle" font-size="10" font-weight="800" fill="${col}">${pct}%</text>
              </svg>
            </div>
            <div>
              <div style="font-size:12px;font-weight:700;color:var(--t1);line-height:1.3">${k.label}</div>
              <div style="font-size:11px;color:var(--t3);margin-top:3px"><span style="color:${col};font-weight:700">${layakK}</span> layak / ${total} rekod</div>

            <div style="background:var(--border);border-radius:99px;height:5px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${col};border-radius:99px"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${sRecs.length===0?'<div class="panel"><div class="pb"><div class="empty">Tiada rekod pencapaian sekolah.</div></div></div>':''}`;
    })()}
  </div>

  <!-- &#9315; Utiliti Slot 5.4.2 -->
  <div style="margin-bottom:24px">
    <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:8px">
      Utiliti Slot Pencapaian Sekolah
      <span style="font-size:11px;font-weight:500;color:var(--t3);background:var(--chip);padding:2px 8px;border-radius:99px">Maks. 20 slot / peringkat &middot; Keutamaan tertinggi dahulu</span>
    </div>
    ${(()=>{
      const MAX_SLOT = 20;
      const lvlColors2 = {INT:'#7c3aed',NAT:'#2563eb',NEG:'#0891b2',BAH:'#0891b2',DAE:'#059669',SKL:'#94a3b8'};
      const levelOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
      const sorted   = [...sRecs].sort((a,b)=>levelOrder.indexOf(a.level)-levelOrder.indexOf(b.level));
      const counted  = sorted.slice(0,MAX_SLOT);
      const overflow = sorted.slice(MAX_SLOT);
      const used     = counted.length;
      const pct      = Math.round(used/MAX_SLOT*100);
      const col      = pct>=90?'#dc2626':pct>=60?'#f59e0b':'#059669';
      const breakdown= LEVELS.filter(l=>LEVELS_SEKOLAH.includes(l.key)).map(l=>({...l,cnt:counted.filter(r=>r.level===l.key).length})).filter(l=>l.cnt>0);

      // 20 slot boxes
      const boxes = Array.from({length:MAX_SLOT},(_,idx)=>{
        const rec = counted[idx];
        const bc  = rec ? (lvlColors2[rec.level]||'#64748b') : 'var(--border)';
        const title = rec ? rec.program+' ('+( LVL[rec.level]?.label||rec.level)+')' : 'Kosong';
        return `<div title="${esc(title)}" style="width:100%;aspect-ratio:1;border-radius:6px;background:${bc};opacity:${rec?1:.25};cursor:${rec?'default':'default'}"></div>`;
      }).join('');

      return `<div class="panel">
        <div class="pb" style="display:flex;flex-direction:column;gap:16px">

          <!-- top row: big number + slot grid -->
          <div style="display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center">
            <div style="text-align:center;padding:16px 20px;border-radius:12px;background:${col}18;border:2px solid ${col}33">
              <div style="font-size:40px;font-weight:900;color:${col};line-height:1">${used}</div>
              <div style="font-size:11px;color:var(--t3);margin-top:2px">/ ${MAX_SLOT} slot</div>
              <div style="font-size:12px;font-weight:700;color:${col};margin-top:6px">${MAX_SLOT-used} baki</div>
            </div>
            <div>
              <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:8px">${boxes}</div>
              <div style="background:var(--border);border-radius:99px;height:8px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${col};border-radius:99px;transition:width .4s"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-top:4px">
                <span>0</span><span style="font-weight:700;color:${col}">${pct}% digunakan</span><span>20</span>
              </div>
            </div>
          </div>

          <!-- legend -->
          ${breakdown.length?`<div style="display:flex;flex-wrap:wrap;gap:8px">
            ${breakdown.map(l=>`<div style="display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:${lvlColors2[l.key]||'#64748b'}18;border:1px solid ${lvlColors2[l.key]||'#64748b'}44">
              <span style="width:8px;height:8px;border-radius:50%;background:${lvlColors2[l.key]||'#64748b'};display:inline-block"></span>
              <span style="font-size:11px;font-weight:600;color:var(--t1)">${l.label}</span>
              <span style="font-size:12px;font-weight:800;color:${lvlColors2[l.key]||'#64748b'}">${l.cnt}</span>
            </div>`).join('')}
          </div>`:''}

          ${overflow.length
            ?`<div style="padding:10px 14px;background:#fef2f2;border-radius:10px;border:1px solid #fecaca;font-size:12px;color:#dc2626">
                <b>&#x26A0; ${overflow.length} rekod melebihi had slot</b> — tidak dikira dalam SKPM 5.4.2:<br>
                <span style="opacity:.8">${overflow.map(r=>`${r.program} (${LVL[r.level]?.label||r.level})`).join(', ')}</span>
              </div>`
            :`<div style="padding:10px 14px;background:#f0fdf4;border-radius:10px;border:1px solid #bbf7d0;font-size:12px;color:#15803d">
                &#x2713; Semua rekod dalam had slot yang dibenarkan.
              </div>`}
        </div>
      </div>`;
    })()}
  </div>

  <!-- &#9316; Analisis Peranan Guru -->
  <div style="margin-bottom:8px">
    <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:8px">
      Analisis Peranan Guru
      <span style="font-size:11px;font-weight:500;color:var(--t3);background:var(--chip);padding:2px 8px;border-radius:99px">SKPM 5.4.1</span>
    </div>
    ${(()=>{
      const perananColors = ['#2563eb','#7c3aed','#059669','#d97706','#db2777'];
      const perananIcons  = ['&#x1F947;','&#x1F3BD;','&#x1F468;&#x200D;&#x1F3EB;','&#x1F3AF;','&#x1F3C5;'];
      const maxP = Math.max(1,...PERANAN.map(p=>allTeacherRecs.filter(r=>r.peranan===p.val).length));
      const rows = PERANAN.map((p,pi)=>{
        const total  = allTeacherRecs.filter(r=>r.peranan===p.val).length;
        const layakP = tLayak.filter(r=>r.peranan===p.val).length;
        const tidakP = total - layakP;
        const pct    = total>0?Math.round(layakP/total*100):0;
        const col    = perananColors[pi%perananColors.length];
        const wLayak = total>0?Math.round(layakP/maxP*100):0;
        const wTidak = total>0?Math.round(tidakP/maxP*100):0;
        return `<div style="background:var(--surface);border-radius:12px;border:1.5px solid var(--border);padding:14px 16px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
            <span style="font-size:20px">${perananIcons[pi%perananIcons.length]}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:700;color:var(--t1)">${p.val}</div>
              <div style="font-size:11px;color:var(--t3);margin-top:1px">${total} rekod</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:18px;font-weight:800;color:${col}">${pct}%</div>
              <div style="font-size:10px;color:var(--t3)">layak</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:10px;color:#059669;font-weight:600;min-width:42px">Layak</span>
              <div style="flex:1;background:var(--border);border-radius:99px;height:7px;overflow:hidden">
                <div style="height:100%;width:${wLayak}%;background:#059669;border-radius:99px"></div>
              </div>
              <span style="font-size:11px;font-weight:700;color:#059669;min-width:18px;text-align:right">${layakP}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:10px;color:#dc2626;font-weight:600;min-width:42px">Tidak</span>
              <div style="flex:1;background:var(--border);border-radius:99px;height:7px;overflow:hidden">
                <div style="height:100%;width:${wTidak}%;background:#fca5a5;border-radius:99px"></div>
              </div>
              <span style="font-size:11px;font-weight:700;color:#dc2626;min-width:18px;text-align:right">${tidakP}</span>
            </div>
          </div>
        </div>`;
      }).join('');
      return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
        ${rows}
        ${allTeacherRecs.length===0?'<div class="panel" style="grid-column:1/-1"><div class="pb"><div class="empty">Tiada rekod.</div></div></div>':''}
      </div>`;
    })()}
  </div>`;
}

/* -- School Achievements view (5.4.2) -------------------------- */
function viewSchoolAchievements() {
  const recs = S.schoolRecords;
  const layak = recs.filter(r=>aiKlasifikasiSekolah(r).layak).length;
  const tidakLayak = recs.length - layak;

  // group by level (highest first)
  const grouped = {};
  LEVELS.filter(l=>LEVELS_SEKOLAH.includes(l.key)).forEach(l=>{
    const items = recs.filter(r=>r.level===l.key);
    if (items.length) grouped[l.key] = items;
  });

  const recRow = r => {
    const ai = aiKlasifikasiSekolah(r);
    const th = TAHAP_MAP[r.tahap];
    return `<div class="ach-row skl-row-click" data-sfdetail="${r.id}" style="align-items:flex-start">
      <div class="ach-row-dot" style="margin-top:5px;${ai.layak?'background:var(--ok)':'background:var(--danger)'}"></div>
      <div class="ach-row-body">
        <div class="ach-row-name">${esc(r.program)}</div>
        <div class="ach-row-meta">${fmtDate(r.tarikh)}${th?' &middot; '+th.short:''}</div>
        ${!ai.layak?`<div class="ach-row-meta" style="color:var(--danger);font-size:11px;margin-top:2px">${ai.reasons[0]||''}</div>`
          :`<div class="ach-row-meta" style="color:var(--ok);font-size:11px;margin-top:2px">${ai.passes[0]||''}</div>`}
      </div>
      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        ${ai.layak
          ? '<span class="badge" style="background:#d1fae5;color:#065f46;font-size:10px">&#10003; Layak 5.4.2</span>'
          : '<span class="badge" style="background:#fee2e2;color:#b91c1c;font-size:10px">&#10007; Tidak Layak</span>'}
        <div style="display:flex;gap:5px">
          <button class="skl-edit-btn" data-srid="${r.id}" style="padding:4px 10px;border-radius:7px;border:1.5px solid var(--border-2);background:var(--surface);font-size:11px;font-weight:600;color:var(--t1);cursor:pointer">${i('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',11)} Edit</button>
          <button class="skl-del-btn" data-srid="${r.id}" data-srname="${esc(r.program)}" style="padding:4px 10px;border-radius:7px;border:1.5px solid #fecaca;background:#fef2f2;font-size:11px;font-weight:600;color:#dc2626;cursor:pointer">${i('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',11)} Padam</button>
        </div>
      </div>
    </div>`;
  };

  return `
  <div class="pg-head">
    <div>
      <div class="pg-title">Pencapaian Sekolah <span style="font-size:12px;font-weight:500;color:var(--t3)">SKPM 5.4.2</span></div>
      <div class="pg-sub">SK Wangsa Maju 1 &middot; Tahun ${TAHUN_SEMASA} &middot; Wajaran 10%</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-ico" style="background:#dbeafe;color:#1e40af">${i('<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',22)}</div>
      <div><div class="stat-lbl">Jumlah Rekod</div><div class="stat-val">${recs.length}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-ico" style="background:var(--ok-l);color:var(--ok)">${i('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',22)}</div>
      <div><div class="stat-lbl">Layak SKPM 5.4.2</div><div class="stat-val" style="color:var(--ok)">${layak}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-ico" style="background:var(--danger-l);color:var(--danger)">${i('<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',22)}</div>
      <div><div class="stat-lbl">Tidak Layak</div><div class="stat-val" style="color:var(--danger)">${tidakLayak}</div></div>
    </div>
  </div>

  <!-- Progress tracker 5.4.2: 20 per peringkat — rekod boleh melebihi had, AI pilih terbaik -->
  <div class="card" style="padding:14px 16px;margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
      <div style="font-weight:700;font-size:13px">Pengisian Rekod SKPM 5.4.2</div>
      <span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:#dbeafe;color:#1e40af">AI Aktif</span>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:12px">Had: 20 rekod/peringkat &middot; Tambah rekod tanpa had &mdash; AI pilih terbaik untuk SKPM (Panduan 2026, ms. 54)</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${LEVELS_SEKOLAH.map(k=>{
        const col = LVL[k]?.color||'#888';
        const label = LVL[k]?.label||k;
        const TAHAP_SCORE_S = { T1:5, T2:4, T3:3, SH:2, SY:1 };
        const layakRecs = (grouped[k]||[]).filter(r=>aiKlasifikasiSekolah(r).layak);
        const count = layakRecs.length;
        const top20S = [...layakRecs].sort((a,b)=>{
          const sa=TAHAP_SCORE_S[a.tahap]||0, sb=TAHAP_SCORE_S[b.tahap]||0;
          if(sb!==sa) return sb-sa;
          return (b.tarikh||'').localeCompare(a.tarikh||'');
        });
        const pct = Math.min(count/20*100,100);
        const penuh = count>=20;
        const lebih = count>20;
        const cadangan = lebih ? `<div style="margin-top:6px;padding:7px 10px;border-radius:7px;background:#dbeafe22;border:1px solid #3b82f644">
          <div style="font-size:10px;font-weight:700;color:#1e40af;margin-bottom:4px">&#x2728; AI memilih 20 rekod terbaik untuk SKPM (daripada ${count} rekod layak):</div>
          ${top20S.slice(0,3).map((r,i)=>`<div style="font-size:10px;color:var(--t2);padding:1px 0">${i+1}. ${esc(r.program||'Rekod')} &mdash; ${TAHAP_MAP[r.tahap]?.short||r.tahap}</div>`).join('')}
          ${count>23?`<div style="font-size:10px;color:var(--t3);margin-top:2px">... dan ${17} lagi rekod dipilih</div>`:''}
        </div>` : '';
        return `<div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:12px;font-weight:700;color:${count>0?col:'var(--t3)'}">${label}</span>
            <span style="font-size:11px;font-weight:700;color:${lebih?'#3b82f6':penuh?'#22c55e':count>0?col:'var(--t3)'}">
              ${lebih?`20/${count} (AI pilih)`:count+' / 20'+(penuh?' &#x2713;':'')}
            </span>
          </div>
          <div style="height:6px;border-radius:3px;background:var(--bdr);overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${lebih?'#3b82f6':penuh?'#22c55e':col};border-radius:3px;transition:width .4s"></div>
          </div>
          ${cadangan}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="panel">
    <div class="ph" style="display:flex;justify-content:space-between;align-items:center">
      <span class="pt">Rekod Pencapaian Sekolah</span>
      <span style="font-size:11px;color:var(--t3)">Had: 20 rekod layak / peringkat</span>
    </div>
    ${recs.length===0
      ? `<div class="pb"><div class="empty">Tiada rekod pencapaian sekolah.</div></div>`
      : LEVELS.filter(l=>LEVELS_SEKOLAH.includes(l.key)).map(l=>{
          const items = grouped[l.key]; if(!items) return '';
          const cnt      = items.filter(r=>aiKlasifikasiSekolah(r).layak).length;
          const expanded = S.expandedLevels.includes(l.key);
          return `<div>
            <button class="ach-group-hdr" style="width:100%;text-align:left;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px" data-lvltoggle="${l.key}">
              ${lv(l.key)}
              <span class="ach-group-count">${items.length} rekod</span>
              <span style="margin-left:auto;font-size:11px;color:${cnt?'var(--ok)':'var(--t3)'};font-weight:600">${cnt} layak</span>
              <span style="color:var(--t3);font-size:11px;margin-left:6px">${expanded?'&#9650;':'&#9660;'}</span>
            </button>
            ${expanded?`<div class="ach-section" style="padding:0 0 8px">${items.map(recRow).join('')}</div>`:''}
          </div>`;
        }).join('')}
  </div>

  <div class="panel" style="background:var(--chip);border:none">
    <div class="pb" style="font-size:12px;color:var(--t2);line-height:1.6">
      <strong>Nota SKPM 5.4.2:</strong> Pencapaian yang diambil kira adalah yang diberikan kepada sekolah sebagai entiti, diiktiraf KPM, dan diterima dalam tahun penilaian ${TAHUN_SEMASA}. Pencapaian yang melibatkan murid secara terus dan menjana skor PAJSK <em>tidak</em> dikira di sini.
      <div style="margin-top:6px">${SRC}</div>
    </div>
  </div>`;
}

/* -- School Achievement Detail --------------------------------- */
function viewSchoolAchievementDetail() {
  const r = S.schoolRecords.find(x => x.id === S.sfDetailId);
  if (!r) return '<div class="empty">Rekod tidak dijumpai.</div>';

  const ai = aiKlasifikasiSekolah(r);
  const th = TAHAP_MAP[r.tahap];
  const lv_obj = LVL[r.level];
  const col = lv_obj ? lv_obj.color : '#888';
  const katLabel = (KATEGORI.find(k=>k.val===r.kategori)||{}).label || r.kategori || '--';

  const verdictColor  = ai.layak ? '#15803d' : '#854d0e';
  const verdictBg     = ai.layak ? '#dcfce7' : '#fef9c3';

  return `<div style="max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px">

    <!-- Back + Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">

        <button id="btn-sfdetail-delete" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1.5px solid #fecaca;background:#fef2f2;font-size:13px;font-weight:600;color:#dc2626;cursor:pointer">${i('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>',14)} Padam</button>
      </div>
    </div>

    <!-- Delete confirmation modal -->
    <div id="modal-sfdetail-delete" style="display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)">

        <div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:20px">Rekod <b>${esc(r.program)}</b> akan dipadam secara kekal. Tindakan ini tidak boleh dibatalkan.</div>

      <div style="padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface)">

        ${failRows}

    <!-- RAG References -->

      <div class="ph">
        <span class="pt">${i('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',15)} Rujukan Dokumen RAG</span>
        <span class="chip chip-vio">${i('<path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2"/><path d="M12 6v6l4 2"/>',11)} AI</span>
      </div>
      <div class="pb" style="padding-top:6px">${ragSection}</div>
    </div>

    <!-- Teacher Profile Card -->
    ${(()=>{
      const guru = r.guruId ? S.teachers.find(t=>t.id===r.guruId) : null;
      if(!guru) return '';
      const avColors=['#2563eb','#7c3aed','#059669','#d97706','#db2777'];
      const avC = avColors[S.teachers.indexOf(guru)%avColors.length];
      const pengalaman = guru.tahunMula ? (new Date().getFullYear()-guru.tahunMula)+' tahun' : '--';
      return `<div class="panel">
        <div class="ph">
          <span class="pt">${i('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',15)} Profil Guru Terlibat</span>
        </div>
        <div class="pb">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
            <div style="width:52px;height:52px;border-radius:14px;background:${avC};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0;box-shadow:0 2px 8px ${avC}55">${esc(guru.av)}</div>
            <div>
              <div style="font-weight:800;font-size:15px;color:var(--t1)">${esc(guru.name)}</div>
              <div style="font-size:12px;color:var(--t2);margin-top:2px">${esc(guru.jawatan||'--')}</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px">
            ${summaryRow('Mata Pelajaran', guru.mataPelajaran||'--')}
            ${summaryRow('E-mel', guru.emel||'--')}
            ${summaryRow('Tahun Mula Berkhidmat', guru.tahunMula||'--')}
            ${summaryRow('Pengalaman', pengalaman)}
          </div>
        </div>
      </div>`;
    })()}

    <!-- Record Details -->
    <div class="panel">
      <div class="ph"><span class="pt">Butiran Rekod</span></div>
      <div class="pb" style="display:grid;grid-template-columns:1fr 1fr;gap:12px 24px">
        ${summaryRow('Peringkat', lv_obj ? lv_obj.label : r.level)}
        ${summaryRow('Tahap Pencapaian', th ? th.label : '--')}
        ${summaryRow('Kategori', katLabel)}
        ${summaryRow('Tarikh Pencapaian', fmtDate(r.tarikh))}
        ${summaryRow('Status Eviden', r.pautanEviden ? 'Disertakan' : 'Belum diisi')}
        ${r.catatan ? summaryRow('Catatan', r.catatan) : ''}
        <div style="grid-column:span 2;padding-top:4px;border-top:1px solid var(--border)">
          <div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Pautan Eviden</div>
          ${r.pautanEviden
            ? `<div style="font-size:12.5px;color:var(--accent);word-break:break-all">${esc(r.pautanEviden)}</div>`
            : `<div style="font-size:12.5px;color:var(--t3);font-style:italic">Belum diisi &mdash; sila tambah pautan Google Drive PDF sebelum input ke SKPM</div>`
          }
        </div>
      </div>
    </div>

  </div>`;
}
