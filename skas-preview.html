<title>SK@S App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">

<style>
/* --- Token system ----------------------------------------------- */
:root {
  --navy:     #0f172a;
  --navy-2:   #1e3a8a;
  --navy-hi:  #2563eb;
  --accent:   #2563eb;
  --accent-h: #1d4ed8;
  --violet:   #7c3aed;
  --violet-l: #ede9fe;
  --gold:     #b45309;
  --gold-l:   #fef3c7;
  --bg:       #eef2ff;
  --surface:  #ffffff;
  --border:   #e2e8f0;
  --border-2: #c7d2fe;
  --t1:       #0f172a;
  --t2:       #334155;
  --t3:       #94a3b8;
  --ok:       #059669;
  --ok-l:     #d1fae5;
  --warn:     #b45309;
  --warn-l:   #fef3c7;
  --danger:   #dc2626;
  --danger-l: #fee2e2;
  --chip:     #dbeafe;
  --chip-fg:  #1e40af;
  --h: 'Plus Jakarta Sans', system-ui, sans-serif;
  --b: 'Inter', system-ui, sans-serif;
  --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.08);
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.05);

  --lv-int: #c2410c; --lv-int-bg: #fed7aa;
  --lv-nat: #1e40af; --lv-nat-bg: #bfdbfe;
  --lv-neg: #047857; --lv-neg-bg: #a7f3d0;
  --lv-bah: #0e7490; --lv-bah-bg: #a5f3fc;
  --lv-dae: #6d28d9; --lv-dae-bg: #ddd6fe;
  --lv-skl: #475569; --lv-skl-bg: #e2e8f0;
  /* aliases used by inline JS-generated HTML */
  --bdr: #e2e8f0;
  --card: #ffffff;
  /* vivid level colors for bars */
  --lv-int-bar: #f97316;
  --lv-nat-bar: #2563eb;
  --lv-neg-bar: #10b981;
  --lv-bah-bar: #06b6d4;
  --lv-dae-bar: #7c3aed;
  --lv-skl-bar: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1a; --surface: #141c2e; --border: #1e2d45;
    --border-2: #263450; --t1: #e8edf8; --t2: #8090aa;
    --t3: #3d4f6a; --chip: #1a2540; --chip-fg: #93c5fd;
    --violet-l: #1e1040; --gold-l: #2c1c00; --ok-l: #052e16;
    --warn-l: #1c0e00; --danger-l: #1a0505;
    --shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.25);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.18);
    --lv-int-bg: #2c1005; --lv-nat-bg: #0c1d40; --lv-neg-bg: #032013;
    --lv-bah-bg: #022010; --lv-dae-bg: #160730; --lv-skl-bg: #111827;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1a; --surface: #141c2e; --border: #1e2d45; --border-2: #263450;
  --t1: #e8edf8; --t2: #8090aa; --t3: #3d4f6a; --chip: #1a2540; --chip-fg: #93c5fd;
  --violet-l: #1e1040; --gold-l: #2c1c00; --ok-l: #052e16;
  --warn-l: #1c0e00; --danger-l: #1a0505;
  --shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.25);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.18);
  --lv-int-bg: #2c1005; --lv-nat-bg: #0c1d40; --lv-neg-bg: #032013;
  --lv-bah-bg: #022010; --lv-dae-bg: #160730; --lv-skl-bg: #111827;
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:var(--b);font-size:14px;line-height:1.5;background:var(--bg);color:var(--t1)}

/* --- Shell --------------------------------------------------- */
.shell{display:flex;height:100%;overflow:hidden}
.sidebar{width:228px;flex-shrink:0;background:linear-gradient(175deg,#0f172a 0%,#1e3a8a 55%,#1d4ed8 100%);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 var(--border),0 2px 12px rgba(15,23,42,.04)}
.content{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}

/* --- Sidebar ------------------------------------------------- */
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo .mark{font-family:var(--h);font-size:22px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#93c5fd,#ffffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-logo .sub{font-size:10.5px;color:rgba(255,255,255,.42);margin-top:2px}
.sb-section{padding:12px 12px 2px;flex:1;overflow-y:auto}
.sb-section-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.32);padding:0 8px;margin-bottom:4px}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.55);font-size:13px;font-family:var(--b);font-weight:500;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.sb-btn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.sb-btn.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sb-btn.active svg{opacity:1}
.sb-btn svg{flex-shrink:0;opacity:.65}
.sb-footer{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sb-footer-btn{background:none;border:none;color:#fff;cursor:pointer;text-align:left;width:100%;transition:background .2s;border-radius:0}
.sb-footer-btn:hover{background:rgba(255,255,255,.08)}
.sb-footer-gear{margin-left:auto;opacity:0;transition:opacity .2s;flex-shrink:0}
.sb-footer-btn:hover .sb-footer-gear{opacity:.6}
.av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
.sb-uname{font-size:11.5px;font-weight:700;color:#fff}
.sb-urole{font-size:10.5px;color:rgba(255,255,255,.45)}
.sb-ppd{font-size:11px;font-weight:600;color:#93c5fd;margin-top:1px;letter-spacing:.3px}

/* demo role switcher */
.role-sw{padding:8px 10px 6px;background:rgba(255,255,255,.07);margin:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.role-sw-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);margin-bottom:4px;display:block}
.role-sw-btn{display:block;width:100%;background:none;border:none;color:rgba(255,255,255,.5);font-size:11.5px;font-family:var(--b);padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left}
.role-sw-btn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.role-sw-btn.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700}

/* --- Topbar --------------------------------------------------- */
.tb-info .g{font-size:10.5px;color:var(--t3)}
.tb-info .n{font-size:13.5px;font-weight:700;font-family:var(--h)}
.bell-btn{position:relative;background:none;border:none;cursor:pointer;padding:7px;border-radius:10px;color:var(--t2);transition:background .15s}
.bell-btn:hover{background:var(--border)}
.bell-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:#ef4444;border-radius:50%;border:2px solid var(--surface)}

/* --- Generic -------------------------------------------------- */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--b);font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;transition:all .15s}
.btn-pri{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-pri:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,99,235,.4)}
.btn-pri:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn-vio{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 2px 8px rgba(109,40,217,.3)}
.btn-vio:hover{opacity:.9;transform:translateY(-1px)}
.btn-vio:disabled{opacity:.5;transform:none}
.btn-ghost{background:none;border:1.5px solid var(--border);color:var(--t2)}
.btn-ghost:hover{background:var(--chip);border-color:var(--border-2)}
.btn-ghost:disabled{opacity:.45}
.btn-ok{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:10px 0;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:all .15s;box-shadow:0 2px 8px rgba(5,150,105,.3)}
.btn-ok:hover{opacity:.9;transform:translateY(-1px)}
.btn-ok:disabled{opacity:.5;transform:none;box-shadow:none}
.btn-danger{background:none;border:1.5px solid var(--danger);color:var(--danger);padding:10px 0;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:background .15s}
.btn-danger:hover{background:var(--danger-l)}

/* --- Cards ---------------------------------------------------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;overflow:hidden;position:relative}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,23,42,.12),0 16px 40px rgba(15,23,42,.08)}
.stat-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-lbl{font-size:11.5px;color:var(--t2);font-weight:500}
.stat-val{font-size:28px;font-weight:800;font-family:var(--h);line-height:1.1;margin-top:1px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.ph{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pt{font-size:14px;font-weight:700;font-family:var(--h)}
.pb{padding:20px}

/* --- Level badges --------------------------------------------- */
.lv{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.03em}
.lv-INT{background:var(--lv-int-bg);color:var(--lv-int)}
.lv-NAT{background:var(--lv-nat-bg);color:var(--lv-nat)}
.lv-NEG{background:var(--lv-neg-bg);color:var(--lv-neg)}
.lv-BAH{background:var(--lv-bah-bg);color:var(--lv-bah)}
.lv-DAE{background:var(--lv-dae-bg);color:var(--lv-dae)}
.lv-SKL{background:var(--lv-skl-bg);color:var(--lv-skl)}

.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.bw{background:var(--warn-l);color:var(--warn)}
.bo{background:var(--ok-l);color:var(--ok)}
.bd{background:var(--danger-l);color:var(--danger)}
.chip{display:inline-flex;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--chip);color:var(--chip-fg)}
.chip-vio{background:var(--violet-l);color:var(--violet)}
.chip-gold{background:var(--gold-l);color:var(--gold)}
.chip-ok{background:var(--ok-l);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* --- Achievement list rows ------------------------------------ */
.ach-section{display:flex;flex-direction:column;gap:1px}
.ach-group-hdr{padding:10px 20px 6px;display:flex;align-items:center;gap:8px}
.ach-group-hdr .lv{font-size:12px}
.ach-group-count{font-size:11px;color:var(--t3);font-weight:400}
.ach-row{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s}
.ach-row:hover{background:linear-gradient(90deg,#eef2ff,#f0fdf4 120%)}
.ach-row-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px;opacity:.7}
.ach-row-body{flex:1;min-width:0}
.ach-row-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-row-meta{font-size:11px;color:var(--t3);margin-top:2px}

/* --- Form ----------------------------------------------------- */
.form-wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:12px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:4px}
.fl .req{color:var(--danger);font-size:13px;line-height:1}
.fi,.fs{font-family:var(--b);font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--t1);width:100%;transition:border-color .15s,box-shadow .15s}
.fi:focus,.fs:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fi.autofilled,.fs.autofilled{border-color:var(--violet);background:var(--violet-l)}
.fi::placeholder{color:var(--t3)}
.fta{font-family:var(--b);font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--t1);width:100%;resize:vertical;min-height:80px;transition:border-color .15s}
.fta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.level-note{font-size:11px;color:var(--t3);margin-top:3px;padding-left:2px}

/* --- Upload zone ---------------------------------------------- */
.upzone{border:2px dashed var(--border-2);border-radius:14px;padding:32px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--surface)}
.upzone:hover{border-color:var(--accent);background:#eef2ff}
.upzone.has-file{border-color:var(--ok);background:var(--ok-l)}

/* --- AI panel ------------------------------------------------- */
.ai-box{background:linear-gradient(135deg,var(--violet-l),#f5f3ff);border:1px solid rgba(109,40,217,.18);border-radius:12px;padding:14px 16px}
.ai-box-lbl{font-size:10.5px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.ai-box-txt{font-size:12.5px;color:var(--t1);line-height:1.7}

/* --- Approval card -------------------------------------------- */
.apv-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}

/* --- Empty state ---------------------------------------------- */
.empty{text-align:center;padding:56px 24px;color:var(--t3)}

/* --- Animations ----------------------------------------------- */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;display:inline-block}
@keyframes shimmer{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.typing{animation:shimmer 1.2s ease-in-out infinite}

/* --- Page heading --------------------------------------------- */
.pg-title{font-family:var(--h);font-size:20px;font-weight:800;text-wrap:balance;letter-spacing:-.3px}
.pg-sub{font-size:12px;color:var(--t3);margin-top:3px}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* --- Step indicator ------------------------------------------- */
.steps{display:flex;align-items:center;gap:0;margin-bottom:4px}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t3)}
.step.active{color:var(--accent)}
.step.done{color:var(--ok)}
.step-num{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700}
.step-line{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:24px}

/* --- Section divider with label ------------------------------- */
.sdiv{display:flex;align-items:center;gap:10px;margin:4px 0}
.sdiv span{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.sdiv::before,.sdiv::after{content:'';flex:1;height:1px;background:var(--border)}

/* --- Notice --------------------------------------------------- */
.notice{border-radius:10px;padding:10px 14px;font-size:12px;display:flex;align-items:flex-start;gap:9px;line-height:1.55}
.notice-ok{background:var(--ok-l);color:var(--ok)}
.notice-vio{background:var(--violet-l);color:var(--violet)}
.notice-gold{background:var(--gold-l);color:var(--gold)}

/* --- PPD school cards ----------------------------------------- */
.school-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);transition:all .2s}
.school-card:hover{box-shadow:var(--shadow);border-color:var(--border-2);transform:translateY(-1px)}

@media(max-width:640px){
  .sidebar{width:56px}
  .sb-logo .sub,.role-sw,.sb-btn span,.sb-uname,.sb-urole,.sb-ppd{display:none}
  .stat-row{grid-template-columns:1fr 1fr}
  .frow,.frow3{grid-template-columns:1fr}
}

/* -- School Profile ------------------------------------------- */
.pf-wrap{display:flex;flex-direction:column;gap:24px;padding:4px 0}
.pf-hero{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%);border-radius:16px;padding:28px 32px;color:#fff;box-shadow:0 4px 24px rgba(37,99,235,.25)}
.pf-avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#fff;flex-shrink:0;border:3px solid rgba(255,255,255,.4)}
.pf-hero-info{flex:1;min-width:0}
.pf-school-name{font-size:1.35rem;font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pf-badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:600}
.pf-kod{font-size:.8rem;opacity:.8;font-family:monospace}
.pf-gred{background:#f59e0b;color:#1c1917;border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:700}
.pf-ppd{font-size:.82rem;opacity:.75}
.pf-hero-actions{display:flex;gap:8px;flex-shrink:0}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pf-card{background:var(--card,#fff);border:1px solid var(--bdr,#e2e8f0);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.pf-section-hdr{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6366f1;border-bottom:2px solid #e0e7ff;padding-bottom:8px;margin-bottom:12px}
.pf-field{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px solid var(--bdr,#f1f5f9)}
.pf-field:last-child{border-bottom:none}
.pf-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8}
.pf-val{font-size:.92rem;color:var(--fg,#1e293b);font-weight:500}
.pf-inp{font-size:.92rem;color:var(--fg,#1e293b);background:var(--bg,#eef2ff);border:1.5px solid #6366f1;border-radius:6px;padding:5px 9px;outline:none;width:100%;box-sizing:border-box}
.pf-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.pf-stat{text-align:center;background:#f8fafc;border-radius:10px;padding:16px 8px;border:1px solid var(--bdr,#e2e8f0)}
.pf-stat-val{font-size:1.8rem;font-weight:800;color:#2563eb}
.pf-stat-lbl{font-size:.75rem;color:#64748b;margin-top:2px}
.btn-primary{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#6366f1,#2563eb);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.btn-outline{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .2s}

// AI Classification -- SKPM 5.4.2 Pencapaian Sekolah
function aiKlasifikasiSekolah(rec) {
  const reasons = []; const passes = []; let layak = true;
  const mappedLevel = LEVEL_MAP_SKPM[rec.level] || rec.level;

  if (rec.level === 'SKL') {
    layak = false;
    reasons.push(`Peringkat Sekolah terlalu rendah untuk SKPM 5.4.2 -- boleh disimpan tetapi tidak layak.`);
  } else if (!LEVELS_LAYAK.includes(mappedLevel)) {
    layak = false;
    reasons.push(`Peringkat "${LVL[rec.level]?.label}" tidak diiktiraf dalam SKPM 5.4.2.`);
  } else if (rec.level === 'BAH') {
    passes.push(`Peringkat Bahagian dikira setaraf Negeri dalam SKPM 5.4.2.`);
  } else {
    passes.push(`Peringkat ${LVL[rec.level]?.label} -- diiktiraf dalam SKPM 5.4.2.`);
  }

  if (!rec.tahap) { layak = false; reasons.push(`Tahap pencapaian tidak diisi.`); }
  else passes.push(`Tahap: ${TAHAP_MAP[rec.tahap]?.short||rec.tahap}`);
  const yr = rec.tarikh ? new Date(rec.tarikh).getFullYear() : null;
  if (yr && yr < TAHUN_SEMASA) { layak = false; reasons.push(`Pencapaian tahun ${yr} tidak layak -- hanya tahun ${TAHUN_SEMASA}.`); }
  if (!rec.pautanEviden) { layak = false; reasons.push(`Pautan evidens (Google Drive PDF) belum diisi.`); }
  return { layak, reasons, passes };
}

// AI Classification -- tentukan layak/tidak layak berdasarkan SKPM 5.4.1
const TAHUN_SEMASA = 2026;
function aiKlasifikasi(rec) {
  const reasons = [];
  const passes  = [];
  let layak = true;

  // 1. Peringkat -- BAH auto-mapped ke NEG; SKL tidak layak
  const mappedLevel = LEVEL_MAP_SKPM[rec.level] || rec.level;
  if (rec.level === 'SKL') {
    layak = false;
    reasons.push(`Peringkat Sekolah terlalu rendah untuk SKPM 5.4.1 Pencapaian Guru. Rekod ini boleh disimpan sebagai rujukan dalaman sahaja.`);
  } else if (!LEVELS_LAYAK.includes(mappedLevel)) {
    layak = false;
    reasons.push(`Peringkat "${LVL[rec.level]?.label||rec.level}" tidak diiktiraf dalam SKPM 5.4.1.`);
  } else if (rec.level === 'BAH') {
    passes.push(`Peringkat Bahagian dikira setaraf Negeri dalam SKPM 5.4.1 -- diiktiraf sebagai peringkat Negeri.`);
  } else {
    passes.push(`Peringkat ${LVL[rec.level]?.label} -- diiktiraf dalam SKPM 5.4.1.`);
  }

  // 2. Jurulatih mesti Kebangsaan ke atas (guna mappedLevel)
  if (isJurulatih(rec.peranan) && levelTier(mappedLevel) > JURULATIH_MIN_TIER) {
    layak = false;
    reasons.push(`Peranan Jurulatih memerlukan pengiktirafan rasmi peringkat Kebangsaan ke atas. Peringkat semasa (${LVL[rec.level]?.label}) tidak memenuhi syarat.`);
  } else if (rec.peranan === 'Jurulatih') {
    passes.push(`Jurulatih diiktiraf peringkat Kebangsaan ke atas -- memenuhi syarat.`);
  }

  // 3. Tahap pencapaian wajib diisi
  if (!rec.tahap) {
    layak = false;
    reasons.push(`Tahap pencapaian tidak diisi. Wajib pilih: Tempat 1, Tempat 2, Tempat 3, Saguhati atau Penyertaan.`);
  } else {
    const th = TAHAP_MAP[rec.tahap];
    if (th) passes.push(`Tahap pencapaian: ${th.short}.`);
  }

  // 4. Tahun semasa
  const tahunRek = rec.tarikh ? new Date(rec.tarikh).getFullYear() : null;
  if (tahunRek && tahunRek < TAHUN_SEMASA) {
    layak = false;
    reasons.push(`Pencapaian tahun ${tahunRek} tidak layak sebagai Pencapaian Guru 5.4.1. Hanya pencapaian tahun ${TAHUN_SEMASA} diterima. Pencapaian tahun sebelum ini perlu dimasukkan ke Kekuatan Kami (A1).`);
  } else if (tahunRek === TAHUN_SEMASA) {
    passes.push(`Tahun pencapaian ${TAHUN_SEMASA} -- memenuhi syarat tahun penilaian semasa.`);
  }

  // 5. Eviden
  if (!rec.pautanEviden) {
    reasons.push('Pautan eviden (PDF Google Drive) belum diisi. Diperlukan semasa input ke sistem SKPM.');
    // nota sahaja -- tidak menjejaskan kelayakan teknikal
  } else {
    passes.push(`Pautan eviden disertakan.`);
  }

  return { layak, reasons, passes };
}

/* -- Dashboard view -------------------------------------------- */
function dashRecRow(r) {
  const ai = aiKlasifikasi(r);
  const th = TAHAP_MAP[r.tahap];
  const dot = ai.layak ? 'background:var(--ok)' : 'background:var(--danger)';
  const thHtml = th ? '<div class="ach-row-meta" style="color:var(--gold);font-weight:600;margin-top:1px">'+th.short+'</div>' : '';
  const errHtml = !ai.layak ? '<div class="ach-row-meta" style="color:var(--danger);font-size:11px;margin-top:2px">'+(ai.reasons[0]||'')+'</div>' : '';
  return '<div class="ach-row" data-detail="'+r.id+'">'
    + '<div class="ach-row-dot" style="'+dot+'"></div>'
    + '<div class="ach-row-body">'
    + '<div class="ach-row-name">'+r.program+'</div>'
    + '<div class="ach-row-meta">'+r.peranan+' &middot; '+fmtDate(r.tarikh)+'</div>'
    + thHtml + errHtml
    + '</div>'
    + '</div>';
}

function dashCollapsible(groups) {
  if (!groups.length) return '<div class="panel" style="margin-top:12px"><div class="pb"><div class="empty">Tiada rekod.</div></div></div>';
  var lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
  return '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">'
    + groups.map(function(g) {
      var tkKey = 'teacher_'+g.key;
      var open = S.expandedLevels.includes(tkKey);
      var col = (LVL[g.key] && LVL[g.key].color) || '#888';
      var border = open ? col : col+'55';
      var chevron = open ? '90' : '0';
      var rows = open ? '<div class="ach-section" style="border-top:1px solid '+col+'33;padding:0">'+g.recs.map(dashRecRow).join('')+'</div>' : '';
      return '<div style="border-radius:10px;border:1.5px solid '+border+';background:'+col+'0d;overflow:hidden">'
        + '<button data-lvltoggle="'+tkKey+'" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:none;border:none;cursor:pointer;text-align:left">'
        + '<div style="display:flex;align-items:center;gap:10px">'
        + '<span style="padding:3px 10px;border-radius:6px;background:'+col+';color:#fff;font-size:11px;font-weight:700">'+(LVL[g.key] && LVL[g.key].label || g.key)+'</span>'
        + '<span style="font-size:12px;color:var(--t2);font-weight:600">'+g.recs.length+' rekod</span>'
        + '</div>'
        + '<span style="font-size:16px;color:'+col+';display:inline-block;transform:rotate('+chevron+'deg);transition:transform .2s">&rsaquo;</span>'
        + '</button>'
        + rows
        + '</div>';
    }).join('')
    + '</div>';
}

function viewDashboard() {
  const recs = S.records;
  const layak      = recs.filter(r=>aiKlasifikasi(r).layak).length;
  const tidakLayak = recs.length - layak;
  const showLayak  = S.teacherFilter === 'layak';
  const showTidak  = S.teacherFilter === 'tidak';

  const lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
  const grouped = {};
  LEVELS.forEach(l => { const items = recs.filter(r=>r.level===l.key); if (items.length) grouped[l.key]=items; });
  const totalByLevel = LEVELS.map(l=>({label:l.label,count:recs.filter(r=>r.level===l.key).length})).filter(x=>x.count>0);

  const filtered = showLayak ? recs.filter(r=>aiKlasifikasi(r).layak)
                 : showTidak ? recs.filter(r=>!aiKlasifikasi(r).layak) : [];
  const filteredGroups = lvlOrder
    .map(k=>({key:k,recs:filtered.filter(r=>r.level===k)}))
    .filter(g=>g.recs.length);

  const statCards = '<div class="stat-row">'
    + '<div class="stat-card">'
    + '<div class="stat-ico" style="background:#dbeafe;color:#1e40af">'+i('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',22)+'</div>'
    + '<div><div class="stat-lbl">Jumlah Rekod</div><div class="stat-val">'+recs.length+'</div></div>'
    + '</div>'
    + '<div class="stat-card" style="cursor:pointer;outline:'+(showLayak?'2px solid var(--ok)':'none')+'" data-tfilter="layak">'
    + '<div class="stat-ico" style="background:var(--ok-l);color:var(--ok)">'+i('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',22)+'</div>'
    + '<div><div class="stat-lbl">Layak SKPM 5.4.1</div><div class="stat-val" style="color:var(--ok)">'+layak+'</div></div>'
    + '</div>'
    + '<div class="stat-card" style="cursor:pointer;outline:'+(showTidak?'2px solid var(--danger)':'none')+'" data-tfilter="tidak">'
    + '<div class="stat-ico" style="background:var(--danger-l);color:var(--danger)">'+i('<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',22)+'</div>'
    + '<div><div class="stat-lbl">Tidak Layak</div><div class="stat-val" style="color:var(--danger)">'+tidakLayak+'</div></div>'
    + '</div>'
    + '</div>';

  const chips = totalByLevel.map(x=>'<span class="chip">'+x.label+': '+x.count+'</span>').join('');
  const allRows = LEVELS.map(l=>{
    const items = grouped[l.key];
    if (!items) return '';
    return '<div class="ach-group-hdr">'+lv(l.key)+'<span class="ach-group-count">'+items.length+' rekod</span></div>'
      + items.map(dashRecRow).join('');
  }).join('');
  const defaultPanel = '<div class="panel"><div class="ph"><span class="pt">Rekod Mengikut Peringkat</span><div class="chips">'+chips+'</div></div><div class="ach-section">'+allRows+'</div></div>';

  return '<div class="pg-head"><div>'
    + '<div class="pg-title">Pencapaian Saya</div>'
    + '<div class="pg-sub">Rekod disusun dari peringkat tertinggi ke terendah &middot; Bahagian dikira setaraf Negeri &middot; Sekolah: simpan sahaja, tidak layak SK@S</div>'
    + '</div></div>'
    + statCards
    + ((showLayak||showTidak) ? dashCollapsible(filteredGroups) : defaultPanel);
}

/* -- Helpers --------------------------------------------------- */
function summaryRow(k,v) {
  return `<div><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.04em">${k}</div><div style="font-size:13px;font-weight:500;margin-top:2px">${v||'--'}</div></div>`;
}
function fmtDate(d) {
  if (!d) return '--';
  try { return new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}); } catch { return d; }
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

                  </div>
                </div>`;
              }).join('')}
              ${layakRecs.length===0?'<div class="empty" style="padding:8px 0">Tiada rekod layak.</div>':''}
            </div>
          </div>`;
        };
        return barChart(allTeacherRecs, aiKlasifikasi, 'Pencapaian Guru 5.4.1')
             + barChart(sRecs, aiKlasifikasiSekolah, 'Pencapaian Sekolah 5.4.2');
      })()}
    </div>
  </div>

  <!-- &#9314; Analisis Kategori Sekolah -->
  <div style="margin-bottom:24px">

      <span style="font-size:11px;font-weight:500;color:var(--t3);background:var(--chip);padding:2px 8px;border-radius:99px">SKPM 5.4.2</span>
    </div>
    <div class="panel">
      <div class="pb" style="display:flex;flex-direction:column;gap:8px">
        ${(()=>{
          const maxKat = Math.max(1,...KATEGORI.map(k=>sRecs.filter(r=>r.kategori===k.val).length));
          return KATEGORI.map(k=>{
            const total  = sRecs.filter(r=>r.kategori===k.val).length;
            const layakK = sRecs.filter(r=>r.kategori===k.val&&aiKlasifikasiSekolah(r).layak).length;
            const w      = Math.round(total/maxKat*100);
            return `<div>
              <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">
                <span style="font-weight:500">${k.label}</span>
                <span><span style="color:var(--ok);font-weight:700">${layakK}</span><span style="color:var(--t3)"> / ${total}</span></span>
              </div>
              <div style="background:var(--border);border-radius:99px;height:6px;overflow:hidden">
                <div style="height:100%;width:${w}%;background:var(--accent);border-radius:99px"></div>
              </div>
            </div>`;
          }).join('');
        })()}
        ${sRecs.length===0?'<div class="empty">Tiada rekod pencapaian sekolah.</div>':''}
      </div>
    </div>
  </div>

  <!-- &#9315; Utiliti Slot 5.4.2 -->
  <div style="margin-bottom:24px">
    <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:8px">
      Utiliti Slot Pencapaian Sekolah
      <span style="font-size:11px;font-weight:500;color:var(--t3);background:var(--chip);padding:2px 8px;border-radius:99px">Maks. 20 slot keseluruhan &middot; Keutamaan tertinggi dahulu</span>
    </div>
    <div class="panel">
      <div class="pb" style="display:flex;flex-direction:column;gap:12px">
        ${(()=>{
          const MAX_SLOT = 20;
          // sort records: highest level first (lowest tier number = highest)
          const levelOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
          const sorted = [...sRecs].sort((a,b)=>levelOrder.indexOf(a.level)-levelOrder.indexOf(b.level));
          const counted  = sorted.slice(0, MAX_SLOT);
          const overflow = sorted.slice(MAX_SLOT);
          const used     = counted.length;
          const pct      = Math.round(used/MAX_SLOT*100);
          const col      = pct>=90?'var(--danger)':pct>=60?'#f59e0b':'var(--ok)';

          // breakdown per level among counted slots
          const breakdown = LEVELS.filter(l=>LEVELS_SEKOLAH.includes(l.key)).map(l=>{
            const cnt = counted.filter(r=>r.level===l.key).length;
            return { ...l, cnt };
          }).filter(l=>l.cnt>0);

          return `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <span style="font-size:32px;font-weight:800;color:${col}">${used}</span>
              <span style="font-size:14px;color:var(--t3);margin-left:4px">/ ${MAX_SLOT} slot digunakan</span>
            </div>
            <span style="font-size:13px;font-weight:700;color:${col}">${MAX_SLOT-used} baki</span>
          </div>
          <div style="background:var(--border);border-radius:99px;height:10px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${col};border-radius:99px;transition:width .4s"></div>
          </div>

          ${breakdown.length?`<div>
            <div style="font-size:11px;color:var(--t3);margin-bottom:6px;font-weight:600">Pecahan mengikut peringkat (keutamaan tertinggi)</div>
            <div style="display:flex;flex-direction:column;gap:5px">
              ${breakdown.map((l,idx)=>`
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:11px;min-width:20px;color:var(--t3);text-align:right">${idx+1}.</span>
                <span style="font-size:12px;min-width:110px">${l.label}</span>
                <div style="flex:1;background:var(--border);border-radius:99px;height:5px;overflow:hidden">
                  <div style="height:100%;width:${Math.round(l.cnt/used*100)}%;background:var(--ok);border-radius:99px"></div>
                </div>
                <span style="font-size:12px;font-weight:700;color:var(--ok);min-width:24px;text-align:right">${l.cnt}</span>
              </div>`).join('')}
            </div>
          </div>`:''}

          ${overflow.length?`<div style="padding:8px 12px;background:var(--danger-l);border-radius:8px;font-size:12px;color:var(--danger)">
            ! ${overflow.length} rekod melebihi had 20 slot -- tidak dikira dalam SKPM 5.4.2:<br>
            ${overflow.map(r=>`<strong>${r.program}</strong> (${LVL[r.level]?.label||r.level})`).join(', ')}
          </div>`:`<div style="padding:8px 12px;background:var(--ok-l);border-radius:8px;font-size:12px;color:var(--ok)">
            &#10003; Semua rekod dalam had slot yang dibenarkan.
          </div>`}`;
        })()}
      </div>
    </div>
  </div>

  <!-- &#9316; Analisis Peranan Guru -->
  <div style="margin-bottom:8px">
    <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:8px">
      Analisis Peranan Guru
      <span style="font-size:11px;font-weight:500;color:var(--t3);background:var(--chip);padding:2px 8px;border-radius:99px">SKPM 5.4.1</span>
    </div>
    <div class="panel">
      <div class="pb" style="display:flex;flex-direction:column;gap:8px">
        ${(()=>{
          const maxP = Math.max(1,...PERANAN.map(p=>allTeacherRecs.filter(r=>r.peranan===p.val).length));
          return PERANAN.map(p=>{
            const total  = allTeacherRecs.filter(r=>r.peranan===p.val).length;
            const layakP = tLayak.filter(r=>r.peranan===p.val).length;
            const w      = Math.round(total/maxP*100);
            return `<div>
              <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">
                <span style="font-weight:500">${p.val}</span>
                <span><span style="color:var(--ok);font-weight:700">${layakP}</span><span style="color:var(--t3)"> layak / ${total} rekod</span></span>
              </div>
              <div style="background:var(--border);border-radius:99px;height:6px;overflow:hidden">
                <div style="height:100%;width:${w}%;background:var(--accent);border-radius:99px"></div>
              </div>
            </div>`;
          }).join('');
        })()}
        ${allTeacherRecs.length===0?'<div class="empty">Tiada rekod.</div>':''}
      </div>
    </div>
  </div>`;
}

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-ico" style="background:#dbeafe;color:#1e40af">${i('<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',22)}</div>
      <div><div class="stat-lbl">Jumlah Rekod</div><div class="stat-val">${recs.length}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-ico" style="background:var(--ok-l);color:var(--ok)">${i('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',22)}</div>
      <div><div class="stat-lbl">Layak SKPM 5.4.2</div><div class="stat-val" style="color:var(--ok)">${layak}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-ico" style="background:var(--danger-l);color:var(--danger)">${i('<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',22)}</div>

      <div style="margin-top:6px">${SRC}</div>
    </div>
  </div>`;
}

            </div>`:''}

  return `<div class="sa-wrap">
    <button id="btn-ppd-back" style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;margin-bottom:18px;padding:0;font-weight:600">&larr; Kembali ke Senarai Sekolah</button>

      <div style="width:52px;height:52px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0">${sch.av}</div>
      <div>
        <div style="font-size:18px;font-weight:800;color:var(--t1)">${sch.name}</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">${sch.kod} &middot; ${sch.jenis} &middot; PPD Gombak</div>

}

/* -- PPD Reset Password view ----------------------------------- */
function viewPPDResetPassword() {
  const lockIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  const rows = DEMO_SCHOOLS.map(sch => {
    const done = (S.resetDone||[]).includes(sch.id);
    return '<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;border:1px solid var(--bdr);background:var(--card)">'
      + (()=>{const avC=['#2563eb','#7c3aed','#059669','#d97706','#db2777'];const c=avC[DEMO_SCHOOLS.indexOf(sch)%avC.length];return '<div style="width:42px;height:42px;border-radius:12px;background:'+c+';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;box-shadow:0 2px 8px '+c+'55">'+esc(sch.av)+'</div>';})()
      + '<div style="flex:1;min-width:0">'
      +   '<div style="font-size:13.5px;font-weight:700;color:var(--t1)">' + esc(sch.name) + '</div>'
      +   '<div style="font-size:11.5px;color:var(--t3);margin-top:1px">' + esc(sch.kod) + ' &middot; ' + esc(sch.jenis) + '</div>'
      + '</div>'
      + (done
          ? '<div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok);padding:7px 14px;border-radius:8px;background:color-mix(in srgb,var(--ok) 12%,transparent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Berjaya Direset</div>'
          : '<button data-reset-school="' + sch.id + '" style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#fff;padding:7px 14px;border-radius:8px;background:var(--accent);border:none;cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity=\'.8\'" onmouseout="this.style.opacity=\'1\'">' + lockIcon + 'Reset Kata Laluan</button>')
      + '</div>';
  }).join('');

  return '<div style="padding:24px;max-width:700px">'
    + '<div style="margin-bottom:20px">'
    +   '<div style="font-size:18px;font-weight:800;color:var(--t1)">Urus Kata Laluan Sekolah</div>'
    +   '<div style="font-size:12.5px;color:var(--t3);margin-top:4px">Reset kata laluan akaun Pentadbir Sekolah dalam PPD Gombak</div>'
    + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:10px">' + rows + '</div>'
    + '</div>';
}

  return '<div id="reset-modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">'
    + '<div style="background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.5)">'

/* -- Build app ------------------------------------------------- */
function buildApp() {
  if (S.role === 'ppd_admin') {
    const titles = { analysis:'Analisis Daerah', schools:'Senarai Sekolah', school_detail:'Butiran Sekolah', reset_password:'Urus Kata Laluan' };
    const contentView = S.ppdView==='school_detail'    ? viewPPDSchoolDetail()
      : S.ppdView==='schools'         ? viewPPDSchools()
      : S.ppdView==='reset_password'  ? viewPPDResetPassword()
      : viewPPDAnalysis();
    return `${sidebarAdmin()}
    <div class="main">
      <div class="topbar">
        <div class="tb-info"><div class="g">Admin PPD &middot; PPD Gombak</div><div class="n">${titles[S.ppdView]||'SK@S'}</div></div>
        <button class="bell-btn">${IC.bell}<span class="bell-dot"></span></button>
      </div>
      <div class="content">${contentView}</div>
    </div>`;
  }
  if (S.role === 'school_admin') {
    const titles = { analysis:'Analisis Pencapaian', users:'Senarai Pengguna', teacher_detail:'Rekod Guru', school_achievements:'Pencapaian Sekolah', school_form:'Tambah Pencapaian Sekolah', school_profile:'Profil Sekolah' };
    const contentView = S.saView==='users' ? viewUsers()
      : S.saView==='teacher_detail'     ? viewTeacherDetail()
      : S.saView==='school_achievements'? viewSchoolAchievements()
      : S.saView==='school_form'        ? viewSchoolForm()
      : S.saView==='school_profile'     ? viewSchoolProfile()
      : viewSchoolAdmin();
    return `${sidebarAdmin()}
    <div class="main">
      <div class="topbar">
        <div class="tb-info"><div class="g">Pentadbir Sekolah &middot; SK Wangsa Maju 1</div><div class="n">${titles[S.saView]||'SK@S'}</div></div>
        <button class="bell-btn">${IC.bell}<span class="bell-dot"></span></button>
      </div>
      <div class="content">${contentView}</div>
    </div>`;
  }
  const titles = { dashboard:'Papan Pemuka Guru', form:'Tambah Pencapaian', detail:'Butiran Pencapaian' };
  const content = S.view==='dashboard' ? viewDashboard() : S.view==='form' ? viewForm() : viewDetail();
  return `${sidebar()}
  <div class="main">
    ${topbar(titles[S.view]||'SK@S')}
    <div class="content">${content}</div>
  </div>`;
}

/* -- Event binding --------------------------------------------- */
function bind() {
  // role switcher
  document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>setState({role:b.dataset.role,view:'dashboard'})));

  // nav
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.view==='form') setState({view:'form',formStep:1,f:{program:'',tarikhmula:'',tarikhakhir:'',level:'',peranan:'',tahap:'',pengesahan:'',pautanEviden:'',catatan:'',hasSijil:false},extracting:false,extracted:false,generating:false,draftText:'',draftDone:false});
    else setState({view:b.dataset.view});
  }));

  // new btn
  const nb=document.getElementById('btn-new');
  if(nb)nb.addEventListener('click',()=>setState({view:'form',formStep:1,f:{program:'',tarikhmula:'',tarikhakhir:'',level:'',peranan:'',tahap:'',pengesahan:'',pautanEviden:'',catatan:'',hasSijil:false},extracting:false,extracted:false,generating:false,draftText:'',draftDone:false}));

  // back btn
  const bk=document.getElementById('btn-back');
  if(bk)bk.addEventListener('click',()=>setState({view:'dashboard'}));

  // admin nav
  document.querySelectorAll('[data-saview]').forEach(b=>b.addEventListener('click',()=>{
    const sv=b.dataset.saview;
    if(sv==='school_form') setState({saView:'school_form',saFilter:null,sf:{program:'',tarikh:'',level:'',tahap:'',kategori:'',pautanEviden:'',catatan:''}});
    else if(sv==='school_profile') setState({saView:'school_profile',saFilter:null,_profileEdit:false,_profileReadOnly:true});
    else setState({saView:sv,saFilter:null,_profileEdit:false,_profileReadOnly:false});
  }));

  // teacher dashboard filter cards (layak / tidak)
  document.querySelectorAll('[data-tfilter]').forEach(b=>b.addEventListener('click',()=>setState({teacherFilter:S.teacherFilter===b.dataset.tfilter?null:b.dataset.tfilter,expandedLevels:[]})));

  // analysis filter cards (toggle)
  document.querySelectorAll('[data-safilter]').forEach(b=>b.addEventListener('click',()=>setState({saFilter:S.saFilter===b.dataset.safilter?null:b.dataset.safilter,expandedLevels:[]})));

  // teacher cards (school admin users view)
  document.querySelectorAll('[data-teacher]').forEach(b=>b.addEventListener('click',()=>setState({saView:'teacher_detail',selectedTeacherId:b.dataset.teacher})));

  // back to users list
  const bku=document.getElementById('btn-back-users');
  if(bku)bku.addEventListener('click',()=>setState({saView:'users'}));

  // school profile edit / save / cancel
  const pfooter=document.querySelector('[data-pfooter]');
  if(pfooter)pfooter.addEventListener('click',()=>setState({saView:'school_profile',_profileEdit:true,_profileReadOnly:false,saFilter:null}));

  const pfedit=document.querySelector('[data-pfedit]');
  if(pfedit)pfedit.addEventListener('click',()=>setState({_profileEdit:true,_profileReadOnly:false}));
  const pfcancel=document.querySelector('[data-pfcancel]');
  if(pfcancel)pfcancel.addEventListener('click',()=>setState({_profileEdit:false}));
  const pfsave=document.querySelector('[data-pfsave]');
  if(pfsave)pfsave.addEventListener('click',()=>setState({_profileEdit:false}));

  // level collapse toggles (school achievements)
  document.querySelectorAll('[data-lvltoggle]').forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.lvltoggle;
    const idx=S.expandedLevels.indexOf(key);
    const next=idx>=0?S.expandedLevels.filter(k=>k!==key):[...S.expandedLevels,key];
    setState({expandedLevels:next});
  }));

  // ppd admin nav
  document.querySelectorAll('[data-ppdview]').forEach(b=>b.addEventListener('click',()=>{ const ov=document.getElementById('reset-modal-overlay'); if(ov)ov.remove(); setState({ppdView:b.dataset.ppdview,selectedSchoolId:null,ppdFilter:null}); }));

  // ppd reset password - open modal (inject into body to avoid fixed positioning issues)
  document.querySelectorAll('[data-reset-school]').forEach(b=>b.addEventListener('click',()=>{
    const sid=b.dataset.resetSchool;
    const sch=DEMO_SCHOOLS.find(s=>s.id===sid);
    let ov=document.getElementById('reset-modal-overlay');
    if(ov)ov.remove();
    ov=document.createElement('div');
    ov.id='reset-modal-overlay';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML='<div style="background:linear-gradient(135deg,#1e40af,#2563eb);border-radius:20px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.6)">'
      +'<div style="width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:20px">'
      +'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
      +'</div>'
      +'<div style="font-size:17px;font-weight:800;color:#fff;margin-bottom:10px">Reset Kata Laluan?</div>'
      +'<div style="font-size:13px;color:rgba(255,255,255,.8);line-height:1.65;margin-bottom:24px">Kata laluan akaun <strong style="color:#fff">'+esc(sch?sch.name:'')+'</strong> akan direset kepada kata laluan sementara. Pentadbir sekolah perlu menukar semula selepas log masuk.</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +'<button id="reset-cancel" style="padding:11px;border-radius:10px;border:none;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:13px;cursor:pointer">Batal</button>'
      +'<button id="reset-confirm" style="padding:11px;border-radius:10px;border:none;background:#fff;color:#1e40af;font-weight:700;font-size:13px;cursor:pointer">Ya, Reset</button>'
      +'</div></div>';
    document.body.appendChild(ov);
    document.getElementById('reset-cancel').addEventListener('click',()=>ov.remove());
    document.getElementById('reset-confirm').addEventListener('click',()=>{
      ov.remove();
      setState({resetDone:[...S.resetDone,sid]});
    });
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  }));

  // ppd school cards (both from senarai and from analysis table)
  document.querySelectorAll('[data-school]').forEach(b=>b.addEventListener('click',()=>setState({ppdView:'school_detail',selectedSchoolId:b.dataset.school,ppdFilter:null,expandedPpdRecs:[]})));

  // ppd back button
  const bpb=document.getElementById('btn-ppd-back');
  if(bpb)bpb.addEventListener('click',()=>setState({ppdView:'schools',selectedSchoolId:null,ppdFilter:null}));

  // ppd filter cards
  document.querySelectorAll('[data-ppd-filter]').forEach(b=>b.addEventListener('click',()=>setState({ppdFilter:S.ppdFilter===b.dataset.ppdFilter?null:b.dataset.ppdFilter,selectedSchoolId:S.selectedSchoolId,expandedPpdRecs:[]})));

  // ppd record expand toggle
  document.querySelectorAll('[data-ppd-rec]').forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.ppdRec;
    const idx=S.expandedPpdRecs.indexOf(key);
    setState({expandedPpdRecs:idx>=0?S.expandedPpdRecs.filter(k=>k!==key):[...S.expandedPpdRecs,key]});
  }));

  // school achievements nav
  const bsn=document.getElementById('btn-school-new');
  if(bsn)bsn.addEventListener('click',()=>setState({saView:'school_form',sf:{program:'',tarikh:'',level:'',tahap:'',kategori:'',pautanEviden:'',catatan:''}}));

  const bsb=document.getElementById('btn-school-back');
  if(bsb)bsb.addEventListener('click',()=>setState({saView:'school_achievements'}));
  const bsb2=document.getElementById('btn-school-back2');
  if(bsb2)bsb2.addEventListener('click',()=>setState({saView:'school_achievements'}));

  // school form save
  const bss=document.getElementById('btn-school-save');
  if(bss)bss.addEventListener('click',()=>{
    const newRec={id:'sr'+Date.now(),...S.sf};
    setState({schoolRecords:[...S.schoolRecords,newRec],saView:'school_achievements'});
  });

  // school form live update
  const sfmap={program:'program',tarikh:'tarikh',level:'level',tahap:'tahap',kategori:'kategori',pautanEviden:'pautanEviden',catatan:'catatan'};
  Object.keys(sfmap).forEach(id=>{
    const el=document.getElementById('sf-'+id);
    if(!el)return;
    const update=()=>{
      S.sf[sfmap[id]]=el.value;
      const canSave=S.sf.program&&S.sf.tarikh&&S.sf.level&&S.sf.tahap&&S.sf.kategori;
      const btn=document.getElementById('btn-school-save');
      if(btn)btn.disabled=!canSave;
      if(['level','tahap','tarikh','pautanEviden'].includes(id))render();
    };
    el.addEventListener('input',update);
    if(el.tagName==='SELECT')el.addEventListener('change',update);
  });

  // detail rows
  document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>setState({view:'detail',detailId:b.dataset.detail})));

  // form live update (step 1)
  const fmap = {program:'program',tmula:'tarikhmula',takhir:'tarikhakhir',
                level:'level',peranan:'peranan',tahap:'tahap',
                pengesahan:'pengesahan',pautanEviden:'pautanEviden',catatan:'catatan'};
  Object.keys(fmap).forEach(id=>{
    const el=document.getElementById('f-'+id);
    if(!el)return;
    const update = ()=>{
      S.f[fmap[id]]=el.value;
      const violation=isJurulatihViolation(S.f.peranan,S.f.level);
      const canNext=S.f.program&&S.f.tarikhmula&&S.f.level&&S.f.peranan&&S.f.tahap&&S.f.pengesahan&&!violation;
      const nb2=document.getElementById('btn-next');
      if(nb2) nb2.disabled=!canNext;
      if(['level','peranan'].includes(id)) render(); // re-render for notes/validation
    };
    el.addEventListener('input', update);
    if(el.tagName==='SELECT') el.addEventListener('change', update);
  });

  // next / prev / cancel
  const nx=document.getElementById('btn-next');
  if(nx)nx.addEventListener('click',()=>setState({formStep:2}));
  const pv=document.getElementById('btn-prev');
  if(pv)pv.addEventListener('click',()=>setState({formStep:1}));
  const cc=document.getElementById('btn-cancel');
  if(cc)cc.addEventListener('click',()=>setState({view:'dashboard'}));

  // upload zone
  const uz=document.getElementById('upzone');
  if(uz&&!S.f.hasSijil)uz.addEventListener('click',()=>{
    setState({f:{...S.f,hasSijil:true}});
  });

  // extract
  const ex=document.getElementById('btn-extract');
  if(ex)ex.addEventListener('click',()=>{
    setState({extracting:true});
    setTimeout(()=>setState({extracting:false,extracted:true}),1800);
  });

  // draft
  const dr=document.getElementById('btn-draft');
  if(dr)dr.addEventListener('click',()=>{
    setState({generating:true,draftText:'',draftDone:false});
    const tahapLabel = TAHAP_MAP[S.f.tahap]?.short || '';
    const pgsh = S.f.pengesahan ? ` Pencapaian ini disahkan melalui ${S.f.pengesahan}.` : '';
    const full = `Guru telah menyertai ${S.f.program} di peringkat ${LVL[S.f.level]?.label||S.f.level} sebagai ${S.f.peranan}${tahapLabel?` dan mencapai ${tahapLabel}`:''}, membuktikan komitmen peribadi beliau dalam meningkatkan profesionalisme dalam bidang pendidikan.${pgsh} Pencapaian ini merupakan pencapaian individu guru yang diiktiraf secara rasmi oleh KPM, mencerminkan kualiti dan kecemerlangan guru yang menyumbang kepada Standard 5.4.1 Pencapaian Guru dalam SKPM Kualiti@Sekolah ${TAHUN_SEMASA}.`;
    let ci=0;
    const iv=setInterval(()=>{
      ci+=4;
      const cur=full.slice(0,ci);
      const ta=document.getElementById('ta-draft');
      if(ta)ta.value=cur;
      S.draftText=cur;
      if(ci>=full.length){
        clearInterval(iv);
        setState({generating:false,draftText:full,draftDone:true});
      }
    },22);
  });

  // submit
  const sb=document.getElementById('btn-submit');
  if(sb)sb.addEventListener('click',()=>{
    const ta=document.getElementById('ta-draft');
    const draft=ta?ta.value:S.draftText;
    const newRec={
      id:'r'+Date.now(),
      program:S.f.program,
      level:S.f.level,peranan:S.f.peranan,
      tarikh:S.f.tarikhmula,
      tahap:S.f.tahap,pengesahan:S.f.pengesahan,
      pautanEviden:S.f.pautanEviden,
      status:'pending',draft:draft||null,
      tags:[`#${LVL[S.f.level]?.label||S.f.level}`,`#5.4.1`],
    };
    S.records=[newRec,...S.records];
    setState({view:'dashboard',formStep:1});
  });
}

render();
</script>
