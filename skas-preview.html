/* -- PPD Admin Views ------------------------------------------- */
function viewPPDCharts() {
  const selectedYear = S.ppdYearFilter || TAHUN_SEMASA;
  const filterByYear = r => {
    if (!r.tarikh) return true;
    return new Date(r.tarikh).getFullYear() === selectedYear;
  };
  const availYears = [...new Set(
    DEMO_SCHOOLS.flatMap(sch=>[
      ...sch.teachers.flatMap(t=>(t.records||[]).map(r=>r.tarikh&&new Date(r.tarikh).getFullYear())),
      ...(sch.schoolRecords||[]).map(r=>r.tarikh&&new Date(r.tarikh).getFullYear())
    ]).filter(Boolean)
  )].sort((a,b)=>b-a);

  const allTRecs = DEMO_SCHOOLS.flatMap(sch => sch.teachers.flatMap(t => (t.records||[]).map(r=>({...r,_school:sch.name,_schoolId:sch.id})))).filter(filterByYear);
  const allSRecs = DEMO_SCHOOLS.flatMap(sch => (sch.schoolRecords||[]).map(r=>({...r,_school:sch.name,_schoolId:sch.id}))).filter(filterByYear);
  const tLayakAll = allTRecs.filter(r=>aiKlasifikasi(r).layak);
  const sLayakAll = allSRecs.filter(r=>aiKlasifikasiSekolah(r).layak);
  const tPct = allTRecs.length ? Math.round(tLayakAll.length/allTRecs.length*100) : 0;
  const sPct = allSRecs.length ? Math.round(sLayakAll.length/allSRecs.length*100) : 0;
  const totalRecs = allTRecs.length + allSRecs.length;
  const totalSchools = DEMO_SCHOOLS.length;

  const lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
  const countByLevel = arr => {
    const map = {};
    arr.forEach(r=>{ const k=LEVEL_MAP_SKPM[r.level]||r.level; map[k]=(map[k]||0)+1; });
    return lvlOrder.filter(k=>map[k]).map(k=>({key:k,count:map[k]}));
  };
  const tByLvl = countByLevel(tLayakAll);
  const sByLvl = countByLevel(sLayakAll);

  const lvlBar = (key,count,total) => {
    const col = LVL[key]?.color || '#888';
    const pct = total ? Math.round(count/total*100) : 0;
    const w = total ? count/total*100 : 0;
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bdr)">
      <div style="display:flex;align-items:center;gap:8px;width:110px;flex-shrink:0">
        <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
        <span style="font-size:12px;font-weight:600;color:var(--t1)">${LVL[key]?.label||key}</span>
      </div>
      <div style="flex:1;height:10px;border-radius:6px;background:var(--bdr);overflow:hidden">
        <div style="height:100%;width:${w}%;background:${col};border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span style="font-size:13px;font-weight:700;color:var(--t1);min-width:20px;text-align:right">${count}</span>
        <span style="font-size:10px;font-weight:600;color:#fff;background:${col};padding:2px 7px;border-radius:10px;min-width:36px;text-align:center">${pct}%</span>
      </div>
    </div>`;
  };

  const monthCounts = {};
  const tMonthCounts = {}; const sMonthCounts = {};
  allTRecs.forEach(r=>{
    if(!r.tarikh) return;
    const d=new Date(r.tarikh); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    tMonthCounts[k]=(tMonthCounts[k]||0)+1; monthCounts[k]=(monthCounts[k]||0)+1;
  });
  allSRecs.forEach(r=>{
    if(!r.tarikh) return;
    const d=new Date(r.tarikh); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    sMonthCounts[k]=(sMonthCounts[k]||0)+1; monthCounts[k]=(monthCounts[k]||0)+1;
  });
  const monthKeys = Object.keys(monthCounts).sort();
  const maxMonth = Math.max(...Object.values(monthCounts),1);
  const BULAN = ['','Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];

  const trendBars = monthKeys.map(k=>{
    const [,m]=k.split('-');
    const total=monthCounts[k]||0; const tC=tMonthCounts[k]||0; const sC=sMonthCounts[k]||0;
    const pct=total/maxMonth*100;
    const tH=tC/maxMonth*100; const sH=sC/maxMonth*100;
    const isMax = total===maxMonth;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:32px">
      <div style="font-size:11px;font-weight:700;color:${isMax?'var(--accent)':'var(--t1)'}">${total}</div>
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:80px;gap:1px;border-radius:6px 6px 0 0;overflow:hidden">
        <div title="Guru: ${tC}" style="width:100%;background:#6366f1;height:${tH}%;min-height:${tC?'3px':'0'};transition:height .5s;border-radius:${sC?'0':'4px 4px 0 0'}"></div>
        <div title="Sekolah: ${sC}" style="width:100%;background:#06b6d4;height:${sH}%;min-height:${sC?'3px':'0'};transition:height .5s;border-radius:4px 4px 0 0"></div>
      </div>
      <div style="font-size:9px;font-weight:600;color:${isMax?'var(--accent)':'var(--t3)'};white-space:nowrap">${BULAN[+m]||m}</div>
    </div>`;
  }).join('');

  const yearBtns = availYears.map(y=>`<button data-chart-year="${y}" style="padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid ${y===selectedYear?'var(--accent)':'var(--bdr)'};background:${y===selectedYear?'var(--accent)':'transparent'};color:${y===selectedYear?'#fff':'var(--t2)'};cursor:pointer;transition:all .15s">${y}</button>`).join('');

  const statTile = (label, val, sub, grad, icon) =>
    `<div style="border-radius:14px;padding:18px 20px;background:${grad};color:#fff;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden">
      <div style="position:absolute;right:-10px;top:-10px;font-size:56px;opacity:.15;line-height:1">${icon}</div>
      <div style="font-size:11px;font-weight:600;opacity:.85">${label}</div>
      <div style="font-size:28px;font-weight:800;line-height:1.1">${val}</div>
      <div style="font-size:11px;opacity:.75">${sub}</div>
    </div>`;

  return `
  <div class="pg-head" style="margin-bottom:0">
    <div>
      <div class="pg-title">Carta &amp; Analitik</div>
      <div style="font-size:12px;color:var(--t3)">Visualisasi data rekod daerah · ${selectedYear}</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${yearBtns}</div>
  </div>

  <!-- KPI tiles -->
  <div class="chart-kpi-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
    ${statTile('Jumlah Rekod',totalRecs,'guru + sekolah','linear-gradient(135deg,#6366f1,#4f46e5)','📋')}
    ${statTile('Rekod Guru',allTRecs.length,'SKPM 5.4.1','linear-gradient(135deg,#7c3aed,#6d28d9)','👩‍🏫')}
    ${statTile('Rekod Sekolah',allSRecs.length,'SKPM 5.4.2','linear-gradient(135deg,#0891b2,#0e7490)','🏫')}
    ${statTile('Bilangan Sekolah',totalSchools,'dalam daerah','linear-gradient(135deg,#059669,#047857)','🏆')}
  </div>

  <!-- Trend chart -->
  ${monthKeys.length ? `<div class="card" style="padding:20px 22px;margin-bottom:16px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px">
      <div>
        <div style="font-weight:700;font-size:14px;color:var(--t1)">Trend Penyerahan Rekod</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">Bilangan rekod dihantar setiap bulan · ${selectedYear}</div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px"><div style="width:10px;height:10px;border-radius:3px;background:#6366f1"></div><span style="font-size:11px;color:var(--t2)">Guru</span></div>
        <div style="display:flex;align-items:center;gap:6px"><div style="width:10px;height:10px;border-radius:3px;background:#06b6d4"></div><span style="font-size:11px;color:var(--t2)">Sekolah</span></div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:flex-end;padding-bottom:4px;overflow-x:auto">
      ${trendBars}
    </div>
  </div>` : `<div class="notice">Tiada rekod untuk tahun ${selectedYear}.</div>`}

  <!-- Level breakdown -->
  <div class="grid-2col" style="margin-bottom:4px">
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:16px 20px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">👩‍🏫</div>
        <div>
          <div style="font-weight:700;font-size:13px;color:var(--t1)">Taburan Peringkat Guru</div>
          <div style="font-size:11px;color:var(--t3)">SKPM 5.4.1 · ${tLayakAll.length} rekod layak</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:22px;font-weight:800;color:#7c3aed">${tPct}%</div>
          <div style="font-size:9px;color:var(--t3)">kadar layak</div>
        </div>
      </div>
      <div style="padding:4px 20px 16px">
        ${tByLvl.length ? tByLvl.map(l=>lvlBar(l.key,l.count,tLayakAll.length)).join('') : `<div style="font-size:12px;color:var(--t3);padding:16px 0">Tiada rekod layak.</div>`}
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:16px 20px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#0891b2,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">🏫</div>
        <div>
          <div style="font-weight:700;font-size:13px;color:var(--t1)">Taburan Peringkat Sekolah</div>
          <div style="font-size:11px;color:var(--t3)">SKPM 5.4.2 · ${sLayakAll.length} rekod layak</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:22px;font-weight:800;color:#0891b2">${sPct}%</div>
          <div style="font-size:9px;color:var(--t3)">kadar layak</div>
        </div>
      </div>
      <div style="padding:4px 20px 16px">
        ${sByLvl.length ? sByLvl.map(l=>lvlBar(l.key,l.count,sLayakAll.length)).join('') : `<div style="font-size:12px;color:var(--t3);padding:16px 0">Tiada rekod layak.</div>`}
      </div>
    </div>
  </div>`;
}

function viewPPDAnalysis() {
  // Cadangan B: year filter

      ...sch.teachers.flatMap(t=>(t.records||[]).map(r=>r.tarikh&&new Date(r.tarikh).getFullYear())),
      ...(sch.schoolRecords||[]).map(r=>r.tarikh&&new Date(r.tarikh).getFullYear())
    ]).filter(Boolean)
  )].sort((a,b)=>b-a);

  // Aggregate all schools (filtered by year)
  const allTRecs = DEMO_SCHOOLS.flatMap(sch => sch.teachers.flatMap(t => (t.records||[]).map(r=>({...r,_school:sch.name,_schoolId:sch.id})))).filter(filterByYear);
  const allSRecs = DEMO_SCHOOLS.flatMap(sch => (sch.schoolRecords||[]).map(r=>({...r,_school:sch.name,_schoolId:sch.id}))).filter(filterByYear);

  const tLayakAll  = allTRecs.filter(r=>aiKlasifikasi(r).layak);
  const tTidakAll  = allTRecs.filter(r=>!aiKlasifikasi(r).layak);
  const sLayakAll  = allSRecs.filter(r=>aiKlasifikasiSekolah(r).layak);
  const sTidakAll  = allSRecs.filter(r=>!aiKlasifikasiSekolah(r).layak);

  const tPct = allTRecs.length ? Math.round(tLayakAll.length/allTRecs.length*100) : 0;
  const sPct = allSRecs.length ? Math.round(sLayakAll.length/allSRecs.length*100) : 0;

  const lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];

    const map = {};
    arr.forEach(r=>{ const k=LEVEL_MAP_SKPM[r.level]||r.level; map[k]=(map[k]||0)+1; });
    return lvlOrder.filter(k=>map[k]).map(k=>({key:k,count:map[k]}));
  };

  const tByLvl = countByLevel(tLayakAll);
  const sByLvl = countByLevel(sLayakAll);

function viewPPDSchools() {
  const jenisBadge = j => {
    const col = j==='SK'?'#3b82f6':j==='SJKC'?'#f59e0b':'#8b5cf6';
    return `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:${col}22;color:${col};border:1px solid ${col}44">${j}</span>`;
  };
  const search = (S.ppdSchoolSearch||'').toLowerCase();
  const jenisFilter = S.ppdSchoolJenis || 'all';
  const statusFilter = S.ppdSchoolStatus || 'all';
  // compute pct for each school for status filter
  const withStats = DEMO_SCHOOLS.map(sch => {
    const tRecs = sch.teachers.flatMap(t=>t.records||[]);
    const tLayak = tRecs.filter(r=>aiKlasifikasi(r).layak).length;
    const sLayak = (sch.schoolRecords||[]).filter(r=>aiKlasifikasiSekolah(r).layak).length;
    const tTotal = tRecs.length; const sTotal = (sch.schoolRecords||[]).length;
    const tPct = tTotal ? Math.round(tLayak/tTotal*100) : 0;
    const sPct = sTotal ? Math.round(sLayak/sTotal*100) : 0;
    return { sch, tLayak, sLayak, tTotal, sTotal, tPct, sPct };
  });
  const filtered = withStats.filter(({sch, tPct, sPct}) => {
    const matchSearch = !search || sch.name.toLowerCase().includes(search) || sch.kod.toLowerCase().includes(search);
    const matchJenis = jenisFilter === 'all' || sch.jenis === jenisFilter;
    const matchStatus = statusFilter === 'all'
      || (statusFilter === 'lemah' && (tPct < 50 || sPct < 50))
      || (statusFilter === 'baik' && tPct >= 80 && sPct >= 80);
    return matchSearch && matchJenis && matchStatus;
  });
  const chipJenis = (val, label) => {
    const active = jenisFilter === val;
    return `<button data-jenis="${val}" style="padding:5px 12px;border-radius:20px;border:1.5px solid ${active?'var(--accent)':'var(--bdr)'};background:${active?'var(--accent)':'transparent'};color:${active?'#fff':'var(--t2)'};font-size:12px;font-weight:600;cursor:pointer;transition:all .15s">${label}</button>`;
  };
  const chipStatus = (val, label, col) => {
    const active = statusFilter === val;
    const bg = active ? (col||'var(--accent)') : 'transparent';
    const border = active ? (col||'var(--accent)') : 'var(--bdr)';
    return `<button data-status="${val}" style="padding:5px 12px;border-radius:20px;border:1.5px solid ${border};background:${bg};color:${active?'#fff':'var(--t2)'};font-size:12px;font-weight:600;cursor:pointer;transition:all .15s">${label}</button>`;
  };
  return `<div class="sa-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:18px;font-weight:800;color:var(--t1)">Senarai Sekolah</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">PPD Gombak &middot; ${filtered.length} / ${DEMO_SCHOOLS.length} sekolah</div>
      </div>
    </div>
    <!-- Search + filter jenis + filter status (Cadangan 3 + P) -->
    <div style="margin-bottom:14px;display:flex;flex-direction:column;gap:10px">
      <div style="position:relative">
        <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="ppd-school-search" type="text" placeholder="Cari nama atau kod sekolah..." value="${esc(S.ppdSchoolSearch||'')}" style="width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--card);color:var(--t1);font-size:13px;box-sizing:border-box;outline:none;transition:border-color .15s" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--bdr)'">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:var(--t3);font-weight:600">Jenis:</span>
        ${chipJenis('all','Semua')}${chipJenis('SK','SK')}${chipJenis('SJKC','SJKC')}${chipJenis('SJKT','SJKT')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:var(--t3);font-weight:600">Status:</span>
        ${chipStatus('all','Semua','')}${chipStatus('lemah','Lemah &lt;50%','#ef4444')}${chipStatus('baik','Baik &ge;80%','#22c55e')}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${filtered.length === 0 ? `<div style="text-align:center;padding:40px 20px;color:var(--t3);font-size:14px">Tiada sekolah dijumpai.</div>` : filtered.map(({sch, tLayak, sLayak, tTotal, sTotal, tPct, sPct})=>{
        const bar = (pct,col) => `<div style="height:4px;border-radius:2px;background:var(--bdr);margin-top:5px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${col};border-radius:2px;transition:width .3s"></div></div>`;
        const statusDot = (tPct<50||sPct<50) ? `<span style="width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0;display:inline-block"></span>`
          : (tPct>=80&&sPct>=80) ? `<span style="width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;display:inline-block"></span>` : '';
        return `<button data-school="${sch.id}" style="display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:12px;border:1.5px solid var(--bdr);background:var(--card);cursor:pointer;text-align:left;width:100%;transition:border-color .15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--bdr)'">
          <div style="width:46px;height:46px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0">${sch.av}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
              ${statusDot}
              <span style="font-weight:700;font-size:14px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sch.name}</span>
              ${jenisBadge(sch.jenis)}
            </div>
            <div style="font-size:11px;color:var(--t3)">${sch.kod}</div>
          </div>
          <div style="display:flex;gap:20px;flex-shrink:0">
            <div style="min-width:70px">
              <div style="font-size:10px;color:var(--t3);white-space:nowrap">Guru</div>
              <div style="font-size:13px;font-weight:700;color:${tPct<50?'#ef4444':'var(--t1)'};margin-top:1px">${tLayak}<span style="font-size:11px;color:var(--t3);font-weight:400"> / ${tTotal}</span></div>
              ${bar(tPct, tPct<50?'#ef4444':tPct>=80?'#22c55e':'var(--ok)')}
            </div>
            <div style="min-width:70px">
              <div style="font-size:10px;color:var(--t3);white-space:nowrap">Sekolah</div>
              <div style="font-size:13px;font-weight:700;color:${sPct<50?'#ef4444':'var(--t1)'};margin-top:1px">${sLayak}<span style="font-size:11px;color:var(--t3);font-weight:400"> / ${sTotal}</span></div>
              ${bar(sPct, sPct<50?'#ef4444':sPct>=80?'#22c55e':'#6366f1')}
            </div>
          </div>
          <div style="color:var(--t3);flex-shrink:0;font-size:16px">&rsaquo;</div>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}



function viewPPDSchoolDetail() {
  const sch = DEMO_SCHOOLS.find(s=>s.id===S.selectedSchoolId);
  if (!sch) return `<div class="sa-wrap"><p>Sekolah tidak dijumpai.</p></div>`;

  const tRecs = sch.teachers.flatMap(t=>(t.records||[]).map(r=>({...r,_tname:t.name})));
  const sRecs = sch.schoolRecords || [];

  const lvlOrder = ['INT','NAT','NEG','BAH','DAE','SKL'];
  const sortByLevel = arr => [...arr].sort((a,b)=>lvlOrder.indexOf(a.level)-lvlOrder.indexOf(b.level));

  const tLayak = sortByLevel(tRecs.filter(r=>aiKlasifikasi(r).layak));
  const tTidak = sortByLevel(tRecs.filter(r=>!aiKlasifikasi(r).layak));
  const sLayak = sortByLevel(sRecs.filter(r=>aiKlasifikasiSekolah(r).layak));
  const sTidak = sortByLevel(sRecs.filter(r=>!aiKlasifikasiSekolah(r).layak));

  const tByLevel = {}; tLayak.forEach(r=>{const k=LEVEL_MAP_SKPM[r.level]||r.level; tByLevel[k]=(tByLevel[k]||0)+1;});
  const sByLevel = {}; sLayak.forEach(r=>{const k=LEVEL_MAP_SKPM[r.level]||r.level; sByLevel[k]=(sByLevel[k]||0)+1;});

  const lvlBadge = l => `<span style="display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;background:${LVL[l]?.color||'#888'};color:#fff;font-size:11px;font-weight:700;flex-shrink:0">${LVL[l]?.label||l}</span>`;

  const section = (label, aspek, layakArr, tidakArr, byLvl, pfx) => {
    const showLayak = S.ppdFilter===pfx+'_layak';

    return `<div class="card" style="margin-bottom:20px;padding:20px">

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:${showLayak||showTidak?'16px':'0'}">

          <div style="font-size:26px;font-weight:800;color:${showTidak?'#fff':'#ef4444'}">${tidakArr.length}</div>
          <div style="font-size:11px;color:${showTidak?'#fee2e2':'#ef4444'};margin-top:3px;font-weight:600">Tidak Layak &#8600;</div>
        </button>
      </div>
      ${showLayak ? `<div style="display:flex;flex-direction:column;gap:8px">${layakArr.map((r,i)=>{
        const key=pfx+'_l_'+i; const open=S.expandedPpdRecs.includes(key);
        const th=TAHAP_MAP[r.tahap]; const col=LVL[r.level]?.color||'#888';
        return `<button data-ppd-rec="${key}" style="display:block;width:100%;text-align:left;padding:0;border:none;background:none;cursor:pointer">
          <div style="border-radius:10px;border:1.5px solid ${open?col:col+'44'};background:${col}0d;overflow:hidden;transition:border-color .15s">
            <div style="padding:12px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between">
              <div style="min-width:0">
                <div style="font-weight:700;font-size:13px;color:var(--t1)">${r.program}</div>
                ${r._tname?`<div style="font-size:11px;color:var(--t3);margin-top:2px">${r._tname}</div>`:''}
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                ${lvlBadge(r.level)}

                ${r.tarikh?`<div><div style="font-size:10px;color:var(--t3);margin-bottom:2px">Tarikh</div><div style="font-size:12px;font-weight:600;color:var(--t1)">${r.tarikh}</div></div>`:''}
                ${th?`<div><div style="font-size:10px;color:var(--t3);margin-bottom:2px">Tahap</div><div style="font-size:12px;font-weight:600;color:var(--t1)">${th.short||th.label}</div></div>`:''}
                ${r.kategori?`<div><div style="font-size:10px;color:var(--t3);margin-bottom:2px">Kategori</div><div style="font-size:12px;font-weight:600;color:var(--t1)">${r.kategori}</div></div>`:''}
                ${r.peranan?`<div><div style="font-size:10px;color:var(--t3);margin-bottom:2px">Peranan</div><div style="font-size:12px;font-weight:600;color:var(--t1)">${r.peranan}</div></div>`:''}
              </div>

              ${r.catatan?`<div style="margin-top:8px;padding:8px 10px;border-radius:6px;background:${col}18"><div style="font-size:10px;color:var(--t3);margin-bottom:3px">Catatan</div><div style="font-size:11px;color:var(--t1)">${r.catatan}</div></div>`:''}
            </div>`:''}
          </div>
        </button>`;
      }).join('')}</div>` : ''}
      ${showTidak ? `<div style="display:flex;flex-direction:column;gap:8px">${tidakArr.map((r,i)=>{
        const key=pfx+'_t_'+i; const open=S.expandedPpdRecs.includes(key);
        const th=TAHAP_MAP[r.tahap];
        const reasons=(pfx==='guru'?aiKlasifikasi(r):aiKlasifikasiSekolah(r)).reasons;
        return `<button data-ppd-rec="${key}" style="display:block;width:100%;text-align:left;padding:0;border:none;background:none;cursor:pointer">
          <div style="border-radius:10px;border:1.5px solid ${open?'#ef4444':'#ef444444'};background:#ef44440d;overflow:hidden;transition:border-color .15s">
            <div style="padding:12px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between">
              <div style="min-width:0">
                <div style="font-weight:700;font-size:13px;color:var(--t1)">${r.program}</div>
                ${r._tname?`<div style="font-size:11px;color:var(--t3);margin-top:2px">${r._tname}</div>`:''}
                <div style="font-size:10px;color:#ef4444;margin-top:3px">${reasons[0]||''}</div>

              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">

            </div>
            ${open?`<div style="padding:0 14px 14px;border-top:1px solid #ef444433">

                ${r.kategori?`<div><div style="font-size:10px;color:var(--t3);margin-bottom:2px">Kategori</div><div style="font-size:12px;font-weight:600;color:var(--t1)">${r.kategori}</div></div>`:''}

        </button>`;

      <div>

      <div class="card" style="padding:14px 16px">

        <div style="font-size:28px;font-weight:800;color:#22c55e">${tPct}%</div>
        <div style="font-size:11px;color:var(--t3);margin-top:1px">${tLayak.length} / ${tTotal} layak</div>
        ${progBar(tPct,'#22c55e')}
        ${Object.keys(tByLevel).length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${lvlChips(tByLevel)}</div>` : ''}
      </div>
      <div class="card" style="padding:14px 16px">

        <div style="font-size:28px;font-weight:800;color:#6366f1">${sPct}%</div>
        <div style="font-size:11px;color:var(--t3);margin-top:1px">${sLayak.length} / ${sTotal} layak</div>
        ${progBar(sPct,'#6366f1')}
        ${Object.keys(sByLevel).length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${lvlChips(sByLevel)}</div>` : ''}
      </div>
    </div>
    ${section('Pencapaian Guru','SKPM 5.4.1',tLayak,tTidak,tByLevel,'guru')}
    ${section('Pencapaian Sekolah','SKPM 5.4.2',sLayak,sTidak,sByLevel,'skl')}
  </div>`;
}

/* -- Build app ------------------------------------------------- */
function buildContent() {
  if (S.role === 'ppd_admin') {
    return S.ppdView==='school_detail' ? viewPPDSchoolDetail()
      : S.ppdView==='schools'          ? viewPPDSchools()
      : S.ppdView==='charts'           ? viewPPDCharts()
      : S.ppdView==='reset_password'   ? viewPPDResetPassword()
      : viewPPDAnalysis();
  }
  if (S.role === 'school_admin') {
    return S.saView==='users'                       ? viewUsers()
      : S.saView==='teacher_detail'                  ? viewTeacherDetail()
      : S.saView==='school_achievements'             ? viewSchoolAchievements()
      : S.saView==='school_achievement_detail'       ? viewSchoolAchievementDetail()
      : S.saView==='school_form'                     ? viewSchoolForm()
      : S.saView==='school_profile'                  ? viewSchoolProfile()
      : S.saView==='gallery'                         ? viewGallery()
      : viewSchoolAdmin();
  }
  return S.view==='dashboard' ? viewDashboard()
    : S.view==='records'      ? viewRecords()
    : S.view==='record_detail'? viewRecordDetail()
    : S.view==='form'         ? viewForm()
    : S.view==='gallery'      ? viewGallery()
    : viewDetail();
}

function buildTopbarTitle() {
  if (S.role === 'ppd_admin') {
    return { analysis:'Analisis Daerah', charts:'Carta & Analitik', schools:'Senarai Sekolah', school_detail:'Butiran Sekolah', reset_password:'Urus Kata Laluan' }[S.ppdView] || 'SK@S';
  }
  if (S.role === 'school_admin') {
    return { analysis:'Analisis Pencapaian', users:'Senarai Pengguna', teacher_detail:'Rekod Guru', school_achievements:'Pencapaian Sekolah', school_achievement_detail:'Butiran Pencapaian Sekolah', school_form:'Tambah Pencapaian Sekolah', school_profile:'Profil Sekolah', gallery:'Galeri Gambar' }[S.saView] || 'SK@S';
  }
  return { dashboard:'Papan Pemuka Guru', records:'Rekod Pencapaian Saya', form:'Tambah Pencapaian', detail:'Butiran Pencapaian', record_detail:'Detail Pencapaian', gallery:'Galeri Aktiviti' }[S.view] || 'SK@S';
}

function buildApp() {
  const contentHtml = buildContent();
  if (S.role === 'ppd_admin') {
    // Count new records (demo: records submitted in last 7 days across all schools)
    const allNewRecs = DEMO_SCHOOLS.flatMap(sch=>[
      ...sch.teachers.flatMap(t=>(t.records||[]).filter(r=>r.tarikh&&((new Date()-new Date(r.tarikh))/864e5)<7)),
      ...(sch.schoolRecords||[]).filter(r=>r.tarikh&&((new Date()-new Date(r.tarikh))/864e5)<7)
    ]);
    const notifCount = S.ppdNotifSeen ? 0 : allNewRecs.length;
    const bellBadge = notifCount>0
      ? `<span style="position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:#ef4444;border-radius:8px;border:2px solid var(--surface);font-size:9px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;line-height:1;padding:0 2px">${notifCount>9?'9+':notifCount}</span>`
      : `<span class="bell-dot"></span>`;
    return `${sidebarAdmin()}
    <div class="main">
      <div class="topbar">
        <div class="tb-info"><div class="g">Admin PPD &middot; PPD Gombak</div><div class="n">${buildTopbarTitle()}</div></div>
        <button id="ppd-bell-btn" class="bell-btn" style="position:relative">${IC.bell}${bellBadge}</button>
      </div>
      <div class="content">${contentHtml}</div>
    </div>`;
  }
  if (S.role === 'school_admin') {
    return `${sidebarAdmin()}
    <div class="main">
      <div class="topbar">
        <div class="tb-info"><div class="g">Pentadbir Sekolah &middot; SK Wangsa Maju 1</div><div class="n">${buildTopbarTitle()}</div></div>
        <button class="bell-btn">${IC.bell}<span class="bell-dot"></span></button>
      </div>
      <div class="content">${contentHtml}</div>
    </div>`;
  }
  return `${sidebar()}
  <div class="main">
    ${topbar(buildTopbarTitle())}
    <div class="content">${contentHtml}</div>
  </div>`;
}

      </div>

        <button id="myp-cancel" style="padding:9px 18px;border-radius:9px;border:1.5px solid var(--border-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--t1);cursor:pointer">Batal</button>

      ov.remove();

  document.querySelectorAll('[data-teacher]').forEach(b=>b.addEventListener('click',()=>setState({saView:'teacher_detail',selectedTeacherId:b.dataset.teacher})));

  function openTeacherModal(tid) {
    const existing=document.getElementById('teacher-crud-modal'); if(existing)existing.remove();

    ov.id='teacher-crud-modal';
    ov.style.cssText=teacherModalStyle;
    const title=teacher?'Edit Maklumat Guru':'Tambah Guru Baharu';

          <label style="font-size:11.5px;font-weight:600;color:var(--t3);display:block;margin-bottom:4px">Nama *</label>

          <label style="font-size:11.5px;font-weight:600;color:var(--t3);display:block;margin-bottom:4px">Jawatan</label>
          <input id="tcm-jawatan" type="text" class="input" value="${esc(teacher?teacher.jawatan:'')}" placeholder="Contoh: Guru Kelas" style="width:100%;box-sizing:border-box">

  });

  // extract
  const ex=document.getElementById('btn-extract');
  if(ex)ex.addEventListener('click',()=>{
    setState({extracting:true});
    setTimeout(()=>setState({extracting:false,extracted:true}),1800);
  });

  // draft
  const dr=document.getElementById('btn-draft');
  if(dr)dr.addEventListener('click',()=>{
    setState({generating:true,draftText:'',draftDone:false});
    const tahapLabel = TAHAP_MAP[S.f.tahap]?.short || '';
    const pgsh = S.f.pengesahan ? ` Pencapaian ini disahkan melalui ${S.f.pengesahan}.` : '';
    const full = `Guru telah menyertai ${S.f.program} di peringkat ${LVL[S.f.level]?.label||S.f.level} sebagai ${S.f.peranan}${tahapLabel?` dan mencapai ${tahapLabel}`:''}, membuktikan komitmen peribadi beliau dalam meningkatkan profesionalisme dalam bidang pendidikan.${pgsh} Pencapaian ini merupakan pencapaian individu guru yang diiktiraf secara rasmi oleh KPM, mencerminkan kualiti dan kecemerlangan guru yang menyumbang kepada Standard 5.4.1 Pencapaian Guru dalam SKPM Kualiti@Sekolah ${TAHUN_SEMASA}.`;
    let ci=0;
    const iv=setInterval(()=>{
      ci+=4;
      const cur=full.slice(0,ci);
      const ta=document.getElementById('ta-draft');
      if(ta)ta.value=cur;
      S.draftText=cur;
      if(ci>=full.length){
        clearInterval(iv);
        setState({generating:false,draftText:full,draftDone:true});
      }
    },22);
  });

  // submit
  const sb=document.getElementById('btn-submit');
  if(sb)sb.addEventListener('click',()=>{
    const ta=document.getElementById('ta-draft');
    const draft=ta?ta.value:S.draftText;
    if(S.editingId) {
      S.records=S.records.map(rec=>rec.id===S.editingId?{
        ...rec,
        program:S.f.program,level:S.f.level,peranan:S.f.peranan,
        tarikh:S.f.tarikhmula,tahap:S.f.tahap,pengesahan:S.f.pengesahan,
        pautanEviden:S.f.pautanEviden,draft:draft||rec.draft,
        tags:[`#${LVL[S.f.level]?.label||S.f.level}`,`#5.4.1`],
      }:rec);
      setState({view:'record_detail',selectedRecordId:S.editingId,editingId:null,formStep:1});
    } else {
      const newRec={
        id:'r'+Date.now(),
        program:S.f.program,
        level:S.f.level,peranan:S.f.peranan,
        tarikh:S.f.tarikhmula,
        tahap:S.f.tahap,pengesahan:S.f.pengesahan,
        pautanEviden:S.f.pautanEviden,
        status:'pending',draft:draft||null,
        tags:[`#${LVL[S.f.level]?.label||S.f.level}`,`#5.4.1`],
      };
      S.records=[newRec,...S.records];
      setState({view:'dashboard',formStep:1});
    }
  });

  // Edit record
  const editBtn=document.getElementById('btn-edit-rec');
  if(editBtn)editBtn.addEventListener('click',()=>{
    const r=S.records.find(x=>x.id===S.selectedRecordId);
    if(!r)return;
    setState({
      view:'form',formStep:1,editingId:r.id,
      f:{program:r.program,tarikhmula:r.tarikh,tarikhakhir:'',level:r.level,peranan:r.peranan,tahap:r.tahap,pengesahan:r.pengesahan,pautanEviden:r.pautanEviden||'',catatan:r.catatan||'',hasSijil:false},
      extracting:false,extracted:false,generating:false,draftText:r.draft||'',draftDone:!!r.draft
    });
  });

  // Delete record
  const delBtn=document.getElementById('btn-delete-rec');
  const modal=document.getElementById('modal-delete');
  if(delBtn&&modal){
    delBtn.addEventListener('click',()=>{ modal.style.display='flex'; });
    document.getElementById('btn-delete-cancel').addEventListener('click',()=>{ modal.style.display='none'; });
    document.getElementById('btn-delete-confirm').addEventListener('click',()=>{
      S.records=S.records.filter(x=>x.id!==S.selectedRecordId);
      setState({view:'records',selectedRecordId:null});
    });
  }
}

render();
</script>
