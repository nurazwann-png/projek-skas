<!DOCTYPE html>

<head>

<link rel="stylesheet" href="assets/ppd-theme.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--ppd-font); font-size: 14px; line-height: 1.5; background: var(--ppd-bg); color: var(--ppd-t1); min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
:root { --ef-c: #1d5fa0; }

.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.ef-head { background: var(--ppd-surface); border-bottom: 1px solid var(--ppd-border); box-shadow: var(--ppd-shadow); position: sticky; top: 0; z-index: 30; }
.ef-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-block: 12px; }
.ef-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ef-logo { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--ef-c) 13%, var(--ppd-surface)); color: var(--ef-c); flex-shrink: 0; }
.ef-logo svg { width: 22px; height: 22px; }
.ef-title { font-size: 17px; font-weight: 800; line-height: 1.2; }
.ef-sub { font-size: 12px; color: var(--ppd-t3); }

.seg { display: flex; gap: 2px; padding: 3px; background: var(--ppd-surface-2); border: 1px solid var(--ppd-border); border-radius: 10px; overflow-x: auto; max-width: 100%; }
.seg button { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--ppd-t2); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; position: relative; }
.seg button:hover { color: var(--ppd-t1); background: var(--ppd-surface); }
.seg button.on { background: var(--ppd-navy); color: #fff; box-shadow: inset 0 -3px 0 var(--ppd-gold); }
.seg svg { width: 16px; height: 16px; }

/* Icons */
.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Page */
.page { padding-block: 24px 48px; display: grid; gap: 20px; }
.pg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pg-title { font-size: 21px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.pg-desc { color: var(--ppd-t2); font-size: 13px; max-width: 62ch; margin-top: 2px; }

/* Workflow */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); background: var(--ppd-surface); border: 1px solid var(--ppd-border); border-radius: var(--ppd-radius); box-shadow: var(--ppd-shadow); overflow: hidden; }
.flow-step { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-width: 0; position: relative; }
.flow-step + .flow-step { border-left: 1px solid var(--ppd-border); }
.flow-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex-shrink: 0; background: var(--ppd-surface-2); border: 1.5px solid var(--ppd-border); color: var(--ppd-t3); }
.flow-step.me .flow-n { background: var(--ppd-navy); border-color: var(--ppd-navy); color: #fff; }
.flow-step.me { background: color-mix(in srgb, var(--ppd-gold) 8%, var(--ppd-surface)); box-shadow: inset 0 -3px 0 var(--ppd-gold); }
.flow-t { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
.flow-s { font-size: 11px; color: var(--ppd-t3); line-height: 1.3; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpi { background: var(--ppd-surface); border: 1px solid var(--ppd-border); border-radius: var(--ppd-radius); padding: 14px 16px; box-shadow: var(--ppd-shadow); display: flex; align-items: center; gap: 12px; min-width: 0; }
.kpi-ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; color: var(--k); background: color-mix(in srgb, var(--k) 13%, var(--ppd-surface)); }
.kpi-ic svg { width: 20px; height: 20px; }
.kpi-num { font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-lbl { font-size: 12px; color: var(--ppd-t2); font-weight: 600; }
.kpi-sub { font-size: 11px; color: var(--ppd-t3); }

/* Panel */
.panel { background: var(--ppd-surface); border: 1px solid var(--ppd-border); border-radius: var(--ppd-radius); box-shadow: var(--ppd-shadow); overflow: hidden; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--ppd-border); }
.panel-b { padding: 18px; }
.sec-t { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
.sec-t::before { content: ''; width: 4px; height: 18px; border-radius: 2px; background: var(--ppd-gold); flex-shrink: 0; }
.muted { color: var(--ppd-t3); font-size: 12px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ppd-border); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs button { min-height: 44px; padding: 0 16px; border: 0; background: none; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ppd-t2); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.tabs button:hover { color: var(--ppd-accent); }
.tabs button.on { color: var(--ppd-accent); border-bottom-color: var(--ppd-gold); }
.tabs .count { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--ppd-surface-2); border: 1px solid var(--ppd-border); color: var(--ppd-t2); }

/* Form */
.form { display: grid; gap: 16px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.fg { display: grid; gap: 6px; min-width: 0; align-content: start; }
.fl { font-size: 13px; font-weight: 700; color: var(--ppd-t1); }
.fl .req { color: var(--ppd-danger); margin-left: 2px; }
.fh { font-size: 11.5px; color: var(--ppd-t3); }
.fi { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--ppd-border); border-radius: 8px; background: var(--ppd-surface); font-size: 14px; transition: border-color .15s, box-shadow .15s; }
textarea.fi { resize: vertical; min-height: 104px; line-height: 1.55; }
.fi::placeholder { color: var(--ppd-t3); }
.fi:hover { border-color: color-mix(in srgb, var(--ppd-accent) 40%, var(--ppd-border)); }
.fi.err { border-color: var(--ppd-danger); }
:is(button, a, .fi, select):focus-visible { outline: 3px solid var(--ppd-gold); outline-offset: 2px; }
.fi:focus { outline: none; border-color: var(--ppd-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ppd-gold) 45%, transparent); }
.drop { border: 2px dashed var(--ppd-border); border-radius: 10px; padding: 26px 16px; text-align: center; background: var(--ppd-surface-2); cursor: pointer; transition: border-color .15s, background .15s; display: grid; justify-items: center; gap: 6px; }
.drop:hover { border-color: var(--ppd-accent); background: var(--ppd-accent-l); }
.drop svg { width: 30px; height: 30px; color: var(--ppd-accent); }
.drop b { font-size: 13.5px; }
.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--ppd-border); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn-lg { min-height: 46px; padding: 0 22px; font-size: 14px; }
.btn-pri { background: var(--ppd-navy); color: #fff; }
.btn-pri:hover { background: var(--ppd-navy-2); }
.btn-ok { background: #067647; color: #fff; }
.btn-ok:hover { background: #05603a; }
.btn-no { background: var(--ppd-surface); color: var(--ppd-danger); border-color: color-mix(in srgb, var(--ppd-danger) 55%, var(--ppd-border)); }
.btn-no:hover { background: var(--ppd-danger-l); }
.btn-pur { background: #6941c6; color: #fff; }
.btn-pur:hover { background: #5631b0; }
.btn-gh { background: var(--ppd-surface); color: var(--ppd-t1); border-color: var(--ppd-border); }
.btn-gh:hover { border-color: var(--ppd-accent); color: var(--ppd-accent); background: var(--ppd-accent-l); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 12.5px; }

/* Pills */
.pill { --c: #667085; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--ppd-surface)); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.k::before { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill { color: color-mix(in srgb, var(--c) 50%, #fff); background: color-mix(in srgb, var(--c) 22%, var(--ppd-surface)); } }
:root[data-theme="dark"] .pill { color: color-mix(in srgb, var(--c) 50%, #fff); background: color-mix(in srgb, var(--c) 22%, var(--ppd-surface)); }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ppd-t3); background: var(--ppd-surface-2); padding: 10px 14px; border-bottom: 1px solid var(--ppd-border); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--ppd-border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--ppd-accent) 4%, var(--ppd-surface)); }
.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; color: var(--ppd-t2); white-space: nowrap; }
.t-strong { font-weight: 600; min-width: 170px; }
.nowrap { white-space: nowrap; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; min-width: 120px; }

/* Ticket cards (PJ) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tcard { background: var(--ppd-surface); border: 1px solid var(--ppd-border); border-radius: var(--ppd-radius); box-shadow: var(--ppd-shadow); padding: 16px; display: grid; gap: 10px; border-left: 4px solid var(--kc, var(--ppd-border)); }
.tcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tcard h3 { font-size: 15px; font-weight: 700; line-height: 1.35; }
.meta { display: grid; gap: 4px; font-size: 12.5px; color: var(--ppd-t2); }
.meta span { display: flex; align-items: center; gap: 7px; }
.meta svg { width: 14px; height: 14px; color: var(--ppd-t3); flex-shrink: 0; }
.tcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--ppd-border); }
.tcard-foot .btn { min-height: 44px; }

/* Status summary */
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Empty */
.empty { text-align: center; padding: 44px 16px; color: var(--ppd-t3); display: grid; justify-items: center; gap: 8px; }
.empty svg { width: 40px; height: 40px; color: var(--ppd-border); }
.empty b { color: var(--ppd-t2); font-size: 14px; }

/* Modal */
.ov { position: fixed; inset: 0; z-index: 80; background: rgba(7,28,51,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; background: var(--ppd-surface); border: 1px solid var(--ppd-border); border-top: 4px solid var(--ppd-gold); border-radius: var(--ppd-radius); box-shadow: 0 24px 64px rgba(0,0,0,.3); animation: up .18s ease; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.m-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--ppd-border); position: sticky; top: 0; background: var(--ppd-surface); z-index: 1; }
.m-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
.m-title { font-size: 18px; font-weight: 800; line-height: 1.3; }
.x { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--ppd-border); background: var(--ppd-surface); cursor: pointer; display: grid; place-items: center; color: var(--ppd-t2); flex-shrink: 0; }
.x:hover { background: var(--ppd-surface-2); color: var(--ppd-t1); }
.x svg { width: 18px; height: 18px; }
.m-body { padding: 18px 20px 22px; display: grid; gap: 16px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1px solid var(--ppd-border); border-radius: 8px; overflow: hidden; }
.fact { padding: 10px 12px; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--ppd-border); }
.fact small { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ppd-t3); }
.fact div { font-size: 13px; font-weight: 600; }
.box { border: 1px solid var(--ppd-border); border-radius: 8px; padding: 12px 14px; background: var(--ppd-surface-2); }
.box h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ppd-t3); margin-bottom: 4px; }
.box p { font-size: 13.5px; color: var(--ppd-t1); }
.box.pj { background: color-mix(in srgb, #b54708 7%, var(--ppd-surface)); border-color: color-mix(in srgb, #b54708 30%, var(--ppd-border)); }
.box.pj h4 { color: var(--ppd-warn); }
.act-box { border: 1px solid color-mix(in srgb, var(--ppd-accent) 30%, var(--ppd-border)); background: var(--ppd-accent-l); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.act-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act-row .btn { min-height: 48px; }

/* Timeline */
.tl { list-style: none; display: grid; }
.tl li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.tl li:last-child { padding-bottom: 0; }
.tl li::before { content: ''; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--ppd-border); }
.tl li:last-child::before { display: none; }
.tl-dot { --c: #667085; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, var(--ppd-surface)); color: var(--c); border: 2px solid var(--c); }
.tl-dot svg { width: 13px; height: 13px; stroke-width: 3; }
.tl li:last-child .tl-dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.tl-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tl-d { font-size: 12px; color: var(--ppd-t3); font-variant-numeric: tabular-nums; }
.tl-t { font-size: 13.5px; margin-top: 3px; }
.tl-o { font-size: 12px; color: var(--ppd-t3); }

/* Toast */
#toast-container { position: fixed; z-index: 90; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; max-width: 340px; padding: 12px 14px; border-radius: 8px; background: var(--ppd-surface); color: var(--ppd-t1); border: 1px solid var(--ppd-border); border-left: 4px solid var(--tc); box-shadow: var(--ppd-shadow-lg); font-size: 13px; font-weight: 600; animation: up .2s ease; }
.toast svg { width: 18px; height: 18px; color: var(--tc); flex-shrink: 0; }

/* Responsive */
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .flow { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .flow-step:nth-child(3) { border-left: 0; }
  .flow-step:nth-child(n+3) { border-top: 1px solid var(--ppd-border); }
  .facts { grid-template-columns: 1fr 1fr; }
  .fact:nth-child(3) { border-left: 0; }
  .fact:nth-child(n+3) { border-top: 1px solid var(--ppd-border); }
}
@media (max-width: 640px) {
  .ef-head .wrap { padding-block: 10px; }
  .seg { width: 100%; }
  .seg button { flex: 1; justify-content: center; padding: 0 8px; min-height: 44px; }
  .frow { grid-template-columns: 1fr; }
  .kpis.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .kpis.k3 .kpi { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }
  .kpi-ic { width: 36px; height: 36px; }
  .kpi-num { font-size: 20px; }
  .flow-s { display: none; }
  .cards { grid-template-columns: 1fr; }
  .act-row { grid-template-columns: 1fr; }
  .ov { padding: 0; align-items: flex-end; }
  .modal { max-height: 94vh; border-radius: 14px 14px 0 0; }
  .m-head, .m-body { padding-left: 16px; padding-right: 16px; }
  .form-foot .btn { width: 100%; }
}
.seg-lbl-short { display: none; }
@media (max-width: 420px) { .seg-lbl-long { display: none; } .seg-lbl-short { display: inline; } }
</style>

function badge(text) { return `<span class="pill" style="--c:${STATUS_C[text]||'#667085'}">${text}</span>`; }
function keuBadge(k) { return `<span class="pill k" style="--c:${KEU_C[k]||'#667085'}">${k}</span>`; }
function now() {
  return new Date().toLocaleString('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','');
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.setProperty('--tc', type==='ok' ? '#067647' : '#b42318');
  el.innerHTML = ic(type==='ok' ? 'check' : 'alert') + `<span>${esc(msg)}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

function openModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div id="modal-overlay" class="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
  document.addEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}

function timelineHTML(tl) {
  if (!tl || !tl.length) return '<p class="muted">Tiada rekod.</p>';
  return `<ol class="tl">` + tl.map(t => `
    <li>

}

                <tr>
                  <td class="mono">${t.id}</td>
                  <td class="nowrap">${esc(t.sekolah)}</td>
                  <td class="t-strong">${esc(t.tajuk)}</td>
                  <td>${keuBadge(t.keutamaan)}</td>
                  <td style="min-width:180px;max-width:300px;color:var(--ppd-t2);font-size:12.5px">${esc(t.notaPJ||'—')}</td>
                  <td><div class="acts">
                    <button data-lulus-bajet="${t.id}" class="btn btn-pur btn-sm">${ic('check')}Luluskan Bajet</button>
                    <button data-view-tiket="${t.id}" class="btn btn-gh btn-sm">${ic('eye')}Lihat</button>
                  </div></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`}
      </div>

      <div class="panel">
        <div class="panel-h">
          <h2 class="sec-t">Semua Aduan</h2>
          <div class="legend">${Object.entries(statusCounts).map(([s,c])=>`<span class="pill" style="--c:${STATUS_C[s]||'#667085'}">${s} · ${c}</span>`).join('')}</div>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>ID</th><th>Sekolah</th><th>Tajuk</th><th>Tarikh</th><th>Keutamaan</th><th>Status</th><th>Tindakan</th></tr></thead>
            <tbody>
              ${TIKET_DATA.map(t=>`
                <tr>
                  <td class="mono">${t.id}</td>
                  <td class="nowrap">${esc(t.sekolah)}</td>
                  <td class="t-strong">${esc(t.tajuk)}</td>
                  <td class="nowrap">${t.tarikh}</td>
                  <td>${keuBadge(t.keutamaan)}</td>
                  <td>${badge(t.status)}</td>
                  <td><div class="acts">
                    <button data-view-tiket="${t.id}" class="btn btn-gh btn-sm">${ic('eye')}Lihat</button>
                    ${t.status==='Lulus Bajet'?`<button data-selesai="${t.id}" class="btn btn-ok btn-sm">${ic('check')}Tandakan Selesai</button>`:''}
                  </div></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </main>`;
}

// ══════════════════════════════════════════════
// MAIN RENDER
// ══════════════════════════════════════════════
function render() {
  let content = '';
  if (state.role==='sekolah') content = renderSekolah();
  else if (state.role==='pj') content = renderPJ();
  else content = renderPPD();
  document.getElementById('app').innerHTML = renderHeader() + content;
  bindEvents();
}

// ══════════════════════════════════════════════
// EVENT BINDING
// ══════════════════════════════════════════════
function bindEvents() {
  document.querySelectorAll('[data-role]').forEach(btn => {
    btn.addEventListener('click', () => { state.role = btn.dataset.role; state.subTab = 'baru'; render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll('[data-subtab]').forEach(btn => {
    btn.addEventListener('click', () => { state.subTab = btn.dataset.subtab; render(); });
  });
  const sf = document.getElementById('filter-sekolah');
  if (sf) sf.addEventListener('change', () => { state.sekolahFilter=sf.value; render(); });
  document.querySelectorAll('[data-zon]').forEach(btn => {
    btn.addEventListener('click', () => { state.zonFilter=btn.dataset.zon; render(); });
  });
  const btnHantar = document.getElementById('btn-hantar');
  if (btnHantar) btnHantar.addEventListener('click', handleHantarAduan);
  document.querySelectorAll('[data-view-tiket]').forEach(btn => {
    btn.addEventListener('click', () => openTiketDetail(btn.dataset.viewTiket));
  });
  document.querySelectorAll('[data-pj-semak]').forEach(btn => {
    btn.addEventListener('click', () => openPJSemak(btn.dataset.pjSemak));
  });
  document.querySelectorAll('[data-lulus-bajet]').forEach(btn => {
    btn.addEventListener('click', () => lulusBajet(btn.getAttribute('data-lulus-bajet')));
  });
  document.querySelectorAll('[data-selesai]').forEach(btn => {
    btn.addEventListener('click', () => tandaSelesai(btn.dataset.selesai));
  });
}

// ══════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════
function handleHantarAduan() {
  const fields = ['f-sekolah','f-tajuk','f-kategori','f-keutamaan','f-butiran'].map(id => document.getElementById(id));
  fields.forEach(f => f.classList.toggle('err', !f.value.trim()));
  const missing = fields.find(f => !f.value.trim());
  if (missing) { showToast('Sila lengkapkan semua medan bertanda *', 'err'); missing.focus(); return; }
  const [sekolah, tajuk, kategori, keutamaan, butiran] = fields.map(f => f.value.trim());
  const zon = sekolah==='SMK Dalat'?'Zon 1':sekolah==='SMK Batang Igan'?'Zon 3':'Zon 2';
  const tarikh = new Date().toISOString().slice(0,10);
  const id = `TKT-2024-00${tiketCounter++}`;
  TIKET_DATA.push({
    id, tajuk, kategori, butiran, sekolah, zon, tarikh,
    status:'Baru', keutamaan, gambar:null, notaPJ:null, notaPPD:null,
    timeline:[{ tarikh:now(), tindakan:'Aduan dihantar oleh sekolah', oleh:sekolah, status:'Baru' }]
  });
  showToast(`Aduan ${id} berjaya dihantar.`);
  state.sekolahFilter = sekolah;
  state.subTab = 'saya';
  render();
}

function openTiketDetail(id) {
  const t = TIKET_DATA.find(x=>x.id===id);
  if (!t) return;
  openModal(ticketDetailHTML(t));
  document.getElementById('close-modal-btn').addEventListener('click', closeModal);
}

function openPJSemak(id) {
  const t = TIKET_DATA.find(x=>x.id===id);
  if (!t) return;
  let actions = '';
  if (t.status==='Baru') {
    actions = `
      <div class="act-box">
        <label class="fl" for="nota-pj-input">Nota Siasatan Teknikal &amp; Anggaran Kos<span class="req">*</span></label>
        <textarea id="nota-pj-input" class="fi" rows="3" placeholder="Contoh: Paip PVC 4 inci perlu diganti. Anggaran kos RM 850. Kerja boleh siap dalam 2 hari.">${esc(t.notaPJ||'')}</textarea>
        <span class="fh">Wajib untuk pengesahan. Untuk penolakan, nyatakan sebab di sini.</span>
        <div class="act-row">
          <button id="btn-sah" class="btn btn-ok">${ic('check')}Sah &amp; Sokong Pembaikan</button>
          <button id="btn-tolak" class="btn btn-no">${ic('x')}Tolak Aduan</button>
        </div>
      </div>`;
  } else if (t.notaPJ) {
    actions = `<div class="box pj"><h4>Nota Siasatan Penolong Jurutera</h4><p>${esc(t.notaPJ)}</p></div>`;
  }
  openModal(ticketDetailHTML(t, actions));
  document.getElementById('close-modal-btn').addEventListener('click', closeModal);

  const btnSah = document.getElementById('btn-sah');
  const btnTolak = document.getElementById('btn-tolak');
  if (btnSah) btnSah.addEventListener('click', () => {
    const inp = document.getElementById('nota-pj-input');
    const nota = inp.value.trim();
    if (!nota) { inp.classList.add('err'); inp.focus(); showToast('Sila masukkan nota siasatan teknikal', 'err'); return; }
    t.notaPJ = nota;
    t.status = 'Disemak PJ';
    t.timeline.push({ tarikh:now(), tindakan:'Aduan disahkan oleh PJ. '+nota, oleh:'Penolong Jurutera', status:'Disemak PJ' });
    closeModal();
    showToast(`Aduan ${t.id} disahkan dan dihantar ke PPD.`);
    render();
  });
  if (btnTolak) btnTolak.addEventListener('click', () => {
    const nota = document.getElementById('nota-pj-input').value.trim();
    t.status = 'Ditolak';
    t.timeline.push({ tarikh:now(), tindakan:'Aduan ditolak oleh PJ.'+(nota?' Sebab: '+nota:''), oleh:'Penolong Jurutera', status:'Ditolak' });
    closeModal();
    showToast(`Aduan ${t.id} ditolak.`, 'err');
    render();
  });
}

function lulusBajet(id) {
  const t = TIKET_DATA.find(x=>x.id===id);
  if (!t) return;
  t.status = 'Lulus Bajet';
  t.timeline.push({ tarikh:now(), tindakan:'Bajet diluluskan oleh PPD Dalat.', oleh:'PPD Dalat', status:'Lulus Bajet' });
  showToast(`Bajet untuk ${t.id} diluluskan.`);
  render();
}

function tandaSelesai(id) {
  const t = TIKET_DATA.find(x=>x.id===id);
  if (!t) return;
  t.status = 'Selesai';
  t.timeline.push({ tarikh:now(), tindakan:'Kerja pembaikan disahkan selesai oleh PPD.', oleh:'PPD Dalat', status:'Selesai' });
  showToast(`Aduan ${t.id} ditandakan Selesai.`);
  render();
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
render();
</script>
</body>
</html>
