<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analitik SPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── Tokens ── */
:root {
  --bg:      #0f172a; --surface: #1e293b; --surface2: #293548;
  --border:  #334155; --t1: #f1f5f9; --t2: #94a3b8; --t3: #64748b;
  --accent:  #3b82f6; --green: #22c55e; --red: #ef4444; --yellow: #eab308;
  color-scheme: dark;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--t1); font-size: 14px; line-height: 1.5; min-height: 100vh; }

/* ── Demo bar ── */
.demo-bar {
  background: rgba(234,179,8,.08); border-bottom: 1px solid rgba(234,179,8,.2);
  padding: 8px max(16px, env(safe-area-inset-left,0px));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 12px; color: #fcd34d;
}
.demo-bar strong { font-weight: 700; }
.demo-btns { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.demo-btn {
  padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700;
  border: 1px solid; cursor: pointer; font-family: inherit; background: transparent;
  transition: opacity .15s;
}
.demo-btn:hover { opacity: .8; }
.demo-btn.guru     { color: #22c55e; border-color: #22c55e; }
.demo-btn.pentadbir{ color: #a78bfa; border-color: #a78bfa; }
.demo-btn.ppd      { color: #60a5fa; border-color: #60a5fa; }

/* ── Topbar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-left,0px)); height: 56px;
}
.back-btn {
  display: flex; align-items: center; gap: 6px; color: var(--t2);
  text-decoration: none; font-size: 13px; font-weight: 600; transition: color .15s;
}
.back-btn:hover { color: var(--t1); }
.back-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.topbar-sep { width:1px; height:20px; background:var(--border); }
.topbar-title { font-size:15px; font-weight:800; }
.role-chip {
  padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
}
.role-chip.guru      { background: rgba(34,197,94,.12); color:#4ade80; border:1px solid rgba(34,197,94,.25); }
.role-chip.pentadbir { background: rgba(167,139,250,.12); color:#c4b5fd; border:1px solid rgba(167,139,250,.25); }
.role-chip.ppd       { background: rgba(59,130,246,.12); color:#93c5fd; border:1px solid rgba(59,130,246,.25); }
.topbar-user { margin-left:auto; font-size:12px; color:var(--t3); }

/* ── Tabs ── */
.tab-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto;
  padding: 0 max(16px, env(safe-area-inset-left,0px));
}
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn {
  padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--t3);
  background: transparent; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap; font-family: inherit; transition: color .15s, border-color .15s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:hover:not(.active) { color: var(--t2); }

/* ── Layout ── */
.main { padding: 24px max(16px, env(safe-area-inset-left,0px)); max-width: 1200px; margin: 0 auto; }
section { display: none; }
section.active { display: block; }

/* ── Section headers ── */
.sh { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
.sh-title { font-size:16px; font-weight:800; }
.sh-sub { font-size:12px; color:var(--t3); margin-top:3px; }
.filter-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:20px; }
.filter-label { font-size:11px; color:var(--t3); font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
.sel {
  background:var(--surface); border:1px solid var(--border); color:var(--t1);
  border-radius:8px; padding:8px 12px; font-size:13px; font-family:inherit; cursor:pointer; outline:none;
}
.sel:focus { border-color:var(--accent); }

/* ── KPI cards ── */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:24px; }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
.kpi-lbl { font-size:11px; color:var(--t3); font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
.kpi-val { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; margin-bottom:8px; }
.kpi-delta { font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:3px; }
.kpi-note { font-size:11px; color:var(--t3); margin-top:4px; }
.green { color: var(--green); } .yellow { color: var(--yellow); } .red-c { color: var(--red); }

/* ── Chart cards ── */
.chart-grid { display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; }
@media(min-width:700px){ .chart-grid{grid-template-columns:1fr 1fr;} .chart-full{grid-column:1/-1;} }
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
.chart-title { font-size:13px; font-weight:700; margin-bottom:3px; }
.chart-sub { font-size:11px; color:var(--t3); margin-bottom:16px; }
.chart-wrap { position:relative; height:200px; }
.chart-full .chart-wrap { height:240px; }

/* ── Tables ── */
.tbl-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--border); margin-bottom:24px; }
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { background:var(--surface2); padding:12px 16px; text-align:left; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--t3); white-space:nowrap; }
.tbl td { padding:12px 16px; border-top:1px solid var(--border); color:var(--t2); }
.tbl tr:hover td { background:rgba(255,255,255,.02); }
.tc-name { color:var(--t1)!important; font-weight:600; }
.tc-num { font-variant-numeric:tabular-nums; font-weight:700; }
.tc-green { color:var(--green)!important; } .tc-yellow { color:var(--yellow)!important; } .tc-red { color:var(--red)!important; }
.trend-dn { color:var(--green); font-size:12px; font-weight:700; }
.trend-up { color:var(--red); font-size:12px; font-weight:700; }
.trend-eq { color:var(--t3); font-size:12px; font-weight:700; }

/* ── Chips ── */
.chip { display:inline-block; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; }
.chip-green { background:rgba(34,197,94,.1); color:var(--green); }
.chip-yellow { background:rgba(234,179,8,.1); color:var(--yellow); }
.chip-red { background:rgba(239,68,68,.1); color:var(--red); }
.chip-blue { background:rgba(59,130,246,.1); color:var(--accent); }
.chip-gray { background:var(--surface2); color:var(--t3); }

/* ── Alert banner ── */
.alert-banner {
  background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2);
  border-radius:10px; padding:12px 16px; font-size:12px; color:#fca5a5;
  margin-bottom:16px; display:flex; align-items:center; gap:8px;
}
.info-banner {
  background:rgba(59,130,246,.08); border:1px solid rgba(59,130,246,.2);
  border-radius:10px; padding:12px 16px; font-size:12px; color:#93c5fd;
  margin-bottom:16px; display:flex; align-items:center; gap:8px;
}

/* ── Mark input table (Guru) ── */
.mark-input {
  width:64px; background:var(--surface2); border:1px solid var(--border);
  color:var(--t1); border-radius:6px; padding:6px 8px; font-size:13px;
  font-family:inherit; font-weight:600; text-align:center; outline:none;
  font-variant-numeric:tabular-nums;
}
.mark-input:focus { border-color:var(--accent); }
.mark-input::-webkit-inner-spin-button { display:none; }

/* ── Buttons ── */
.btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.btn-primary {
  display:inline-flex; align-items:center; gap:7px;
  background:var(--accent); color:#fff; border:none; border-radius:9px;
  padding:9px 16px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;
}
.btn-primary:hover { opacity:.85; }
.btn-secondary {
  display:inline-flex; align-items:center; gap:7px;
  background:var(--surface); color:var(--t1); border:1px solid var(--border);
  border-radius:9px; padding:9px 16px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;
}
.btn-secondary:hover { background:var(--surface2); }
.btn-sm {
  padding:5px 12px; font-size:12px; background:var(--surface2); color:var(--t2);
  border:1px solid var(--border); border-radius:7px; font-weight:600; cursor:pointer; font-family:inherit;
}
.btn-sm:hover { color:var(--t1); }
.btn-save {
  padding:5px 14px; font-size:12px; background:var(--accent); color:#fff;
  border:none; border-radius:7px; font-weight:600; cursor:pointer; font-family:inherit;
}
.btn-save:hover { opacity:.85; }

/* ── Student rows ── */
.student-list { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
.student-row {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:13px 16px; display:flex; align-items:center; gap:14px;
}
.student-row.at-risk { border-left:3px solid var(--red); }
.s-av {
  width:34px; height:34px; border-radius:50%; background:var(--surface2);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--t2); flex-shrink:0;
}
.student-row.at-risk .s-av { background:rgba(239,68,68,.15); color:var(--red); }
.s-info { flex:1; min-width:0; }
.s-name { font-size:13px; font-weight:600; }
.s-meta { font-size:11px; color:var(--t3); margin-top:1px; }
.s-spark { flex-shrink:0; }
.s-mark { font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0; min-width:34px; text-align:right; }

/* ── Semak Pengisian ── */
.prog-row {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; display:flex; align-items:center; gap:14px; margin-bottom:8px;
}
.prog-icon { font-size:20px; flex-shrink:0; }
.prog-info { flex:1; min-width:0; }
.prog-name { font-size:13px; font-weight:600; color:var(--t1); }
.prog-sub { font-size:11px; color:var(--t3); margin-top:2px; }
.prog-dots { display:flex; gap:6px; flex-shrink:0; align-items:center; }
.dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
.dot-ok   { background:rgba(34,197,94,.15); color:var(--green); }
.dot-miss { background:rgba(239,68,68,.12); color:var(--red); }
.dot-lbl  { font-size:10px; color:var(--t3); margin-right:4px; }

/* ── Ranking ── */
.rank-num { font-size:16px; font-weight:800; color:var(--t3); width:28px; text-align:center; flex-shrink:0; }
.rank-num.top { color:var(--yellow); }

/* ── Progress bar ── */
.progress-wrap { margin-top:4px; }
.progress-bg { background:var(--surface2); border-radius:99px; height:8px; overflow:hidden; margin-bottom:6px; }
.progress-fill { height:100%; background:var(--accent); border-radius:99px; width:0; transition:width .25s ease; }
.progress-lbl { font-size:12px; color:var(--t3); text-align:center; }
.success-msg { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); border-radius:10px; padding:12px 18px; color:var(--green); font-size:13px; font-weight:600; text-align:center; margin-top:12px; }

/* ── Upload zone ── */
.upload-zone {
  border:2px dashed var(--border); border-radius:16px; padding:48px 24px;
  text-align:center; cursor:pointer; transition:border-color .2s, background .2s; margin-bottom:20px;
}
.upload-zone:hover { border-color:var(--accent); background:rgba(59,130,246,.05); }
.upload-icon { font-size:36px; margin-bottom:12px; }
.upload-title { font-size:15px; font-weight:700; margin-bottom:6px; }
.upload-sub { font-size:13px; color:var(--t3); }

/* ── Save toast ── */
.toast {
  position:fixed; bottom:24px; right:24px; z-index:200;
  background:var(--green); color:#fff; padding:12px 20px; border-radius:12px;
  font-size:13px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.4);
  transform:translateY(80px); opacity:0; transition:transform .3s ease, opacity .3s ease;
}
.toast.show { transform:translateY(0); opacity:1; }

/* ── Modal ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal-overlay[hidden] { display:none!important; }
.modal {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:24px; width:100%; max-width:440px; box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.modal-title { font-size:16px; font-weight:800; margin-bottom:4px; }
.modal-sub   { font-size:12px; color:var(--t3); margin-bottom:20px; }
.form-group  { margin-bottom:14px; }
.form-label  { display:block; font-size:11px; font-weight:600; color:var(--t3); letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
.form-input  {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  color:var(--t1); border-radius:8px; padding:10px 12px; font-size:13px;
  font-family:inherit; outline:none;
}
.form-input:focus { border-color:var(--accent); }
.form-row    { display:flex; gap:10px; }
.form-row .form-group { flex:1; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

/* ── Empty state ── */
.empty-state { text-align:center; padding:48px 16px; color:var(--t3); }
.empty-state .empty-icon { font-size:44px; margin-bottom:14px; }
.empty-state .empty-title { font-size:15px; font-weight:700; color:var(--t2); margin-bottom:6px; }
.empty-state .empty-sub   { font-size:13px; line-height:1.6; }

/* ── Kelas cards ── */
.kelas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; margin-bottom:24px; }
.kelas-card {
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:18px 20px; display:flex; flex-direction:column; gap:14px;
  transition:border-color .15s;
}
.kelas-card:hover { border-color:var(--accent); }
.kelas-card-top { display:flex; align-items:flex-start; gap:12px; }
.kelas-av {
  width:44px; height:44px; border-radius:10px; background:rgba(59,130,246,.15);
  color:var(--accent); display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; flex-shrink:0; letter-spacing:-.5px;
}
.kelas-info { flex:1; min-width:0; }
.kelas-subj { font-size:14px; font-weight:800; }
.kelas-meta { font-size:12px; color:var(--t3); margin-top:3px; }
.kelas-stats { display:flex; gap:16px; padding:12px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.kelas-stat { display:flex; flex-direction:column; gap:2px; }
.kelas-stat-val { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
.kelas-stat-lbl { font-size:10px; color:var(--t3); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.kelas-btns { display:flex; gap:8px; }

/* ── Sub-view breadcrumb ── */
.breadcrumb {
  display:flex; align-items:center; gap:8px; margin-bottom:20px;
  font-size:13px; color:var(--t3);
}
.breadcrumb-back {
  display:flex; align-items:center; gap:4px; color:var(--accent);
  background:none; border:none; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:600; padding:0;
}
.breadcrumb-back:hover { opacity:.8; }
.breadcrumb-sep { color:var(--border); }
.breadcrumb-cur { color:var(--t1); font-weight:700; }

/* ── Ujian selection cards ── */
.ujian-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:24px; }
.ujian-card {
  background:var(--surface); border:2px solid var(--border); border-radius:12px;
  padding:16px; cursor:pointer; transition:border-color .15s, background .15s;
  display:flex; flex-direction:column; gap:12px;
}
.ujian-card:hover { border-color:var(--accent); background:var(--surface2); }
.ujian-active { border-color:var(--accent) !important; background:rgba(59,130,246,.07) !important; }
.ujian-card-top { display:flex; align-items:flex-start; gap:12px; }
.ujian-icon { font-size:22px; flex-shrink:0; margin-top:2px; }
.ujian-label { font-size:15px; font-weight:800; }
.ujian-full { font-size:12px; color:var(--t2); margin-top:2px; }
.ujian-bulan { font-size:11px; color:var(--t3); margin-top:2px; }
.ujian-active-badge {
  font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px;
  background:rgba(59,130,246,.15); color:var(--accent); white-space:nowrap; flex-shrink:0;
}
.ujian-card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--border); }
.dot-sep { background:rgba(234,179,8,.15); color:var(--yellow); }
.mark-input::placeholder { color:var(--t3); }
.rekod-ujian-header {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  background:rgba(59,130,246,.06); border:1px solid rgba(59,130,246,.2);
  border-radius:10px; padding:12px 16px; margin-bottom:16px;
}

/* ── Rekod markah header ── */
.rekod-header {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 18px; display:flex; align-items:center; gap:12px; margin-bottom:20px;
}
.rekod-kelas-badge {
  background:rgba(59,130,246,.12); color:var(--accent); border:1px solid rgba(59,130,246,.2);
  border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; flex-shrink:0;
}
.rekod-kelas-info { flex:1; min-width:0; }
.rekod-kelas-name { font-size:13px; font-weight:700; }
.rekod-kelas-meta { font-size:11px; color:var(--t3); margin-top:2px; }

/* ── Tetapan info card (kept for Tetapan modal trigger) ── */
.setup-card {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:18px 20px; display:flex; align-items:center; gap:16px; margin-bottom:12px;
}
.setup-icon { font-size:28px; flex-shrink:0; }
.setup-info { flex:1; min-width:0; }
.setup-title { font-size:14px; font-weight:700; }
.setup-sub   { font-size:12px; color:var(--t3); margin-top:2px; }
</style>
</head>
<body>

<!-- Demo role switcher (shown when no role in URL) -->
<div class="demo-bar" id="demo-bar" hidden>
  <strong>⚠ Demo:</strong> Pilih peranan untuk pratonton paparan
  <div class="demo-btns">
    <button class="demo-btn guru"      onclick="switchRole('teacher')">👩‍🏫 Guru</button>
    <button class="demo-btn pentadbir" onclick="switchRole('school_admin')">🏫 Pentadbir Sekolah</button>
    <button class="demo-btn ppd"       onclick="switchRole('ppd_admin')">🏛 Admin PPD</button>
  </div>
</div>

<header class="topbar">
  <a href="ppd-dalat.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Portal PPD Dalat
  </a>
  <div class="topbar-sep"></div>
  <span class="topbar-title">Analitik SPM</span>
  <span class="role-chip" id="role-chip">—</span>
  <span class="topbar-user" id="topbar-user">Daerah Dalat, Sarawak</span>
</header>

<nav class="tab-bar" id="tab-bar"></nav>

<main class="main" id="main"></main>

<div class="toast" id="toast"></div>

<!-- Modal: Tambah / Edit Pelajar -->
<div class="modal-overlay" id="modal-tambah" hidden onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-tambah-title">Tambah Pelajar</div>
    <div class="modal-sub" id="modal-tambah-sub">Isi maklumat pelajar untuk ditambah ke senarai kelas</div>

function sparkSVG(marks, isAlert) {
  const arr = Object.values(marks);
  if(arr.length < 2) return '';
  const W=80, H=32, lo=Math.min(...arr)-5, hi=Math.max(...arr)+5;
  const sx=W/(arr.length-1), sy=H/(hi-lo);
  const pts=arr.map((v,i)=>`${(i*sx).toFixed(1)},${(H-(v-lo)*sy).toFixed(1)}`).join(' ');
  const lx=((arr.length-1)*sx).toFixed(1), ly=(H-(arr[arr.length-1]-lo)*sy).toFixed(1);
  const col=isAlert?'#ef4444':'#3b82f6';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="3.5" fill="${col}"/>
  </svg>`;
}

// ── Tab: Rekod Markah ─────────────────────────────────────
const UJIAN_LIST = [
  { key:'ar1',       label:'AR1',       full:'Ujian Pertengahan Tahun', icon:'📋', bulan:'April – Mei' },
  { key:'ar2',       label:'AR2',       full:'Ujian Akhir Tahun',       icon:'📋', bulan:'Ogos – Sep' },
  { key:'percubaan', label:'Percubaan', full:'Percubaan SPM',           icon:'📝', bulan:'Oktober' },
];

function ujianStatus(ak, key) {
  if (!ak || ak.pelajar.length === 0) return 'tiada';
  // "selesai" = ada markah (number) ATAU ditanda TH (null)
  const selesai = ak.pelajar.filter(p => {
    const v = (markState[p.id] || {})[key];
    return v !== undefined; // ada nilai (number atau null=TH)
  }).length;
  if (selesai === 0)                  return 'belum';
  if (selesai < ak.pelajar.length)    return 'separa';
  return 'lengkap';
}

function renderRekodView(ak) {
  if (!ak) return `
    <div class="empty-state">
      <div class="empty-icon">📝</div>
      <div class="empty-title">Pilih kelas dahulu</div>
      <div class="empty-sub">Pergi ke tab <strong>Kelas Saya</strong>, pilih kelas dan klik <strong>"Rekod Markah"</strong>.</div>
    </div>`;

  const bil = ak.pelajar.length;

  const ujianCards = UJIAN_LIST.map(u => {
    const status = ujianStatus(ak, u.key);
    const isActive = activeUjian === u.key;
    const statusCfg = {
      tiada:    { chip:'chip-gray',   label:'Tiada murid',   dot:'' },
      belum:    { chip:'chip-gray',   label:'Belum diisi',   dot:'dot-miss' },
      separa:   { chip:'chip-yellow', label:'Sedang diisi',  dot:'dot-sep' },
      lengkap:  { chip:'chip-green',  label:'Lengkap',       dot:'dot-ok' },
    }[status];

    return `<div class="ujian-card${isActive?' ujian-active':''}"
      onclick="${bil > 0 ? `pilihUjian('${u.key}')` : ''}">
      <div class="ujian-card-top">
        <div class="ujian-icon">${u.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="ujian-label">${u.label}</div>
          <div class="ujian-full">${u.full}</div>
          <div class="ujian-bulan">${u.bulan} ${ak.tahun}</div>
        </div>
        ${isActive ? `<div class="ujian-active-badge">Sedang diisi</div>` : ''}
      </div>
      <div class="ujian-card-footer">
        <span class="chip ${statusCfg.chip}" style="font-size:11px">${statusCfg.label}</span>
        ${status !== 'tiada' ? (() => {
          const selesai = ak.pelajar.filter(p => (markState[p.id]||{})[u.key] !== undefined).length;
          const th      = ak.pelajar.filter(p => (markState[p.id]||{})[u.key] === null).length;
          return `<span style="font-size:11px;color:var(--t3)">${selesai}/${bil} murid${th>0?` · ${th} TH`:''}</span>`;
        })() : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="rekod-header">
      <div class="rekod-kelas-badge">${kelasAv(ak.subjek)}</div>
      <div class="rekod-kelas-info">
        <div class="rekod-kelas-name">${ak.subjek} · Tingkatan ${ak.tingkatan} ${ak.kelas}</div>
        <div class="rekod-kelas-meta">${ak.tahun} · ${bil} murid</div>
      </div>
      <button class="btn-sm" onclick="bukaUrusPelajar('${ak.id}');switchTab('guru-kelas')">Urus Murid</button>
    </div>

    <div class="sh" style="margin-bottom:14px">
      <div>
        <div class="sh-title" style="font-size:14px">Pilih Ujian</div>
        <div class="sh-sub">Pilih ujian yang ingin diisi markah</div>
      </div>
    </div>
    <div class="ujian-grid">${ujianCards}</div>

    ${!activeUjian ? '' : bil === 0 ? `
      <div class="empty-state">
        <div class="empty-icon">👤</div>
        <div class="empty-title">Tiada murid dalam kelas ini</div>
        <div class="empty-sub">Daftar murid dahulu melalui <strong>"Urus Murid"</strong> di atas.</div>
      </div>` : `
      <div class="rekod-ujian-header">
        <div>
          <div style="font-size:14px;font-weight:800">${UJIAN_LIST.find(u=>u.key===activeUjian)?.full}</div>
          <div style="font-size:12px;color:var(--t3);margin-top:2px">${UJIAN_LIST.find(u=>u.key===activeUjian)?.bulan} ${ak.tahun} · Isi markah murid di bawah</div>
        </div>
        <button class="btn-sm" onclick="activeUjian=null;pilihUjian(null)" style="font-size:11px">✕ Tutup</button>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th style="width:40px">No.</th>
            <th>Nama Murid</th>
            <th style="width:60px;text-align:center">Jantina</th>
            <th style="width:110px;text-align:center">Markah (0–100)</th>
            <th style="width:80px;text-align:center">Gred</th>
            <th style="width:90px;text-align:center">Trend</th>
            <th style="width:80px"></th>
          </tr></thead>
          <tbody id="guru-mark-tbody"></tbody>
        </table>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="saveAllMarks()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Simpan Markah ${UJIAN_LIST.find(u=>u.key===activeUjian)?.label}
        </button>
        <button class="btn-secondary" onclick="refreshMarkTable()">Muat Semula</button>
      </div>`}
  `;
}

function isAlert(id) {
  const m = markState[id];
  if (!m) return false;
  // Berisiko jika trend merosot lebih dari 5 markah dari AR1 ke Percubaan
  return (m.ar1 - m.percubaan) > 5;
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('#main > section').forEach(s => s.classList.toggle('active', s.id === tabId));
}

  switchTab('guru-kelas');

function bukaRekodMarkah(kelasId) {

  activeKelasId = kelasId;

}

function pilihUjian(ujian) {

  const rekodSection = document.getElementById('guru-rekod');

function openDaftarKelas(editId) {
  const m = document.getElementById('modal-kelas');
  if (editId) {
    const k = kelasList.find(x => x.id === editId);
    if (!k) return;
    document.getElementById('modal-kelas-title').textContent = 'Edit Kelas';
    document.getElementById('kelas-edit-id').value = editId;
    document.getElementById('kelas-subjek').value = k.subjek;
    document.getElementById('kelas-tingkatan').value = k.tingkatan;
    document.getElementById('kelas-nama').value = k.kelas;
    document.getElementById('kelas-tahun').value = k.tahun;
  } else {
    document.getElementById('modal-kelas-title').textContent = 'Daftar Kelas Baru';
    document.getElementById('kelas-edit-id').value = '';
    document.getElementById('kelas-subjek').value = '';
    document.getElementById('kelas-tingkatan').value = '5';
    document.getElementById('kelas-nama').value = '';

  }

  setTimeout(() => document.getElementById('kelas-subjek').focus(), 50);

function closeDaftarKelasModal() {
  document.getElementById('modal-kelas').hidden = true;
}

function simpanKelas() {
  const subjek    = document.getElementById('kelas-subjek').value.trim();
  const tingkatan = document.getElementById('kelas-tingkatan').value;
  const kelasNama = document.getElementById('kelas-nama').value.trim();
  const tahun     = document.getElementById('kelas-tahun').value;
  if (!subjek || !kelasNama) { alert('Sila isi Mata Pelajaran dan Nama Kelas.'); return; }

  const editId = document.getElementById('kelas-edit-id').value;
  if (editId) {
    const k = kelasList.find(x => x.id === editId);
    if (k) { k.subjek = subjek; k.tingkatan = tingkatan; k.kelas = kelasNama; k.tahun = tahun; }
    showToast(`✓ Kelas dikemaskini: ${subjek} · T${tingkatan} ${kelasNama}`);
  } else {
    const id = 'k' + (kelasNextId++);
    kelasList.push({ id, subjek, tingkatan, kelas: kelasNama, tahun, pelajar: [] });
    showToast(`✓ Kelas baru didaftar: ${subjek} · T${tingkatan} ${kelasNama}`);
  }
  closeDaftarKelasModal();
  renderGuruMain();
  bindTabs();
}

function padamKelas(kelasId) {
  const k = kelasList.find(x => x.id === kelasId);
  if (!k) return;
  if (!confirm(`Padam kelas "${k.subjek} · T${k.tingkatan} ${k.kelas}"?\nSemua ${k.pelajar.length} murid dalam kelas ini akan turut dipadam.`)) return;
  k.pelajar.forEach(p => delete markState[p.id]);
  kelasList = kelasList.filter(x => x.id !== kelasId);
  if (activeKelasId === kelasId) { activeKelasId = null; guruView = 'kelas'; }
  showToast(`Kelas ${k.subjek} dipadam`);
  renderGuruMain();
  bindTabs();
}

// markState[id][pep] values:
//   number (0-100) = markah sah
//   null           = Tidak Hadir (TH)
//   undefined      = belum diisi (murid baru / ujian belum buka)

function isTH(id, pep) {
  return markState[id] !== undefined && markState[id][pep] === null;
}

function toggleTH(id, pep) {
  if (!markState[id]) markState[id] = {};
  markState[id][pep] = isTH(id, pep) ? undefined : null;
  refreshMarkTable();
  refreshUjianCards();
}

function refreshUjianCards() {
  // Re-render just the ujian grid status chips without full re-render
  const ak = getActiveKelas();
  if (!ak) return;
  UJIAN_LIST.forEach(u => {
    const status = ujianStatus(ak, u.key);
    const filled = ak.pelajar.filter(p => {
      const v = (markState[p.id] || {})[u.key];
      return v !== undefined && v !== null && v !== '';
    }).length;
    const th = ak.pelajar.filter(p => isTH(p.id, u.key)).length;
    const total = ak.pelajar.length;
    // find card by data attr and update footer
    const cards = document.querySelectorAll('.ujian-card');
    cards.forEach(card => {
      if (card.querySelector('.ujian-label')?.textContent === u.label) {
        const footer = card.querySelector('.ujian-card-footer');
        if (!footer) return;
        const statusCfg = {
          tiada:   { chip:'chip-gray',   label:'Tiada murid' },
          belum:   { chip:'chip-gray',   label:'Belum diisi' },
          separa:  { chip:'chip-yellow', label:'Sedang diisi' },
          lengkap: { chip:'chip-green',  label:'Lengkap' },
        }[status];
        footer.innerHTML = `<span class="chip ${statusCfg.chip}" style="font-size:11px">${statusCfg.label}</span>
          ${status !== 'tiada' ? `<span style="font-size:11px;color:var(--t3)">${filled+th}/${total} murid${th>0?` · ${th} TH`:''}</span>` : ''}`;
      }
    });
  });
}

function refreshMarkTable() {
  const tbody = document.getElementById('guru-mark-tbody');
  if (!tbody) return;
  const ak  = getActiveKelas();
  if (!ak || !activeUjian) return;
  const pep  = activeUjian;
  const prev = { percubaan:'ar2', ar2:'ar1', ar1:null };

  tbody.innerHTML = ak.pelajar.map((p, i) => {
    if (!markState[p.id]) markState[p.id] = {};
    const ms       = markState[p.id];
    const th       = ms[pep] === null;
    const rawMark  = ms[pep];
    const noData   = rawMark === undefined; // belum diisi langsung
    const mark     = (!th && !noData) ? rawMark : 0;
    const prevPep  = prev[pep];
    const prevRaw  = prevPep !== null ? ms[prevPep] : undefined;
    const prevMark = (prevRaw !== undefined && prevRaw !== null) ? prevRaw : null;
    const gred     = (!th && !noData) ? markToGred(mark) : null;
    const jIcon    = p.jantina === 'P' ? '♀' : '♂';

    const trendHtml = th || noData || prevMark === null
      ? `<span class="trend-eq">—</span>`
      : mark < prevMark - 3
        ? `<span class="trend-up">▼ Turun</span>`
        : mark > prevMark + 3
          ? `<span class="trend-dn">▲ Naik</span>`
          : `<span class="trend-eq">— Stabil</span>`;

    // row highlight: merah kalau TH, kuning kalau noData
    const rowStyle = th ? 'opacity:.6' : noData ? 'background:rgba(234,179,8,.04)' : '';

    return `<tr style="${rowStyle}">
      <td style="color:var(--t3);text-align:center">${String(i+1).padStart(2,'0')}</td>
      <td class="tc-name">${p.nama}${noData&&!th?` <span style="font-size:10px;color:var(--yellow);font-weight:700">BARU</span>`:''}${th?` <span style="font-size:10px;color:var(--t3)">Tidak Hadir</span>`:''}</td>
      <td style="text-align:center;color:var(--t3);font-size:13px">${jIcon}</td>
      <td style="text-align:center">
        ${th
          ? `<span class="chip chip-gray" style="font-size:12px;letter-spacing:.04em">TH</span>`
          : `<input type="number" class="mark-input" value="${noData?'':mark}" placeholder="—"
               min="0" max="100" data-id="${p.id}" data-pep="${pep}" onchange="updateMark(this)">`
        }
      </td>
      <td style="text-align:center">
        ${th  ? `<span style="color:var(--t3);font-size:12px">—</span>`
              : noData ? `<span style="color:var(--yellow);font-size:12px">—</span>`
              : `<span class="chip ${gredClass(gred)}">${gred}</span>`}
      </td>
      <td style="text-align:center">${trendHtml}</td>
      <td>
        <div style="display:flex;gap:5px;justify-content:flex-end">
          <button class="btn-sm${th?' btn-th-active':''}" title="${th?'Batal TH':'Tandakan Tidak Hadir'}"
            onclick="toggleTH('${p.id}','${pep}')"
            style="${th?'background:rgba(100,116,139,.2);color:var(--t2);border-color:var(--border)':'color:var(--t3)'}">
            ${th?'Batal TH':'TH'}
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function updateMark(el) {
  const id  = el.dataset.id;
  const pep = el.dataset.pep;
  const raw = el.value.trim();
  if (!markState[id]) markState[id] = {};
  if (raw === '') {
    markState[id][pep] = undefined; // kosongkan semula
  } else {
    markState[id][pep] = Math.max(0, Math.min(100, +raw || 0));
    el.value = markState[id][pep];
  }
  refreshUjianCards();
}

function saveAllMarks() {
  const ak = getActiveKelas();
  showToast(`✓ Semua markah ${ak ? ak.pelajar.length : 0} murid telah disimpan`);
}

function openEditPelajar(id) {

function simpanPelajarModal() {
  const nama = document.getElementById('inp-nama').value.trim();
  if (!nama) { document.getElementById('inp-nama').focus(); return; }
  const editId  = document.getElementById('inp-edit-id').value;
  const jantina = document.getElementById('inp-jantina').value;
  const ar1     = Math.max(0, Math.min(100, +document.getElementById('inp-ar1').value || 0));
  const ar2     = Math.max(0, Math.min(100, +document.getElementById('inp-ar2').value || ar1));
  const perc    = Math.max(0, Math.min(100, +document.getElementById('inp-perc').value || ar1));

  const ak = getActiveKelas();
  if (editId) {
    const p = ak ? ak.pelajar.find(x => x.id === editId) : null;
    if (p) { p.nama = nama; p.jantina = jantina; }
    markState[editId] = { ar1, ar2, percubaan: perc };
    showToast(`✓ Maklumat ${nama} dikemaskini`);
  } else {
    if (!ak) { alert('Pilih kelas dahulu sebelum tambah murid.'); return; }
    const id = 'p' + (++pelajarNextId);
    ak.pelajar.push({ id, nama, jantina });
    markState[id] = { ar1, ar2, percubaan: perc };
    showToast(`✓ ${nama} berjaya ditambah`);
  }
  closeModal();
  renderGuruMain();
  bindTabs();
}

function padamPelajar(id) {
  const ak = getActiveKelas();
  if (!ak) return;
  const p = ak.pelajar.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`Padam ${p.nama} daripada kelas ini?`)) return;
  ak.pelajar = ak.pelajar.filter(x => x.id !== id);
  delete markState[id];
  showToast(`Murid ${p.nama} dipadam`);
  renderGuruMain();
  bindTabs();
}

function triggerFileUpload() {
  document.getElementById('file-input').click();
}

function handleFileDrop(event) {
  const file = event.dataTransfer.files[0];
  if (file) processFile(file);
}

function handleFileUpload(input) {
  const file = input.files[0];
  if (file) processFile(file);
}

function processFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['csv','xlsx','xls'].includes(ext)) {
    alert('Hanya fail CSV (.csv) atau Excel (.xlsx, .xls) dibenarkan.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let rows = [];
      if (ext === 'csv') {
        rows = parseCSV(e.target.result);
      } else {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
        rows = parseRows(data);
      }
      if (rows.length === 0) { alert('Tiada data pelajar yang dikesan dalam fail.'); return; }
      showImportPreview(rows, file.name);
    } catch(err) {
      alert('Ralat membaca fail: ' + err.message);
    }
  };
  if (ext === 'csv') reader.readAsText(file, 'UTF-8');
  else reader.readAsArrayBuffer(file);
}

// Map column header names (case-insensitive) to standard keys
const COL_MAP = {
  nama:['nama','name','nama pelajar','nama penuh'],
  jantina:['jantina','gender','jantina pelajar','sex'],
  kelas:['kelas','class','tingkatan'],
  ar1:['ar1','ujian 1','ujian pertengahan','mid','markah ar1','ar 1'],
  ar2:['ar2','ujian 2','ujian akhir','end','markah ar2','ar 2'],
  percubaan:['percubaan','trial','perc','markah percubaan','percubaan spm'],
};

function findCol(headers, key) {
  const aliases = COL_MAP[key] || [];
  return headers.findIndex(h => aliases.includes(String(h).toLowerCase().trim()));
}

function parseRows(data) {
  if (data.length < 2) return [];
  const headers = data[0].map(h => String(h).toLowerCase().trim());
  const iNama  = findCol(headers, 'nama');
  const iJant  = findCol(headers, 'jantina');
  const iKelas = findCol(headers, 'kelas');
  const iAr1   = findCol(headers, 'ar1');
  const iAr2   = findCol(headers, 'ar2');
  const iPerc  = findCol(headers, 'percubaan');

  return data.slice(1).filter(r => r.some(c => String(c).trim())).map(r => {
    const nama = iNama >= 0 ? String(r[iNama] || '').trim() : '';
    const rawJ = iJant >= 0 ? String(r[iJant] || '').trim().toUpperCase() : '';
    const jantina = rawJ.startsWith('P') ? 'P' : 'L';
    const kelas  = iKelas >= 0 ? String(r[iKelas] || '').trim() : '';
    const ar1    = iAr1  >= 0 ? clamp(+r[iAr1]  || 0) : 0;
    const ar2    = iAr2  >= 0 ? clamp(+r[iAr2]  || 0) : ar1;
    const perc   = iPerc >= 0 ? clamp(+r[iPerc] || 0) : ar1;
    return { nama, jantina, kelas, ar1, ar2, percubaan: perc };
  }).filter(r => r.nama);
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g,'')));
  return parseRows(lines);
}

function clamp(v) { return Math.max(0, Math.min(100, isNaN(v)?0:v)); }

function showImportPreview(rows, filename) {
  importBuffer = rows;
  document.getElementById('import-sub').textContent =
    `${rows.length} pelajar dikesan dalam "${filename}" — semak sebelum import`;
  document.getElementById('btn-confirm-import').textContent = `Import ${rows.length} Pelajar`;

  const warn = rows.filter(r => !r.nama).length;
  document.getElementById('import-warn').textContent =
    warn > 0 ? `⚠ ${warn} baris diabaikan kerana nama kosong` : '';

  document.getElementById('import-preview').innerHTML = `
    <table class="tbl" style="font-size:12px">
      <thead><tr><th>No.</th><th>Nama Pelajar</th><th>Jantina</th><th>Kelas</th><th style="text-align:center">AR1</th><th style="text-align:center">AR2</th><th style="text-align:center">Percubaan</th></tr></thead>
      <tbody>${rows.map((r,i) => `<tr>
        <td style="color:var(--t3)">${i+1}</td>
        <td class="tc-name">${r.nama || '<span style="color:var(--red)">—</span>'}</td>
        <td style="color:var(--t3)">${r.jantina==='P'?'♀ P':'♂ L'}</td>
        <td style="color:var(--t3);font-size:11px">${r.kelas||'—'}</td>
        <td style="text-align:center">${r.ar1||'—'}</td>
        <td style="text-align:center">${r.ar2||'—'}</td>
        <td style="text-align:center">${r.percubaan||'—'}</td>
      </tr>`).join('')}</tbody>
    </table>`;

}

function confirmImport() {
  const ak = getActiveKelas();
  if (!ak) { alert('Pilih kelas dahulu sebelum import murid.'); return; }
  let added = 0;
  importBuffer.forEach(r => {
    if (!r.nama) return;
    const id = 'p' + (++pelajarNextId);
    ak.pelajar.push({ id, nama: r.nama, jantina: r.jantina });
    markState[id] = { ar1: r.ar1, ar2: r.ar2, percubaan: r.percubaan };
    added++;
  });
  importBuffer = [];
  closeImportModal();
  showToast(`✓ ${added} pelajar berjaya diimport`);
  renderGuruMain();
  bindTabs();
}

function markToGred(m) {
  if(m>=90)return'A+'; if(m>=80)return'A'; if(m>=75)return'A-';
  if(m>=70)return'B+'; if(m>=65)return'B'; if(m>=60)return'C+';
  if(m>=55)return'C';  if(m>=50)return'D'; if(m>=45)return'E'; return'G';
}
function gredClass(g) {
  if(['A+','A','A-'].includes(g)) return 'chip-green';
  if(['B+','B'].includes(g))      return 'chip-blue';
  if(['C+','C'].includes(g))      return 'chip-yellow';
  return 'chip-red';
}

  });

function trendCell(curr, prev) {
  const d = (curr - prev).toFixed(2);
  if(Math.abs(d)<0.05) return `<span class="trend-eq">— Stabil</span>`;
  return d<0 ? `<span class="trend-dn">▼ ${Math.abs(d)}</span>` : `<span class="trend-up">▲ ${d}</span>`;
}
function gpmpChip(v) {
  if(v<=4.5) return `<span class="chip chip-green">Cemerlang</span>`;
  if(v<=5.5) return `<span class="chip chip-yellow">Sederhana</span>`;
  return `<span class="chip chip-red">Perlu Perhatian</span>`;
}

        <div class="kpi"><div class="kpi-lbl">Kadar Pematuhan</div><div class="kpi-val yellow">${Math.round(SEKOLAH_DAERAH.filter(s=>s.hantar==='Lengkap').length/SEKOLAH_DAERAH.length*100)}%</div></div>
      </div>
      ${SEKOLAH_DAERAH.map(s=>`
        <div class="prog-row">
          <div class="prog-icon">${s.hantar==='Lengkap'?'🏫':'⚠️'}</div>
          <div class="prog-info">
            <div class="prog-name">${s.nama}</div>
            <div class="prog-sub">${s.bil} pelajar · GPS ${s.gps.toFixed(2)}</div>
          </div>
          <span class="chip ${s.hantar==='Lengkap'?'chip-green':'chip-red'}">${s.hantar==='Lengkap'?'✓ Data Lengkap':'✗ Belum Hantar'}</span>
          ${s.hantar!=='Lengkap'?`<button class="btn-sm" onclick="showToast('Notifikasi dihantar ke ${s.nama}')">Hantar Peringatan</button>`:''}
        </div>`).join('')}
    </section>

    <!-- Tab: Laporan Daerah -->
    <section id="ppd-laporan">
      <div class="sh"><div><div class="sh-title">Laporan Daerah</div><div class="sh-sub">Eksport dan jana laporan rasmi PPD Dalat</div></div></div>
      <div style="display:grid; gap:12px; max-width:600px">
        ${[
          ['📊','Laporan GPS Daerah 2024','Ringkasan GPS semua sekolah, trend dan perbandingan daerah'],
          ['🔍','Laporan Analisis Jurang','Jurang SES, jantina dan lokasi dengan cadangan intervensi'],
          ['🏆','Laporan Kedudukan Sekolah','Ranking sekolah mengikut GPS dengan analisis prestasi'],
          ['⚠️','Laporan Pelajar Berisiko Daerah','Senarai komprehensif pelajar memerlukan sokongan segera'],
          ['📤','Laporan Pematuhan Pengisian Data','Status pengisian data semua sekolah daerah'],
        ].map(([ic,title,sub])=>`
          <div class="prog-row" style="cursor:pointer">
            <div class="prog-icon">${ic}</div>
            <div class="prog-info"><div class="prog-name">${title}</div><div class="prog-sub">${sub}</div></div>
            <button class="btn-sm" onclick="showToast('Laporan sedang dijana untuk ${title}')">Jana PDF</button>
          </div>`).join('')}
      </div>
    </section>
  `;

  bindTabs();
  setTimeout(() => {
    refreshPPDTrend();
    renderPPDBar('ppd-ses-chart',    JURANG.ses.labels,     JURANG.ses.gps,     ['rgba(96,165,250,.85)','rgba(99,102,241,.85)','rgba(139,92,246,.85)']);
    renderPPDBar('ppd-jantina-chart',JURANG.jantina.labels, JURANG.jantina.gps, ['rgba(59,130,246,.85)','rgba(244,114,182,.85)']);
    renderPPDBar('ppd-lokasi-chart', JURANG.lokasi.labels,  JURANG.lokasi.gps,  ['rgba(34,197,94,.85)','rgba(234,179,8,.85)']);
    renderGapSummary();
  }, 50);
}

function refreshPPDTrend() {
  destroyChart('ppd-trend');
  const ctx = document.getElementById('ppd-trend-chart')?.getContext('2d');
  if(!ctx) return;
  charts['ppd-trend'] = new Chart(ctx, {
    type:'line',
    data:{ labels:['AR1','AR2','Percubaan','SPM'], datasets:[
      { label:'2024', data:[5.82,5.61,5.44,5.28], borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.12)', borderWidth:2.5, pointRadius:5, pointBackgroundColor:'#3b82f6', fill:true, tension:.35 },
      { label:'2023', data:[6.14,5.93,5.71,5.44], borderColor:'#94a3b8', backgroundColor:'transparent', borderWidth:1.5, pointRadius:3, borderDash:[4,3], tension:.35 },
      { label:'2022', data:[6.43,6.21,5.97,5.63], borderColor:'#475569', backgroundColor:'transparent', borderWidth:1.5, pointRadius:3, borderDash:[4,3], tension:.35 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#94a3b8', font:{size:12}}}}, scales:{ y:{min:4.5,max:7,grid:{color:'rgba(255,255,255,.06)'},ticks:{font:{size:11}}}, x:{grid:{color:'rgba(255,255,255,.06)'},ticks:{font:{size:12}}} } }
  });
}

function renderPPDBar(id, labels, data, colors) {
  destroyChart(id);
  const ctx = document.getElementById(id)?.getContext('2d');
  if(!ctx) return;
  charts[id] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderRadius:6, borderSkipped:false }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{min:4,max:7,grid:{color:'rgba(255,255,255,.06)'},ticks:{font:{size:11}}}, x:{grid:{display:false},ticks:{font:{size:12}}} } }
  });
}

function renderGapSummary() {
  destroyChart('ppd-gap');
  const ctx = document.getElementById('ppd-gap-chart')?.getContext('2d');
  if(!ctx) return;
  charts['ppd-gap'] = new Chart(ctx, {
    type:'bar',
    data:{
      labels:['SES (B40–T20)','Jantina (L–P)','Lokasi (L.Bandar–Bandar)'],
      datasets:[{ data:[1.25,0.46,0.66], backgroundColor:['rgba(239,68,68,.8)','rgba(234,179,8,.8)','rgba(234,179,8,.8)'], borderRadius:6, borderSkipped:false }]
    },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{min:0,max:1.5,grid:{color:'rgba(255,255,255,.06)'},ticks:{font:{size:11}}}, y:{grid:{display:false},ticks:{font:{size:11}}} } }
  });
}

// ── Tab binding ───────────────────────────────────────────
function renderTabs(tabs) {
  document.getElementById('tab-bar').innerHTML = tabs.map((t,i)=>
    `<button class="tab-btn${i===0?' active':''}" data-target="${t.id}">${t.label}</button>`
  ).join('');
}

function bindTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('main > section').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(btn.dataset.target);
      if(target) target.classList.add('active');
    });
  });
}

// ── Init ──────────────────────────────────────────────────
Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = '#334155';
Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
Chart.defaults.font.size   = 12;

const urlRole = getRole();
if(urlRole) {
  ROLE = urlRole;
} else {
  document.getElementById('demo-bar').hidden = false;
}
buildApp();
</script>
